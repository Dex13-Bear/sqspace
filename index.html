// CHANGE ORDERS TAB
// ─────────────────────────────────────────
function ChangeOrdersTab({ project }) {
  const [orders, setOrders] = useState([]);
  const [showAdd, setShowAdd] = useState(false);
  const [cats, setCats] = useState([]);
  const [newOrder, setNewOrder] = useState({ category_name: '', item_name: '', change_type: 'add', original_quantity: null, new_quantity: 1, original_price: null, new_price: 0, notes: '' });

  const load = useCallback(async () => {
    const { data } = await db.from('change_orders').select('*').eq('project_id', project.id).order('created_at', { ascending: false });
    const { data: c } = await db.from('work_categories').select('name').eq('project_id', project.id);
    setOrders(data || []); setCats(c || []);
  }, [project.id]);

  useEffect(() => { load(); }, [load]);

  const totalDiff = orders.reduce((s, o) => {
    const diff = (o.new_price * (o.new_quantity || 1)) - (o.original_price || 0) * (o.original_quantity || 1);
    return s + (o.change_type === 'reduce' ? -Math.abs(diff) : diff);
  }, 0);

  const addOrder = async () => {
    if (!newOrder.item_name.trim()) return;
    await db.from('change_orders').insert({ ...newOrder, project_id: project.id });
    toast('已新增追加/追減項目');
    setShowAdd(false);
    setNewOrder({ category_name: '', item_name: '', change_type: 'add', original_quantity: null, new_quantity: 1, original_price: null, new_price: 0, notes: '' });
    load();
  };

  const deleteOrder = async (id) => {
    await db.from('change_orders').delete().eq('id', id);
    load(); toast('已刪除');
  };

  return (
    <div>
      <div className="flex justify-between items-center mb-4">
        <div>
          <div className="section-title">追加追減明細清單</div>
          {!project.is_locked && <div className="text-sm text-muted mt-1" style={{ color: '#888' }}>請先鎖定第一版估價單再使用此功能</div>}
        </div>
        <div className="flex gap-2">
          <button className="btn btn-ghost btn-sm" onClick={() => alert('請使用右上角「列印」按鈕')}>列印追加追減單</button>
          <button className="btn btn-primary btn-sm" onClick={() => setShowAdd(true)}>＋ 新增項目</button>
        </div>
      </div>

      <div className="card">
        <div className="table-wrap">
          <table>
            <thead>
              <tr>
                <th style={{ width: 60 }}>狀態</th>
                <th>歸屬大項</th>
                <th>項目說明</th>
                <th className="num">原數量</th>
                <th className="num">新數量</th>
                <th className="num">原單價</th>
                <th className="num">新單價</th>
                <th className="num">差額</th>
                <th style={{ width: 50 }}></th>
              </tr>
            </thead>
            <tbody>
              {orders.map(o => {
                const diff = (o.new_price * (o.new_quantity || 1)) - ((o.original_price || 0) * (o.original_quantity || 1));
                const actualDiff = o.change_type === 'reduce' ? -Math.abs(diff) : diff;
                return (
                  <tr key={o.id}>
                    <td><span className={o.change_type === 'add' ? 'co-add' : 'co-reduce'}>{o.change_type === 'add' ? '追加' : '追減'}</span></td>
                    <td>{o.category_name}</td>
                    <td>{o.item_name}</td>
                    <td className="num">{o.original_quantity ?? '-'}</td>
                    <td className="num">{o.new_quantity ?? '-'}</td>
                    <td className="num">{o.original_price ? fmt(o.original_price) : '-'}</td>
                    <td className="num">{fmt(o.new_price)}</td>
                    <td className="num" style={{ color: actualDiff > 0 ? '#3A5240' : '#DC2626', fontWeight: 600 }}>
                      {actualDiff > 0 ? '+' : ''}{fmt(actualDiff)}
                    </td>
                    <td><button className="btn-icon" style={{ color: '#8B2E2E' }} onClick={() => deleteOrder(o.id)}>✕</button></td>
                  </tr>
                );
              })}
              {orders.length === 0 && (
                <tr><td colSpan={9} style={{ padding: '24px', textAlign: 'center', color: '#CCC' }}>尚無追加追減項目</td></tr>
              )}
            </tbody>
          </table>
          {orders.length > 0 && (
            <div style={{ padding: '12px 16px', textAlign: 'right', borderTop: '2px solid #E8E8E6', fontWeight: 700, fontSize: 14 }}>
              追加減總計差額：<span style={{ color: totalDiff >= 0 ? '#3A5240' : '#DC2626', marginLeft: 8 }}>
                {totalDiff > 0 ? '+' : ''}{fmt(totalDiff)}
              </span>
            </div>
          )}
        </div>
      </div>

      <Modal open={showAdd} title="新增追加/追減項目" onClose={() => setShowAdd(false)}
        footer={<><button className="btn btn-ghost" onClick={() => setShowAdd(false)}>取消</button><button className="btn btn-primary" onClick={addOrder}>新增</button></>}>
        <div className="grid-2">
          <div className="form-group"><label className="form-label">類型</label>
            <select className="form-select" value={newOrder.change_type} onChange={e => setNewOrder(p => ({ ...p, change_type: e.target.value }))}>
              <option value="add">追加</option><option value="reduce">追減</option>
            </select>
          </div>
          <div className="form-group"><label className="form-label">歸屬大項</label>
            <select className="form-select" value={newOrder.category_name} onChange={e => setNewOrder(p => ({ ...p, category_name: e.target.value }))}>
              <option value="">請選擇</option>
              {cats.map(c => <option key={c.name} value={c.name}>{c.name}</option>)}
            </select>
          </div>
        </div>
        <div className="form-group"><label className="form-label">項目說明 *</label>
          <input className="form-input" value={newOrder.item_name} onChange={e => setNewOrder(p => ({ ...p, item_name: e.target.value }))} /></div>
        <div className="grid-2">
          <div className="form-group"><label className="form-label">原數量</label>
            <input className="form-input" type="number" value={newOrder.original_quantity || ''} onChange={e => setNewOrder(p => ({ ...p, original_quantity: +e.target.value || null }))} /></div>
          <div className="form-group"><label className="form-label">新數量</label>
            <input className="form-input" type="number" value={newOrder.new_quantity} onChange={e => setNewOrder(p => ({ ...p, new_quantity: +e.target.value }))} /></div>
        </div>
        <div className="grid-2">
          <div className="form-group"><label className="form-label">原單價</label>
            <input className="form-input" type="number" value={newOrder.original_price || ''} onChange={e => setNewOrder(p => ({ ...p, original_price: +e.target.value || null }))} /></div>
          <div className="form-group"><label className="form-label">新單價</label>
            <input className="form-input" type="number" value={newOrder.new_price} onChange={e => setNewOrder(p => ({ ...p, new_price: +e.target.value }))} /></div>
        </div>
        <div className="form-group"><label className="form-label">備註</label>
          <input className="form-input" value={newOrder.notes} onChange={e => setNewOrder(p => ({ ...p, notes: e.target.value }))} /></div>
      </Modal>
    </div>
  );
}

// ─────────────────────────────────────────
// PURCHASE DETAIL TAB
// ─────────────────────────────────────────
function PurchaseDetailTab({ project }) {
  const [cats, setCats] = useState([]);
  const [items, setItems] = useState([]);
  const [showAddCat, setShowAddCat] = useState(false);
  const [newCatName, setNewCatName] = useState('');
  const [showAddItem, setShowAddItem] = useState(null);
  const [newItem, setNewItem] = useState({ name: '', unit: '台', quantity: 1, unit_price: 0, notes: '', is_pending: false });

  const load = useCallback(async () => {
    const { data: c } = await db.from('purchase_categories').select('*').eq('project_id', project.id).order('sort_order');
    const { data: i } = await db.from('purchase_items').select('*').eq('project_id', project.id).order('sort_order');
    setCats(c || []); setItems(i || []);
  }, [project.id]);

  useEffect(() => { load(); }, [load]);

  const catItems = catId => items.filter(i => i.category_id === catId);
  const catTotal = catId => catItems(catId).reduce((s, i) => s + i.unit_price * i.quantity, 0);
  const grandTotal = cats.reduce((s, c) => s + catTotal(c.id), 0);

  const addCat = async () => {
    if (!newCatName.trim()) return;
    await db.from('purchase_categories').insert({ project_id: project.id, name: newCatName, sort_order: cats.length });
    setShowAddCat(false); setNewCatName(''); load(); toast('已新增採購大項');
  };

  const addItem = async () => {
    if (!newItem.name.trim()) return;
    const { data: inserted } = await db.from('purchase_items').insert({ ...newItem, project_id: project.id, category_id: showAddItem }).select().single();
    if (inserted && newItem.is_pending) {
      const cat = cats.find(c => c.id === showAddItem);
      await db.from('todos').insert({ project_id: project.id, content: `[${cat?.name||'採購'}] ${newItem.name}`, todo_type: 'purchase', source: 'purchase' });
    }
    setShowAddItem(null); setNewItem({ name: '', unit: '台', quantity: 1, unit_price: 0, notes: '', is_pending: false });
    load(); toast('已新增採購項目');
  };

  const updateItem = async (id, field, val) => {
    await db.from('purchase_items').update({ [field]: val }).eq('id', id);
    setItems(prev => prev.map(i => i.id === id ? { ...i, [field]: val } : i));
    // Sync to todos when toggling is_pending
    if (field === 'is_pending') {
      const item = items.find(i => i.id === id);
      if (!item) return;
      const cat = cats.find(c => c.id === item.category_id);
      const content = `[${cat?.name||'採購'}] ${item.name}`;
      if (val) {
        // Check if todo already exists
        const { data: existing } = await db.from('todos').select('id').eq('project_id', project.id).eq('content', content).eq('todo_type', 'purchase');
        if (!existing || existing.length === 0) {
          await db.from('todos').insert({ project_id: project.id, content, todo_type: 'purchase', source: 'purchase' });
          toast('已加入待採購清單');
        }
      } else {
        await db.from('todos').delete().eq('project_id', project.id).eq('content', content).eq('todo_type', 'purchase');
        toast('已從待採購清單移除');
      }
    }
  };

  const deleteItem = async (id) => {
    const item = items.find(i => i.id === id);
    await db.from('purchase_items').delete().eq('id', id);
    if (item?.is_pending) {
      const cat = cats.find(c => c.id === item.category_id);
      await db.from('todos').delete().eq('project_id', project.id).eq('content', `[${cat?.name||'採購'}] ${item.name}`).eq('todo_type', 'purchase');
    }
    load();
  };

  const deleteCat = async (id) => {
    if (!confirm('確認刪除？')) return;
    await db.from('purchase_categories').delete().eq('id', id);
    load();
  };

  const moveCat = async (index, dir) => {
    const si = index + dir;
    if (si < 0 || si >= cats.length) return;
    const a = cats[index], b = cats[si];
    await Promise.all([
      db.from('purchase_categories').update({ sort_order: b.sort_order }).eq('id', a.id),
      db.from('purchase_categories').update({ sort_order: a.sort_order }).eq('id', b.id),
    ]);
    load();
  };

  const moveItem = async (catId, index, dir) => {
    const list = catItems(catId);
    const si = index + dir;
    if (si < 0 || si >= list.length) return;
    const reordered = [...list];
    const [moved] = reordered.splice(index, 1);
    reordered.splice(si, 0, moved);
    await Promise.all(reordered.map((it, idx) =>
      db.from('purchase_items').update({ sort_order: idx }).eq('id', it.id)
    ));
    load();
  };

  return (
    <div>
      <div className="flex justify-between items-center mb-4">
        <div>
          <div className="section-title">採購明細</div>
          <div className="text-sm text-muted mt-1">採購總計：<strong style={{ color: '#8B2E2E' }}>{fmt(grandTotal)}</strong></div>
        </div>
        <div className="flex gap-2">
          <button className="btn btn-primary btn-sm" onClick={() => setShowAddCat(true)}>＋ 新增採購大項</button>
        </div>
      </div>

      {cats.map((cat, ci) => (
        <div key={cat.id} className="mb-4">
          <div className="category-header">
            <div className="flex items-center gap-2">
              <span style={{ color: '#888', fontSize: 12 }}>{ci + 1}.</span>
              <span>{cat.name}</span>
              <span style={{ fontSize: 12, color: '#2E4D5C', marginLeft: 8 }}>小計：{fmt(catTotal(cat.id))}</span>
            </div>
            <div className="flex gap-2">
              <button className="btn btn-ghost btn-xs" style={{ padding:'3px 7px' }} onClick={() => moveCat(ci, -1)} disabled={ci===0}>↑</button>
              <button className="btn btn-ghost btn-xs" style={{ padding:'3px 7px' }} onClick={() => moveCat(ci, 1)} disabled={ci===cats.length-1}>↓</button>
              <button className="btn btn-ghost btn-xs" onClick={() => setShowAddItem(cat.id)}>＋ 新增採購項目</button>
              <button className="btn btn-xs" style={{ background: '#FFF0F0', color: '#8B2E2E', border: '1px solid #EEC0C0', borderRadius: 4, padding: '3px 8px' }}
                onClick={() => deleteCat(cat.id)}>刪除</button>
            </div>
          </div>
          <div className="category-body">
            <table style={{ width: '100%', borderCollapse: 'collapse' }}>
              <thead>
                <tr>
                  <th style={{ padding: '8px 12px', background: '#FAFAF8', fontSize: 12, color: '#666', borderBottom: '1px solid #EEE', textAlign: 'left' }}>物品/設備名稱</th>
                  <th style={{ width: 60, padding: '8px', background: '#FAFAF8', fontSize: 12, color: '#666', borderBottom: '1px solid #EEE', textAlign: 'center' }}>單位</th>
                  <th style={{ width: 70, padding: '8px', background: '#FAFAF8', fontSize: 12, color: '#666', borderBottom: '1px solid #EEE', textAlign: 'center' }}>數量</th>
                  <th style={{ width: 90, padding: '8px', background: '#FAFAF8', fontSize: 12, color: '#666', borderBottom: '1px solid #EEE', textAlign: 'right' }}>報價單價</th>
                  <th style={{ width: 100, padding: '8px', background: '#FAFAF8', fontSize: 12, color: '#666', borderBottom: '1px solid #EEE', textAlign: 'right' }}>報價總計</th>
                  <th style={{ width: 60, padding: '8px', background: '#F2F0EC', fontSize: 12, color: '#6B4835', borderBottom: '1px solid #EEE', textAlign: 'center' }}>待購</th>
                  <th style={{ padding: '8px', background: '#FAFAF8', fontSize: 12, color: '#666', borderBottom: '1px solid #EEE' }}>備註</th>
                  <th style={{ width: 60, padding: '8px', background: '#FAFAF8', borderBottom: '1px solid #EEE' }}></th>
                </tr>
              </thead>
              <tbody>
                {catItems(cat.id).map((item, ii) => (
                  <tr key={item.id} style={{ borderBottom: '1px solid #F5F5F3', background: '#fff' }}>
                    <td style={{ padding: '6px 12px' }}><InlineEdit value={item.name} onChange={val => updateItem(item.id, 'name', val)} /></td>
                    <td style={{ padding: '6px 8px', textAlign: 'center' }}><InlineEdit style={{ textAlign: 'center', width: 50 }} value={item.unit || ''} onChange={val => updateItem(item.id, 'unit', val)} /></td>
                    <td style={{ padding: '6px 8px', textAlign: 'center' }}><InlineEdit style={{ textAlign: 'center', width: 60 }} type="number" value={item.quantity} onChange={val => updateItem(item.id, 'quantity', +val)} /></td>
                    <td style={{ padding: '6px 8px', textAlign: 'right' }}><InlineEdit style={{ textAlign: 'right', width: 80 }} type="number" value={item.unit_price} onChange={val => updateItem(item.id, 'unit_price', +val)} /></td>
                    <td style={{ padding: '6px 8px', textAlign: 'right', fontWeight: 500 }}>{fmt(item.unit_price * item.quantity)}</td>
                    <td style={{ padding: '6px 8px', textAlign: 'center', background: '#F2F0EC' }}>
                      <input type="checkbox" checked={!!item.is_pending} onChange={e => updateItem(item.id, 'is_pending', e.target.checked)} style={{ accentColor: '#6B4835', width: 15, height: 15 }} />
                    </td>
                    <td style={{ padding: '6px 8px' }}><InlineEdit value={item.notes||''} onChange={val => updateItem(item.id, 'notes', val)} /></td>
                    <td style={{ padding: '4px 8px', textAlign: 'center' }}>
                      <div className="flex gap-1" style={{ justifyContent:'center' }}>
                        <button className="btn-icon" style={{ fontSize:11, color:'#888' }} onClick={() => moveItem(cat.id, ii, -1)}>↑</button>
                        <button className="btn-icon" style={{ fontSize:11, color:'#888' }} onClick={() => moveItem(cat.id, ii, 1)}>↓</button>
                        <button className="btn-icon" style={{ color: '#8B2E2E' }} onClick={() => deleteItem(item.id)}>✕</button>
                      </div>
                    </td>
                  </tr>
                ))}
                {catItems(cat.id).length === 0 && <tr><td colSpan={8} style={{ padding: 14, textAlign: 'center', color: '#CCC', fontSize: 12 }}>尚無採購項目</td></tr>}
              </tbody>
            </table>
            <div className="category-subtotal">小計：{fmt(catTotal(cat.id))}</div>
          </div>
        </div>
      ))}

      {cats.length === 0 && <div style={{ textAlign: 'center', padding: '40px', color: '#CCC', fontSize: 13 }}>尚未設定採購大項，點擊「新增採購大項」開始</div>}

      <Modal open={showAddCat} title="新增採購大項" onClose={() => setShowAddCat(false)}
        footer={<><button className="btn btn-ghost" onClick={() => setShowAddCat(false)}>取消</button><button className="btn btn-primary" onClick={addCat}>新增</button></>}>
        <div className="form-group"><label className="form-label">大項名稱 *</label>
          <input className="form-input" value={newCatName} onChange={e => setNewCatName(e.target.value)} placeholder="例：電器、家電" /></div>
      </Modal>

      <Modal open={!!showAddItem} title="新增採購項目" onClose={() => setShowAddItem(null)}
        footer={<><button className="btn btn-ghost" onClick={() => setShowAddItem(null)}>取消</button><button className="btn btn-primary" onClick={addItem}>新增</button></>}>
        <div className="form-group"><label className="form-label">物品名稱 *</label>
          <input className="form-input" value={newItem.name} onChange={e => setNewItem(p => ({ ...p, name: e.target.value }))} /></div>
        <div className="grid-3">
          <div className="form-group"><label className="form-label">單位</label>
            <input className="form-input" value={newItem.unit} onChange={e => setNewItem(p => ({ ...p, unit: e.target.value }))} /></div>
          <div className="form-group"><label className="form-label">數量</label>
            <input className="form-input" type="number" value={newItem.quantity} onChange={e => setNewItem(p => ({ ...p, quantity: +e.target.value }))} /></div>
          <div className="form-group"><label className="form-label">單價</label>
            <input className="form-input" type="number" value={newItem.unit_price} onChange={e => setNewItem(p => ({ ...p, unit_price: +e.target.value }))} /></div>
        </div>
        <div className="form-group"><label className="form-label">備註</label>
          <input className="form-input" value={newItem.notes} onChange={e => setNewItem(p => ({ ...p, notes: e.target.value }))} /></div>
        <label style={{ display:'flex', alignItems:'center', gap:8, cursor:'pointer', padding:'8px 0', fontSize:13 }}>
          <input type="checkbox" checked={newItem.is_pending} onChange={e => setNewItem(p => ({ ...p, is_pending: e.target.checked }))} style={{ accentColor:'#6B4835' }} />
          同步加入待採購清單
        </label>
      </Modal>
    </div>
  );
}

// ─────────────────────────────────────────
// SCHEDULE TAB
// ─────────────────────────────────────────
function ScheduleTab({ project }) {
  const [workCats, setWorkCats] = useState([]);
  const [items, setItems] = useState([]);
  const [events, setEvents] = useState([]);
  const [holidays, setHolidays] = useState([]);
  const [purchaseTodos, setPurchaseTodos] = useState([]);
  const [weeksPerSeg, setWeeksPerSeg] = useState(12);
  const [newEvent, setNewEvent] = useState({ start_date: today(), end_date: today(), name: '' });
  const [showAddEvent, setShowAddEvent] = useState(false);

  const load = useCallback(async () => {
    const [wc, si, se, h, pt] = await Promise.all([
      db.from('work_categories').select('*').eq('project_id', project.id).order('sort_order'),
      db.from('schedule_items').select('*').eq('project_id', project.id).order('sort_order'),
      db.from('schedule_events').select('*').eq('project_id', project.id).order('start_date'),
      db.from('holidays').select('*').order('start_date'),
      db.from('todos').select('*').eq('project_id', project.id).eq('todo_type', 'purchase').order('created_at'),
    ]);
    setWorkCats(wc.data||[]); setItems(si.data||[]); setEvents(se.data||[]); setHolidays(h.data||[]);
    setPurchaseTodos(pt.data||[]);
  }, [project.id]);

  useEffect(() => { load(); }, [load]);

  // Purchase ETA stored as schedule_items with category_name='__purchase_eta__'
  const etaItems = items.filter(i => i.category_name === '__purchase_eta__');
  const getEta = (content) => etaItems.find(i => i.stage_name === content)?.start_date || '';
  const setEta = async (content, date) => {
    const existing = etaItems.find(i => i.stage_name === content);
    if (date) {
      if (existing) {
        await db.from('schedule_items').update({ start_date: date, end_date: date }).eq('id', existing.id);
      } else {
        await db.from('schedule_items').insert({ project_id: project.id, category_name: '__purchase_eta__', stage_name: content, start_date: date, end_date: date, sort_order: 99 });
      }
    } else if (existing) {
      await db.from('schedule_items').delete().eq('id', existing.id);
    }
    load();
  };

  const addStage = async (catName) => {
    await db.from('schedule_items').insert({ project_id: project.id, category_name: catName, stage_name: '', start_date: today(), end_date: today(), sort_order: items.filter(i=>i.category_name===catName).length });
    load();
  };

  const updateStage = async (id, field, val) => {
    await db.from('schedule_items').update({ [field]: val }).eq('id', id);
    setItems(prev => prev.map(i => i.id === id ? { ...i, [field]: val } : i));
  };

  const deleteStage = async (id) => { await db.from('schedule_items').delete().eq('id', id); load(); };

  const loadHolidays = async () => {
    const existing = events.map(e => e.name);
    const toAdd = holidays.filter(h => !existing.includes(h.name));
    if (!toAdd.length) return toast('假日已全部載入');
    await db.from('schedule_events').insert(toAdd.map(h => ({ project_id: project.id, start_date: h.start_date, end_date: h.end_date, name: h.name })));
    load(); toast(`已載入 ${toAdd.length} 個假日`);
  };

  const addEvent = async () => {
    if (!newEvent.name.trim()) return;
    await db.from('schedule_events').insert({ ...newEvent, project_id: project.id });
    setNewEvent({ start_date: today(), end_date: today(), name: '' });
    setShowAddEvent(false); load(); toast('已新增事件');
  };

  const deleteEvent = async (id) => { await db.from('schedule_events').delete().eq('id', id); load(); };

  // ── Gantt calculation ──
  const allDates = [
    ...items.flatMap(i=>[i.start_date,i.end_date]),
    ...events.flatMap(e=>[e.start_date,e.end_date])
  ].filter(Boolean).sort();

  const hasData = allDates.length > 0;
  const gStart = hasData ? new Date(allDates[0]) : new Date();
  const gEnd   = hasData ? new Date(allDates[allDates.length-1]) : new Date();
  // Align to Monday
  gStart.setDate(gStart.getDate() - ((gStart.getDay()+6)%7));

  const allWeeks = [];
  const cur = new Date(gStart);
  while (cur <= gEnd || allWeeks.length < 4) {
    const ws = new Date(cur), we = new Date(cur); we.setDate(we.getDate()+6);
    allWeeks.push({ start: ws, end: we });
    cur.setDate(cur.getDate()+7);
    if (allWeeks.length > 52) break;
  }

  // Split into segments
  const segments = [];
  for (let i = 0; i < allWeeks.length; i += weeksPerSeg) {
    segments.push({ weeks: allWeeks.slice(i, i+weeksPerSeg), segIdx: segments.length });
  }

  const inWeek = (s, e, w) => s && e && new Date(s) <= w.end && new Date(e) >= w.start;
  const fmtW = d => `${(d.getMonth()+1).toString().padStart(2,'0')}/${d.getDate().toString().padStart(2,'0')}`;
  const dayName = d => ['日','一','二','三','四','五','六'][d.getDay()];

  const catStages = (catName) => items.filter(i => i.category_name === catName);

  const GanttSegment = ({ weeks, segIdx, totalSegs }) => (
    <div className="card mb-4">
      <div style={{ padding: '10px 14px 2px', fontSize: 12, color: '#888', fontWeight: 600 }}>
        第 {segIdx+1} / {totalSegs} 頁
      </div>
      <div style={{ overflowX: 'auto', padding: '0 0 12px' }}>
        <table style={{ borderCollapse: 'collapse', minWidth: '100%', fontSize: 11 }}>
          <thead>
            <tr>
              <th style={{ minWidth: 130, padding: '8px 12px', background: '#F2F0EC', border: '1px solid #DDE', textAlign: 'left', position: 'sticky', left: 0, zIndex: 1 }}>工種 ＼ 週次</th>
              {weeks.map((w, wi) => (
                <th key={wi} style={{ minWidth: 70, padding: '4px 2px', background: '#F2F0EC', border: '1px solid #DDE', textAlign: 'center', fontWeight: 600 }}>
                  第 {segIdx*weeksPerSeg+wi+1} 週<br/>
                  <span style={{ fontWeight: 400 }}>{fmtW(w.start)}({dayName(w.start)})～</span><br/>
                  <span style={{ fontWeight: 400 }}>{fmtW(w.end)}({dayName(w.end)})</span>
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {/* Special events row */}
            <tr style={{ background: '#F0F0F0' }}>
              <td style={{ padding: '6px 12px', fontWeight: 600, color: '#333', border: '1px solid #EEE', position: 'sticky', left: 0, background: '#F0F0F0', zIndex: 1 }}>節日 / 特殊事件</td>
              {weeks.map((w, wi) => {
                const evs = events.filter(e => inWeek(e.start_date, e.end_date, w));
                return (
                  <td key={wi} style={{ border: '1px solid #EEE', padding: '3px', verticalAlign: 'middle', minHeight: 28 }}>
                    {evs.map(e => (
                      <div key={e.id} style={{ background: '#CACACA', borderRadius: 3, padding: '2px 5px', fontSize: 10, marginBottom: 1, textAlign: 'center', whiteSpace: 'nowrap', overflow: 'hidden' }}>
                        {e.name}<br/>{fmtW(new Date(e.start_date))}~{fmtW(new Date(e.end_date))}
                      </div>
                    ))}
                  </td>
                );
              })}
            </tr>
            {/* Work category rows - only show cats with stages */}
            {workCats.filter(cat => catStages(cat.name).length > 0).map(cat => {
              const stages = catStages(cat.name);
              return (
                <tr key={cat.id}>
                  <td style={{ padding: '6px 12px', border: '1px solid #EEE', fontWeight: 500, fontSize: 12, position: 'sticky', left: 0, background: '#fff', zIndex: 1 }}>{cat.name}</td>
                  {weeks.map((w, wi) => {
                    const active = stages.filter(s => inWeek(s.start_date, s.end_date, w));
                    return (
                      <td key={wi} style={{ border: '1px solid #EEE', padding: '3px', verticalAlign: 'middle' }}>
                        {active.map(s => (
                          <div key={s.id} style={{ background: '#2E4D5C', color: '#fff', borderRadius: 4, padding: '3px 6px', fontSize: 10, textAlign: 'center', whiteSpace: 'nowrap', overflow: 'hidden', marginBottom: 1 }}>
                            {s.stage_name || cat.name}<br/>
                            <span style={{ fontSize: 9, opacity: 0.85 }}>{fmtW(new Date(s.start_date))}~{fmtW(new Date(s.end_date))}</span>
                          </div>
                        ))}
                      </td>
                    );
                  })}
                </tr>
              );
            })}
            {/* Purchase ETA row - only if any ETAs set */}
            {etaItems.length > 0 && (
              <tr style={{ background: '#F2F0EC' }}>
                <td style={{ padding: '6px 12px', fontWeight: 600, color: '#2E4D5C', border: '1px solid #EEE', position: 'sticky', left: 0, background: '#F2F0EC', zIndex: 1, fontSize: 12 }}>採購到貨預測</td>
                {weeks.map((w, wi) => {
                  const arriving = etaItems.filter(e => e.start_date && inWeek(e.start_date, e.start_date, w));
                  return (
                    <td key={wi} style={{ border: '1px solid #EEE', padding: '3px', verticalAlign: 'middle' }}>
                      {arriving.map(e => (
                        <div key={e.id} style={{ background: '#2E4D5C', color: '#fff', borderRadius: 4, padding: '2px 6px', fontSize: 10, textAlign: 'center', marginBottom: 1 }}>
                          {e.stage_name.replace(/^\[.*?\]\s*/, '')}<br/>
                          <span style={{ fontSize: 9, opacity: 0.85 }}>{e.start_date?.replace(/-/g,'/')}</span>
                        </div>
                      ))}
                    </td>
                  );
                })}
              </tr>
            )}
          </tbody>
        </table>
      </div>
    </div>
  );

  return (
    <div>
      {/* Top bar */}
      <div className="card mb-4" style={{ padding: '12px 16px' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 16, flexWrap: 'wrap' }}>
          <div>
            <div style={{ fontWeight: 700, fontSize: 16 }}>工程進度與多段排程管理</div>
            <div style={{ fontSize: 12, color: '#888', marginTop: 2 }}>上方圖表將自動分段繪製；請在下方為各工種或特殊事件設定日期。</div>
          </div>
          <div style={{ marginLeft: 'auto', display: 'flex', alignItems: 'center', gap: 10, flexShrink: 0 }}>
            <span style={{ fontSize: 12, color: '#666' }}>圖表每列顯示：</span>
            <input type="number" min={4} max={26} value={weeksPerSeg} onChange={e => setWeeksPerSeg(Math.max(4,Math.min(26,+e.target.value)))}
              style={{ width: 50, border: '1px solid #DDD', borderRadius: 4, padding: '4px 8px', fontSize: 13, textAlign: 'center' }} />
            <span style={{ fontSize: 12, color: '#666' }}>週</span>
            <button className="btn btn-ghost btn-sm" onClick={() => {
              const win = window.open('', '_blank', 'width=1000,height=700');
              if (!win) return alert('請允許彈出視窗');
              const area = document.querySelector('.schedule-gantt-area');
              const body = area ? area.innerHTML : '';
              const html = ['<!DOCTYPE html><html><head><title>排程圖表</title>',
                '<style>body{font-family:sans-serif;font-size:11px}table{border-collapse:collapse}th,td{border:1px solid #DDD;padding:4px 6px}</style>',
                '<\/head><body>', body, '<\/body><\/html>'].join('');
              win.document.write(html);
              win.document.close(); setTimeout(() => win.print(), 500);
            }}>列印排程圖表</button>
          </div>
        </div>
      </div>

      {/* Gantt segments */}
      <div className="schedule-gantt-area">
        {hasData ? segments.map((seg, si) => (
          <GanttSegment key={si} weeks={seg.weeks} segIdx={seg.segIdx} totalSegs={segments.length} />
        )) : (
          <div className="card mb-4" style={{ padding: '32px', textAlign: 'center', color: '#CCC', fontSize: 13 }}>
            尚無排程資料，請在下方設定各工種進退場日期
          </div>
        )}
      </div>

      {/* Bottom: stage settings + events */}
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 380px', gap: 16, alignItems: 'start' }}>
        {/* Left: work category stages */}
        <div className="card">
          <div style={{ padding: '12px 16px', borderBottom: '1px solid #F0F0EE', fontWeight: 600, fontSize: 14 }}>工種進退場設定</div>
          <table style={{ width: '100%', borderCollapse: 'collapse' }}>
            <thead>
              <tr style={{ background: '#F8F8F6' }}>
                <th style={{ padding: '8px 12px', fontSize: 12, color: '#555', fontWeight: 600, width: 40, border: '1px solid #EEE' }}>項次</th>
                <th style={{ padding: '8px 12px', fontSize: 12, color: '#555', fontWeight: 600, width: 130, border: '1px solid #EEE' }}>工程大項</th>
                <th style={{ padding: '8px 12px', fontSize: 12, color: '#555', fontWeight: 600, border: '1px solid #EEE' }}>階段設定（同工種可多次進場）</th>
              </tr>
            </thead>
            <tbody>
              {workCats.map((cat, ci) => {
                const stages = catStages(cat.name);
                return (
                  <tr key={cat.id} style={{ borderBottom: '1px solid #F0F0EE', verticalAlign: 'top' }}>
                    <td style={{ padding: '10px 12px', textAlign: 'center', color: '#888', fontSize: 13, border: '1px solid #EEE', fontWeight: 600 }}>{String.fromCharCode(65+ci)}</td>
                    <td style={{ padding: '10px 12px', fontSize: 13, border: '1px solid #EEE', wordBreak: 'break-all' }}>{cat.name}</td>
                    <td style={{ padding: '8px 12px', border: '1px solid #EEE' }}>
                      {stages.map((s, si) => (
                        <div key={s.id} style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 6, flexWrap: 'wrap' }}>
                          <span style={{ fontSize: 11, color: '#888', minWidth: 28 }}>階段{si+1}</span>
                          <input type="date" value={s.start_date||''} onChange={e=>updateStage(s.id,'start_date',e.target.value)}
                            style={{ border: '1px solid #DDD', borderRadius: 4, padding: '3px 6px', fontSize: 12 }} />
                          <span style={{ color: '#888', fontSize: 12 }}>～</span>
                          <input type="date" value={s.end_date||''} onChange={e=>updateStage(s.id,'end_date',e.target.value)}
                            style={{ border: '1px solid #DDD', borderRadius: 4, padding: '3px 6px', fontSize: 12 }} />
                          <InlineEdit value={s.stage_name||''} onChange={val=>updateStage(s.id,'stage_name',val)}
                            placeholder="備註（如：衛浴）"
                            style={{ border: '1px solid #DDD', borderRadius: 4, padding: '3px 8px', fontSize: 12, flex: 1, minWidth: 80 }} />
                          <button style={{ background: '#FFF0F0', color: '#8B2E2E', border: '1px solid #EEC0C0', borderRadius: 4, padding: '3px 10px', fontSize: 12, cursor: 'pointer' }} onClick={()=>deleteStage(s.id)}>刪</button>
                        </div>
                      ))}
                      <button onClick={()=>addStage(cat.name)}
                        style={{ border: '1px dashed #C4C4C0', borderRadius: 6, padding: '4px 14px', fontSize: 12, color: '#2E4D5C', background: 'transparent', cursor: 'pointer', marginTop: stages.length ? 2 : 0 }}>
                        新增進場階段
                      </button>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>

        {/* Right: special events */}
        <div className="card">
          <div style={{ padding: '12px 16px', borderBottom: '1px solid #F0F0EE', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <span style={{ fontWeight: 600, fontSize: 14, color: '#333' }}>臨時 / 特殊事件設定</span>
            <button className="btn btn-ghost btn-sm" onClick={loadHolidays}>載入法定假日</button>
          </div>
          <table style={{ width: '100%', borderCollapse: 'collapse' }}>
            <thead>
              <tr style={{ background: '#F8F8F6' }}>
                <th style={{ padding: '8px 10px', fontSize: 12, color: '#555', fontWeight: 600 }}>區間（起～迄）</th>
                <th style={{ padding: '8px 10px', fontSize: 12, color: '#555', fontWeight: 600, width: 90 }}>事件名稱</th>
                <th style={{ padding: '8px 10px', fontSize: 12, color: '#555', fontWeight: 600, width: 40 }}>操作</th>
              </tr>
            </thead>
            <tbody>
              {events.map(e => (
                <tr key={e.id} style={{ borderBottom: '1px solid #F5F5F3' }}>
                  <td style={{ padding: '8px 10px', fontSize: 12 }}>
                    {e.start_date?.replace(/-/g,'/')} ～ {e.end_date?.replace(/-/g,'/')}
                  </td>
                  <td style={{ padding: '8px 10px', fontSize: 12 }}>{e.name}</td>
                  <td style={{ padding: '8px 10px', textAlign: 'center' }}>
                    <button style={{ background: '#FFF0F0', color: '#8B2E2E', border: '1px solid #EEC0C0', borderRadius: 4, padding: '2px 8px', fontSize: 12, cursor: 'pointer' }} onClick={()=>deleteEvent(e.id)}>刪</button>
                  </td>
                </tr>
              ))}
              {events.length === 0 && <tr><td colSpan={3} style={{ padding: '14px', color: '#CCC', fontSize: 12, textAlign: 'center' }}>尚無特殊事件</td></tr>}
            </tbody>
          </table>
          {showAddEvent ? (
            <div style={{ padding: '12px 14px', borderTop: '1px solid #F0F0EE', display: 'flex', flexDirection: 'column', gap: 8 }}>
              <div style={{ display: 'flex', gap: 6, alignItems: 'center', flexWrap: 'wrap' }}>
                <input type="date" value={newEvent.start_date} onChange={e=>setNewEvent(p=>({...p,start_date:e.target.value}))}
                  style={{ border:'1px solid #DDD', borderRadius:4, padding:'4px 6px', fontSize:12, flex:1 }} />
                <span style={{ fontSize:12, color:'#888' }}>～</span>
                <input type="date" value={newEvent.end_date} onChange={e=>setNewEvent(p=>({...p,end_date:e.target.value}))}
                  style={{ border:'1px solid #DDD', borderRadius:4, padding:'4px 6px', fontSize:12, flex:1 }} />
              </div>
              <input value={newEvent.name} onChange={e=>setNewEvent(p=>({...p,name:e.target.value}))} placeholder="事件名稱"
                style={{ border:'1px solid #DDD', borderRadius:4, padding:'4px 8px', fontSize:12, width:'100%' }}
                onKeyDown={e=>e.key==='Enter'&&addEvent()} />
              <div style={{ display:'flex', gap:8 }}>
                <button className="btn btn-primary btn-sm" style={{ flex:1 }} onClick={addEvent}>確認新增</button>
                <button className="btn btn-ghost btn-sm" onClick={()=>setShowAddEvent(false)}>取消</button>
              </div>
            </div>
          ) : (
            <div style={{ padding: '10px 14px', borderTop: '1px solid #F0F0EE' }}>
              <button onClick={()=>setShowAddEvent(true)}
                style={{ border:'1px dashed #C4C4C0', borderRadius:6, padding:'5px 14px', fontSize:12, color:'#2E4D5C', background:'transparent', cursor:'pointer', width:'100%' }}>
                手動新增事件
              </button>
            </div>
          )}
        </div>

        {/* Purchase ETA section */}
        {purchaseTodos.length > 0 && (
          <div className="card" style={{ marginTop: 12 }}>
            <div style={{ padding: '12px 16px', borderBottom: '1px solid #F0F0EE', fontWeight: 600, fontSize: 14, color: '#2E4D5C' }}>
              採購到貨預測設定
            </div>
            <div style={{ padding: '4px 0' }}>
              {purchaseTodos.map(todo => {
                const eta = getEta(todo.content);
                return (
                  <div key={todo.id} style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '8px 14px', borderBottom: '1px solid #F5F5F3' }}>
                    <span style={{ flex: 1, fontSize: 12, color: '#444' }}>{todo.content}</span>
                    <input type="date" value={eta} onChange={e => setEta(todo.content, e.target.value)}
                      style={{ border: '1px solid #DDD', borderRadius: 4, padding: '3px 6px', fontSize: 12, width: 130 }} />
                    {eta && <button style={{ border: 'none', background: 'none', color: '#8B2E2E', cursor: 'pointer', fontSize: 13 }} onClick={() => setEta(todo.content, '')}>✕</button>}
                  </div>
                );
              })}
            </div>
            <div style={{ padding: '8px 14px', fontSize: 11, color: '#AAA' }}>
              設定日期後，甘特圖底部會出現「採購到貨預測」列
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function SiteLogTab({ project }) {
  const [logs, setLogs] = useState([]);
  const [showAdd, setShowAdd] = useState(false);
  const [form, setForm] = useState({ log_date: today(), weather: '晴天', workers: '', content: '' });
  const [uploading, setUploading] = useState({});

  const load = useCallback(async () => {
    const { data } = await db.from('site_logs').select('*').eq('project_id', project.id).order('created_at', { ascending: false });
    setLogs(data || []);
  }, [project.id]);

  useEffect(() => { load(); }, [load]);

  const addLog = async () => {
    await db.from('site_logs').insert({ ...form, project_id: project.id });
    toast('已新增日誌');
    setShowAdd(false); setForm({ log_date: today(), weather: '晴天', workers: '', content: '' });
    load();
  };

  const updateLog = async (id, field, val) => {
    await db.from('site_logs').update({ [field]: val }).eq('id', id);
    setLogs(prev => prev.map(l => l.id === id ? { ...l, [field]: val } : l));
  };

  const deleteLog = async (id) => { await db.from('site_logs').delete().eq('id', id); load(); };

  // Get images array from log (supports both old single image_url and new JSON array)
  const getImages = (log) => {
    const raw = log.image_url || '';
    if (!raw) return [];
    try { const arr = JSON.parse(raw); return Array.isArray(arr) ? arr : [raw]; }
    catch { return [raw]; }
  };

  const uploadImage = async (logId, file) => {
    setUploading(p => ({ ...p, [logId]: true }));
    try {
      const url = await uploadToStorage(file, `site_logs/${project.id}`);
      const { data: cur } = await db.from('site_logs').select('image_url').eq('id', logId).single();
      const existing = getImages(cur);
      const newList = JSON.stringify([...existing, url]);
      await db.from('site_logs').update({ image_url: newList }).eq('id', logId);
      await load();
      toast('已上傳');
    } catch(e) { toast('上傳失敗', 'error'); }
    setUploading(p => ({ ...p, [logId]: false }));
  };

  const removeImage = async (logId, idx) => {
    const { data: cur } = await db.from('site_logs').select('image_url').eq('id', logId).single();
    const imgs = getImages(cur).filter((_, i) => i !== idx);
    await db.from('site_logs').update({ image_url: imgs.length ? JSON.stringify(imgs) : '' }).eq('id', logId);
    setLogs(prev => prev.map(l => l.id === logId ? { ...l, image_url: imgs.length ? JSON.stringify(imgs) : '' } : l));
  };

  const addTodo = async (content, project_id) => {
    await db.from('todos').insert({ project_id, content, todo_type: 'site', source: 'site_log' });
    toast('已轉入現場待辦');
  };

  const weatherOpts = ['晴天', '多雲', '陰天', '下雨', '颱風'];

  return (
    <div>
      <div className="flex justify-between items-center mb-4">
        <div className="section-title">施工日誌（案場紀錄）</div>
        <button className="btn btn-primary btn-sm" onClick={() => setShowAdd(true)}>＋ 新增今日日誌</button>
      </div>

      {logs.map(log => {
        const imgs = getImages(log);
        return (
        <div key={log.id} className="log-card mb-3">
          <div className="log-date-header">
            <input type="date" value={log.log_date} style={{ border: 'none', fontWeight: 600, fontSize: 14, background: 'transparent' }}
              onChange={e => updateLog(log.id, 'log_date', e.target.value)} />
            <select value={log.weather} onChange={e => updateLog(log.id, 'weather', e.target.value)}
              style={{ border: '1px solid #E8E8E6', borderRadius: 4, padding: '2px 6px', fontSize: 12, background: '#FAFAFA' }}>
              {weatherOpts.map(w => <option key={w}>{w}</option>)}
            </select>
            <button className="btn btn-ghost btn-xs" style={{ color: '#2E4D5C', marginLeft: 'auto' }}
              onClick={() => addTodo(log.content, log.project_id)}>轉入待辦</button>
            <button className="btn btn-xs" style={{ background: '#FFF0F0', color: '#8B2E2E', border: '1px solid #EEC0C0', borderRadius: 4 }}
              onClick={() => deleteLog(log.id)}>刪除</button>
          </div>
          <div className="form-group mb-2">
            <label className="form-label">出勤工班與人數</label>
            <InlineEdit value={log.workers || ''} onChange={val => updateLog(log.id, 'workers', val)}
              className="form-input" placeholder="例：木作工班 3人、水電 2人" />
          </div>
          <div className="form-group mb-3">
            <label className="form-label">今日施工內容 / 備註</label>
            <IMETextarea className="form-textarea" value={log.content || ''} onChange={val => updateLog(log.id, 'content', val)} />
          </div>
          {/* Photos */}
          <div>
            <div style={{ fontSize: 12, color: '#666', fontWeight: 500, marginBottom: 8 }}>照片紀錄</div>
            <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', alignItems: 'flex-start' }}>
              {imgs.map((url, idx) => (
                <div key={idx} style={{ position: 'relative' }}>
                  <img src={url} alt="" style={{ width: 90, height: 90, objectFit: 'cover', borderRadius: 6, border: '1px solid #E0E0E0', cursor: 'pointer' }}
                    onClick={() => window.open(url, '_blank')} />
                  <button onClick={() => removeImage(log.id, idx)}
                    style={{ position: 'absolute', top: 2, right: 2, background: 'rgba(0,0,0,0.5)', color: '#fff', border: 'none', borderRadius: '50%', width: 18, height: 18, fontSize: 11, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', lineHeight: 1 }}>✕</button>
                </div>
              ))}
              <label style={{ width: 90, height: 90, border: '1.5px dashed #CCC', borderRadius: 6, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', background: '#FAFAFA', fontSize: 11, color: '#AAA', gap: 4 }}>
                {uploading[log.id] ? '上傳中...' : <><span style={{ fontSize: 22, lineHeight: 1 }}>＋</span><span>新增照片</span></>}
                <input type="file" accept="image/*" multiple style={{ display: 'none' }}
                  onChange={async e => { for (const f of e.target.files) await uploadImage(log.id, f); e.target.value = ''; }} />
              </label>
            </div>
          </div>
        </div>
        );
      })}

      {logs.length === 0 && <div style={{ textAlign: 'center', padding: '40px', color: '#CCC', fontSize: 13 }}>尚無施工日誌</div>}

      <Modal open={showAdd} title="新增施工日誌" onClose={() => setShowAdd(false)}
        footer={<><button className="btn btn-ghost" onClick={() => setShowAdd(false)}>取消</button><button className="btn btn-primary" onClick={addLog}>新增</button></>}>
        <div className="grid-2">
          <div className="form-group"><label className="form-label">日期</label>
            <input className="form-input" type="date" value={form.log_date} onChange={e => setForm(p => ({ ...p, log_date: e.target.value }))} /></div>
          <div className="form-group"><label className="form-label">天氣</label>
            <select className="form-select" value={form.weather} onChange={e => setForm(p => ({ ...p, weather: e.target.value }))}>
              {weatherOpts.map(w => <option key={w}>{w}</option>)}
            </select>
          </div>
        </div>
        <div className="form-group"><label className="form-label">出勤工班與人數</label>
          <IMEInput className="form-input" value={form.workers} onChange={val => setForm(p => ({ ...p, workers: val }))} placeholder="例：木作工班 3人" /></div>
        <div className="form-group"><label className="form-label">今日施工內容</label>
          <IMETextarea className="form-textarea" value={form.content} onChange={val => setForm(p => ({ ...p, content: val }))} /></div>
      </Modal>
    </div>
  );
}

function MeetingRecordTab({ project }) {
  const [records, setRecords] = useState([]);
  const [showAdd, setShowAdd] = useState(false);
  const [form, setForm] = useState({ meeting_date: today(), meeting_time: '10:00', location: '', attendees: '' });

  const load = useCallback(async () => {
    const { data: r } = await db.from('meeting_records').select('*, meeting_items(*)').eq('project_id', project.id).order('meeting_date', { ascending: false });
    setRecords(r || []);
  }, [project.id]);

  useEffect(() => { load(); }, [load]);

  const addRecord = async () => {
    await db.from('meeting_records').insert({ ...form, project_id: project.id });
    toast('已新增會議記錄'); setShowAdd(false); load();
  };

  const deleteRecord = async (id) => { await db.from('meeting_records').delete().eq('id', id); load(); };

  const addItem = async (meetingId, content) => {
    if (!content.trim()) return;
    await db.from('meeting_items').insert({ meeting_id: meetingId, content, sort_order: 0 });
    load();
  };

  const updateItem = async (id, field, val) => {
    await db.from('meeting_items').update({ [field]: val }).eq('id', id);
    load();
  };

  const deleteItem = async (id) => { await db.from('meeting_items').delete().eq('id', id); load(); };

  const convertToTodo = async (item, projectId) => {
    await db.from('todos').insert({ project_id: projectId, content: item.content, todo_type: 'general', source: 'meeting' });
    await db.from('meeting_items').update({ convert_to_todo: true }).eq('id', item.id);
    toast('已轉入待辦事項'); load();
  };

  const MeetingItemRow = ({ record }) => {
    const inputRef = React.useRef(null);
    const submit = () => {
      const val = inputRef.current?.value?.trim();
      if (!val) return;
      addItem(record.id, val);
      inputRef.current.value = '';
    };
    return (
      <div>
        {(record.meeting_items || []).map((item, idx) => (
          <div key={item.id} style={{ display: 'flex', alignItems: 'flex-start', gap: 10, padding: '8px 0', borderBottom: '1px solid #F5F5F3' }}>
            <span style={{ color: '#888', fontSize: 12, minWidth: 20, paddingTop: 2 }}>{idx + 1}.</span>
            <InlineEdit value={item.content} onChange={val => updateItem(item.id, 'content', val)}
              style={{ flex: 1, border: 'none', background: 'transparent', fontSize: 13, outline: 'none', padding: '2px 4px', borderRadius: 4 }} />
            <button className="btn btn-ghost btn-xs" style={{ color: item.convert_to_todo ? '#3A5240' : '#2E4D5C', whiteSpace: 'nowrap' }}
              onClick={() => !item.convert_to_todo && convertToTodo(item, record.project_id)}>
              {item.convert_to_todo ? '已轉待辦' : '轉一般待辦'}
            </button>
            <button className="btn-icon" style={{ color: '#8B2E2E', fontSize: 13 }} onClick={() => deleteItem(item.id)}>✕</button>
          </div>
        ))}
        <div style={{ display: 'flex', gap: 8, marginTop: 8 }}>
          <input ref={inputRef} className="form-input" style={{ flex: 1 }} placeholder="輸入討論事項或決議內容..."
            onKeyDown={e => { if (e.key === 'Enter' && !e.nativeEvent?.isComposing) submit(); }} />
          <button className="btn btn-ghost btn-sm" onClick={submit}>新增一筆事項</button>
        </div>
      </div>
    );
  };

  return (
    <div>
      <div className="flex justify-between items-center mb-4">
        <div>
          <div className="section-title">會議記錄 (Meeting Minutes)</div>
          <div className="text-sm text-muted mt-1">記錄與業主或工班的會議，並可將決議事項一鍵轉入待辦</div>
        </div>
        <button className="btn btn-primary btn-sm" onClick={() => setShowAdd(true)}>＋ 新增會議記錄</button>
      </div>

      {records.map(r => (
        <div key={r.id} className="log-card mb-4">
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr auto', gap: 16, marginBottom: 12, alignItems: 'center' }}>
            <div className="form-group">
              <label className="form-label">開會日期</label>
              <input type="date" className="form-input" value={r.meeting_date}
                onChange={e => db.from('meeting_records').update({ meeting_date: e.target.value }).eq('id', r.id).then(load)} />
            </div>
            <div className="form-group">
              <label className="form-label">開會時間</label>
              <input type="time" className="form-input" value={r.meeting_time || '10:00'}
                onChange={e => db.from('meeting_records').update({ meeting_time: e.target.value }).eq('id', r.id).then(load)} />
            </div>
            <div className="flex gap-2">
              <button className="btn btn-ghost btn-xs" onClick={() => alert('請使用右上角「列印」按鈕')}>列印此記錄</button>
              <button className="btn btn-xs" style={{ background: '#FFF0F0', color: '#8B2E2E', border: '1px solid #EEC0C0', borderRadius: 4 }} onClick={() => deleteRecord(r.id)}>刪除此記錄</button>
            </div>
          </div>
          <div className="grid-2 mb-3">
            <div className="form-group"><label className="form-label">開會地點</label>
              <InlineEdit className="form-input" value={r.location || ''} placeholder="例：工地現場 / 公司"
                onChange={val => db.from('meeting_records').update({ location: val }).eq('id', r.id)} /></div>
            <div className="form-group"><label className="form-label">參與人員</label>
              <InlineEdit className="form-input" value={r.attendees || ''} placeholder="例：業主陳先生、設計師"
                onChange={val => db.from('meeting_records').update({ attendees: val }).eq('id', r.id)} /></div>
          </div>
          <div className="form-label mb-2">決議事項與討論內容</div>
          <MeetingItemRow record={r} />
        </div>
      ))}

      {records.length === 0 && <div style={{ textAlign: 'center', padding: '40px', color: '#CCC', fontSize: 13 }}>尚無會議記錄</div>}

      <Modal open={showAdd} title="新增會議記錄" onClose={() => setShowAdd(false)}
        footer={<><button className="btn btn-ghost" onClick={() => setShowAdd(false)}>取消</button><button className="btn btn-primary" onClick={addRecord}>新增</button></>}>
        <div className="grid-2">
          <div className="form-group"><label className="form-label">開會日期</label>
            <input className="form-input" type="date" value={form.meeting_date} onChange={e => setForm(p => ({ ...p, meeting_date: e.target.value }))} /></div>
          <div className="form-group"><label className="form-label">開會時間</label>
            <input className="form-input" type="time" value={form.meeting_time} onChange={e => setForm(p => ({ ...p, meeting_time: e.target.value }))} /></div>
        </div>
        <div className="form-group"><label className="form-label">開會地點</label>
          <IMEInput className="form-input" value={form.location} onChange={val => setForm(p => ({ ...p, location: val }))} /></div>
        <div className="form-group"><label className="form-label">參與人員</label>
          <IMEInput className="form-input" value={form.attendees} onChange={val => setForm(p => ({ ...p, attendees: val }))} /></div>
      </Modal>
    </div>
  );
}

function TodosTab({ project }) {
  const [todos, setTodos] = useState([]);
  const [inputs, setInputs] = useState({ general: '', site: '', purchase: '' });

  const load = useCallback(async () => {
    const { data } = await db.from('todos').select('*').eq('project_id', project.id).order('created_at', { ascending: false });
    setTodos(data || []);
  }, [project.id]);

  useEffect(() => { load(); }, [load]);

  const addTodo = async (type) => {
    const content = inputs[type].trim();
    if (!content) return;
    await db.from('todos').insert({ project_id: project.id, content, todo_type: type });
    setInputs(p => ({ ...p, [type]: '' }));
    load();
  };

  const toggleDone = async (id, val) => {
    await db.from('todos').update({ is_done: !val }).eq('id', id);
    setTodos(prev => prev.map(t => t.id === id ? { ...t, is_done: !val } : t));
  };

  const deleteTodo = async (id) => { await db.from('todos').delete().eq('id', id); load(); };

  const cols = [
    { type: 'general', label: '一般專案待辦', placeholder: '如：聯絡業主確認款式...', bg: '#FAF7F4', border: '#E8E0D4', btnBg: '#363636' },
    { type: 'site',    label: '現場待辦與修繕', placeholder: '如：確認廚具進場時間...', bg: '#F2F0EC', border: '#C4C4C0', btnBg: '#2E2E2E' },
    { type: 'purchase',label: '待採購清單', placeholder: '可直接輸入或從採購明細打勾...', bg: '#fff', border: '#D8D8D8', btnBg: '#3A3A3A' },
  ];

  return (
    <div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 16, alignItems: 'start' }}>
        {cols.map(({ type, label, placeholder, bg, border, btnBg }) => {
          const list = todos.filter(t => t.todo_type === type);
          const pending = list.filter(t => !t.is_done);
          const done = list.filter(t => t.is_done);
          return (
            <div key={type} style={{ background: bg, border: '1px solid ' + border, borderRadius: 12, padding: '18px 16px', minHeight: 200 }}>
              <div style={{ fontWeight: 700, fontSize: 15, marginBottom: 14, color: '#363636' }}>{label}</div>
              {/* Input row */}
              <div style={{ display: 'flex', gap: 8, marginBottom: 14 }}>
                <input className="form-input" style={{ flex: 1, fontSize: 13, background: '#fff', border: '1px solid #DDD' }}
                  placeholder={placeholder}
                  value={inputs[type]}
                  onChange={e => setInputs(p => ({ ...p, [type]: e.target.value }))}
                  onKeyDown={e => e.key === 'Enter' && addTodo(type)} />
                <button style={{ background: btnBg, color: '#fff', border: 'none', borderRadius: 6, padding: '0 14px', fontSize: 13, fontWeight: 600, cursor: 'pointer', flexShrink: 0 }}
                  onClick={() => addTodo(type)}>新增</button>
              </div>
              {/* Pending items */}
              {pending.map(todo => (
                <div key={todo.id} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '9px 0', borderBottom: '1px solid ' + border }}>
                  <input type="checkbox" checked={false} onChange={() => toggleDone(todo.id, false)}
                    style={{ width: 18, height: 18, flexShrink: 0, accentColor: btnBg, cursor: 'pointer' }} />
                  <span style={{ flex: 1, fontSize: 14, color: '#2E2E2E' }}>{todo.content}</span>
                  <button className="btn-icon" style={{ color: '#333', opacity: 0.7, fontSize: 13 }} onClick={() => deleteTodo(todo.id)}>✕</button>
                </div>
              ))}
              {/* Done items (collapsed-ish) */}
              {done.length > 0 && (
                <div style={{ marginTop: 8 }}>
                  {done.map(todo => (
                    <div key={todo.id} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '7px 0', opacity: 0.45 }}>
                      <input type="checkbox" checked={true} onChange={() => toggleDone(todo.id, true)}
                        style={{ width: 18, height: 18, flexShrink: 0, accentColor: btnBg, cursor: 'pointer' }} />
                      <span style={{ flex: 1, fontSize: 13, textDecoration: 'line-through', color: '#888' }}>{todo.content}</span>
                      <button className="btn-icon" style={{ color: '#333', opacity: 0.5, fontSize: 13 }} onClick={() => deleteTodo(todo.id)}>✕</button>
                    </div>
                  ))}
                </div>
              )}
              {pending.length === 0 && done.length === 0 && (
                <div style={{ color: '#BBB', fontSize: 12, textAlign: 'center', padding: '16px 0' }}>尚無待辦</div>
              )}
              <div style={{ marginTop: 10, fontSize: 11, color: '#999', textAlign: 'right' }}>
                未完成 {pending.length} ｜ 已完成 {done.length}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// GALLERY TAB
// ─────────────────────────────────────────
const SHARED_ID = '00000000-0000-0000-0000-000000000001';
const DEFAULT_CATS = ['風格參考','材料樣本','廠商資料','燈具','磁磚','家具','衛浴','五金','其他'];

function GalleryTab({ project }) {
  const [items, setItems] = useState([]);
  const [sharedItems, setSharedItems] = useState([]);
  const [tab, setTab] = useState('site');
  const [catFilter, setCatFilter] = useState('全部');
  const [showAdd, setShowAdd] = useState(false);
  const [form, setForm] = useState({ name: '', description: '', price: 0, image_url: '', gallery_type: '風格參考', log_date: today() });
  const [uploading, setUploading] = useState(false);
  const [sharedCats, setSharedCats] = useState(DEFAULT_CATS);

  const load = useCallback(async () => {
    const { data: p } = await db.from('gallery').select('*').eq('project_id', project.id).order('created_at', { ascending: false });
    const { data: s } = await db.from('gallery').select('*').eq('project_id', SHARED_ID).order('created_at', { ascending: false });
    setItems(p || []);
    const s2 = s || [];
    setSharedItems(s2);
    const existing = [...new Set(s2.map(i => i.gallery_type).filter(Boolean))];
    const merged = [...new Set([...DEFAULT_CATS, ...existing])];
    setSharedCats(merged);
  }, [project.id]);

  useEffect(() => { load(); }, [load]);

  const addItem = async () => {
    if (tab === 'site') {
      await db.from('gallery').insert({ ...form, gallery_type: 'site', project_id: project.id });
    } else {
      await db.from('gallery').insert({ ...form, project_id: SHARED_ID });
    }
    toast('已新增'); setShowAdd(false);
    setForm({ name: '', description: '', price: 0, image_url: '', gallery_type: '風格參考', log_date: today() });
    load();
  };

  const handleDirectUpload = async (file) => {
    if (!file) return;
    setUploading(true);
    try {
      const folder = tab === 'site' ? `gallery/${project.id}` : 'gallery/shared';
      const url = await uploadToStorage(file, folder);
      const name = file.name.replace(/\.[^.]+$/, '');
      if (tab === 'site') {
        await db.from('gallery').insert({ project_id: project.id, name, image_url: url, gallery_type: 'site', log_date: today() });
      } else {
        await db.from('gallery').insert({ project_id: SHARED_ID, name, image_url: url, gallery_type: form.gallery_type });
      }
      toast('圖片上傳完成'); load();
    } catch (err) { toast('上傳失敗：' + err.message, 'error'); }
    setUploading(false);
  };

  const toggleSelect = async (id, val) => { await db.from('gallery').update({ is_selected: !val }).eq('id', id); load(); };
  const deleteItem = async (id) => { await db.from('gallery').delete().eq('id', id); load(); };
  const updateItem = async (id, field, val) => {
    await db.from('gallery').update({ [field]: val }).eq('id', id);
    if (tab === 'site') setItems(prev => prev.map(i => i.id === id ? { ...i, [field]: val } : i));
    else setSharedItems(prev => prev.map(i => i.id === id ? { ...i, [field]: val } : i));
  };

  const inputRef = useRef(null);
  const siteItems = items.filter(i => i.gallery_type === 'site');
  const filteredShared = catFilter === '全部' ? sharedItems : sharedItems.filter(i => i.gallery_type === catFilter);

  const GalleryCard = ({ item, showSelect }) => (
    <div className="gallery-card">
      {item.image_url ? (
        <div style={{ width:'100%', height:180, background:'#F0F0F0', overflow:'hidden', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer' }}
          onClick={() => window.open(item.image_url, '_blank')}>
          <img src={item.image_url} alt={item.name} style={{ maxWidth:'100%', maxHeight:180, objectFit:'contain' }} />
        </div>
      ) : <div className="gallery-img">無圖片</div>}
      <div className="gallery-info">
        <input style={{ border:'none', fontWeight:600, fontSize:13, width:'100%', outline:'none', background:'transparent', marginBottom:3 }}
          value={item.name || ''} onChange={e => updateItem(item.id, 'name', e.target.value)} placeholder="名稱..." />
        <input style={{ border:'none', fontSize:12, color:'#888', width:'100%', outline:'none', background:'transparent', marginBottom:4 }}
          value={item.description || ''} onChange={e => updateItem(item.id, 'description', e.target.value)} placeholder="說明..." />
        {tab === 'shared' && (
          <select style={{ fontSize:11, border:'1px solid #E0E0E0', borderRadius:4, padding:'2px 6px', marginBottom:4, background:'#F5F5F5' }}
            value={item.gallery_type || '其他'} onChange={e => updateItem(item.id, 'gallery_type', e.target.value)}>
            {sharedCats.map(c => <option key={c}>{c}</option>)}
          </select>
        )}
        <div style={{ display:'flex', gap:6, alignItems:'center', marginBottom:4 }}>
          <span style={{ fontSize:11, color:'#888' }}>參考價</span>
          <input type="number" style={{ border:'1px solid #EEE', borderRadius:4, padding:'2px 6px', width:80, fontSize:12 }}
            value={item.price || 0} onChange={e => updateItem(item.id, 'price', +e.target.value)} />
        </div>
        {tab === 'site' && <div style={{ fontSize:11, color:'#999', marginBottom:4 }}>{fmtDate(item.log_date)}</div>}
        <div style={{ display:'flex', gap:6, marginTop:4, alignItems:'center' }}>
          {showSelect && (
            <label style={{ display:'flex', alignItems:'center', gap:4, fontSize:11, cursor:'pointer' }}>
              <input type="checkbox" checked={!!item.is_selected} onChange={() => toggleSelect(item.id, item.is_selected)} />
              本案選用
            </label>
          )}
          <button className="btn btn-xs" style={{ background:'#FFF0F0', color:'#8B2E2E', border:'1px solid #EEC0C0', borderRadius:4, marginLeft:'auto' }}
            onClick={() => deleteItem(item.id)}>刪除</button>
        </div>
      </div>
    </div>
  );

  return (
    <div>
      <div className="flex justify-between items-center mb-4">
        <div className="section-title">圖庫與附件</div>
        <div className="flex gap-2">
          <input ref={inputRef} type="file" accept="image/*" multiple style={{ display:'none' }}
            onChange={async e => { for (const file of e.target.files) await handleDirectUpload(file); e.target.value = ''; }} />
          <button className="btn btn-ghost btn-sm" onClick={() => inputRef.current?.click()} disabled={uploading}>
            {uploading ? '上傳中...' : '上傳圖片'}
          </button>
          <button className="btn btn-primary btn-sm" onClick={() => { setForm(p => ({ ...p, gallery_type: tab === 'site' ? 'site' : '風格參考' })); setShowAdd(true); }}>＋ 新增（填網址）</button>
        </div>
      </div>

      <div style={{ display:'flex', gap:8, marginBottom:16 }}>
        {[{ key:'site', label:'工地紀錄' }, { key:'shared', label:'共用參考資料庫' }].map(t => (
          <button key={t.key} className={`btn btn-sm ${tab === t.key ? 'btn-primary' : 'btn-ghost'}`} onClick={() => setTab(t.key)}>{t.label}</button>
        ))}
      </div>

      {tab === 'shared' && (
        <div style={{ display:'flex', gap:6, flexWrap:'wrap', marginBottom:16 }}>
          {['全部', ...sharedCats].map(c => (
            <button key={c} onClick={() => setCatFilter(c)}
              style={{ padding:'4px 12px', borderRadius:20, fontSize:12, cursor:'pointer', border:'1px solid #D8D8D8',
                background: catFilter === c ? '#444' : '#F5F5F5', color: catFilter === c ? '#fff' : '#555' }}>
              {c}
              {c !== '全部' && <span style={{ marginLeft:4, fontSize:10, color: catFilter===c?'#ccc':'#999' }}>
                ({sharedItems.filter(i => i.gallery_type === c).length})
              </span>}
            </button>
          ))}
        </div>
      )}

      <div className="gallery-grid">
        {(tab === 'site' ? siteItems : filteredShared).map(item => (
          <GalleryCard key={item.id} item={item} showSelect={tab === 'site'} />
        ))}
        {(tab === 'site' ? siteItems : filteredShared).length === 0 && (
          <div style={{ gridColumn:'1/-1', textAlign:'center', padding:'48px', color:'#CCC', fontSize:13 }}>
            <div>{tab === 'site' ? '尚無工地紀錄' : '此分類尚無資料'}</div>
          </div>
        )}
      </div>

      <Modal open={showAdd} title={tab === 'site' ? '新增工地紀錄' : '新增共用參考資料'} onClose={() => setShowAdd(false)}
        footer={<><button className="btn btn-ghost" onClick={() => setShowAdd(false)}>取消</button><button className="btn btn-primary" onClick={addItem}>新增</button></>}>
        <div className="form-group"><label className="form-label">名稱</label>
          <IMEInput className="form-input" value={form.name} onChange={val => setForm(p => ({ ...p, name: val }))} /></div>
        <div className="form-group">
          <label className="form-label">圖片網址</label>
          <div style={{ display:'flex', gap:8 }}>
            <input className="form-input" value={form.image_url} onChange={e => setForm(p => ({ ...p, image_url: e.target.value }))} placeholder="https://..." />
            <ImageUpload label="上傳" folder={tab === 'site' ? `gallery/${project.id}` : 'gallery/shared'} onUploaded={url => setForm(p => ({ ...p, image_url: url }))} />
          </div>
        </div>
        <div className="form-group"><label className="form-label">說明</label>
          <IMETextarea className="form-textarea" value={form.description} onChange={val => setForm(p => ({ ...p, description: val }))} /></div>
        {tab === 'site' ? (
          <div className="form-group"><label className="form-label">紀錄日期</label>
            <input className="form-input" type="date" value={form.log_date} onChange={e => setForm(p => ({ ...p, log_date: e.target.value }))} /></div>
        ) : (
          <div className="grid-2">
            <div className="form-group"><label className="form-label">分類</label>
              <select className="form-select" value={form.gallery_type} onChange={e => setForm(p => ({ ...p, gallery_type: e.target.value }))}>
                {sharedCats.map(c => <option key={c}>{c}</option>)}
              </select>
            </div>
            <div className="form-group"><label className="form-label">參考價格</label>
              <input className="form-input" type="number" value={form.price} onChange={e => setForm(p => ({ ...p, price: +e.target.value }))} /></div>
          </div>
        )}
      </Modal>
    </div>
  );
}

// SETTLEMENT TAB（廠商結算）
