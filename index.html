function ProjectFlowTab({ project }) {
  const [stages, setStages] = useState([]);
  const [checklists, setChecklists] = useState([]);
  const [expanded, setExpanded] = useState({});
  const [newItem, setNewItem] = useState({});
  const [loading, setLoading] = useState(true);

  const load = useCallback(async () => {
    const [{ data: s }, { data: c }] = await Promise.all([
      db.from('project_stages').select('*').eq('project_id', project.id).order('sort_order'),
      db.from('stage_checklist').select('*').eq('project_id', project.id).order('sort_order'),
    ]);
    setStages(s || []);
    setChecklists(c || []);
    setLoading(false);
  }, [project.id]);

  useEffect(() => { load(); }, [load]);

  // Auto-init stages if none exist
  useEffect(() => {
    if (!loading && stages.length === 0) initStages();
  }, [loading]);

  const initStages = async () => {
    await db.from('project_stages').insert(
      DEFAULT_STAGES.map((s, i) => ({ project_id: project.id, stage_key: s.key, stage_name: s.name, sort_order: i }))
    );
    const checkItems = [];
    DEFAULT_STAGES.forEach((s, si) => {
      (DEFAULT_CHECKLIST[s.key] || []).forEach((item, ci) => {
        checkItems.push({
          project_id: project.id,
          stage_key: s.key,
          content: typeof item === 'string' ? item : item.content,
          is_question: typeof item === 'object' ? item.is_question : false,
          sort_order: ci,
        });
      });
    });
    await db.from('stage_checklist').insert(checkItems);
    load();
  };

  const toggleStage = async (stage) => {
    const newDone = !stage.is_done;
    const actualDate = newDone ? new Date().toISOString().slice(0, 10) : null;
    await db.from('project_stages').update({ is_done: newDone, actual_date: actualDate }).eq('id', stage.id);
    setStages(prev => prev.map(s => s.id === stage.id ? { ...s, is_done: newDone, actual_date: actualDate } : s));
  };

  const updateStage = async (id, field, val) => {
    await db.from('project_stages').update({ [field]: val }).eq('id', id);
    setStages(prev => prev.map(s => s.id === id ? { ...s, [field]: val } : s));
  };

  const toggleCheck = async (item) => {
    const newVal = !item.is_checked;
    await db.from('stage_checklist').update({ is_checked: newVal }).eq('id', item.id);
    setChecklists(prev => prev.map(c => c.id === item.id ? { ...c, is_checked: newVal } : c));
  };

  const addCheckItem = async (stageKey, isQuestion = false) => {
    const content = newItem[stageKey];
    if (!content?.trim()) return;
    const list = checklists.filter(c => c.stage_key === stageKey);
    await db.from('stage_checklist').insert({ project_id: project.id, stage_key: stageKey, content: content.trim(), is_question: isQuestion, sort_order: list.length });
    setNewItem(p => ({ ...p, [stageKey]: '' }));
    load();
  };

  const updateAnswer = async (id, answer) => {
    await db.from('stage_checklist').update({ answer }).eq('id', id);
    setChecklists(prev => prev.map(c => c.id === id ? { ...c, answer } : c));
  };

  const deleteCheckItem = async (id) => {
    await db.from('stage_checklist').delete().eq('id', id);
    setChecklists(prev => prev.filter(c => c.id !== id));
  };

  const stageItems = (key) => checklists.filter(c => c.stage_key === key);
  const stageProgress = (key) => {
    const items = stageItems(key);
    if (!items.length) return null;
    const done = items.filter(c => c.is_checked).length;
    return { done, total: items.length, pct: Math.round(done / items.length * 100) };
  };

  const doneCount = stages.filter(s => s.is_done).length;

  if (loading) return <div className="loading-center"><div className="spinner" /></div>;

  return (
    <div>
      {/* Overall progress */}
      <div className="card mb-4" style={{ padding: '16px 20px' }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 10 }}>
          <div className="section-title" style={{ marginBottom: 0 }}>專案進度</div>
          <span style={{ fontSize: 13, color: '#888' }}>{doneCount} / {stages.length} 階段完成</span>
        </div>
        <div style={{ display: 'flex', gap: 0, borderRadius: 6, overflow: 'hidden', height: 10, background: '#E8E8E8' }}>
          <div style={{ width: (doneCount / Math.max(stages.length, 1) * 100) + '%', background: '#3A5240', transition: 'width 0.4s' }} />
        </div>
        {/* Stage pills */}
        <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginTop: 12 }}>
          {stages.map((s, i) => (
            <div key={s.id} onClick={() => setExpanded(p => ({ ...p, [s.stage_key]: !p[s.stage_key] }))}
              style={{ display: 'flex', alignItems: 'center', gap: 5, padding: '4px 10px', borderRadius: 20, cursor: 'pointer', fontSize: 12, fontWeight: 500, background: s.is_done ? '#E8F0EC' : '#F0F0F0', color: s.is_done ? '#3A5240' : '#555', border: s.is_done ? '1px solid #C0D8C8' : '1px solid #D8D8D8' }}>
              {s.is_done ? '✓' : (i + 1) + '.'} {s.stage_name}
            </div>
          ))}
        </div>
      </div>

      {/* Stage cards */}
      <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
        {stages.map((stage, i) => {
          const prog = stageProgress(stage.stage_key);
          const isOpen = expanded[stage.stage_key];
          const items = stageItems(stage.stage_key);
          return (
            <div key={stage.id} className="card" style={{ border: stage.is_done ? '1.5px solid #C0D8C8' : '1px solid #E0E0E0', opacity: 1 }}>
              {/* Stage header */}
              <div style={{ padding: '12px 16px', display: 'flex', alignItems: 'center', gap: 12, cursor: 'pointer', background: stage.is_done ? '#F5FAF7' : '#F8F8F8', borderRadius: '8px 8px 0 0' }}
                onClick={() => setExpanded(p => ({ ...p, [stage.stage_key]: !p[stage.stage_key] }))}>
                {/* Stage number / check */}
                <div onClick={e => { e.stopPropagation(); toggleStage(stage); }}
                  style={{ width: 28, height: 28, borderRadius: '50%', border: stage.is_done ? '2px solid #3A5240' : '2px solid #CCC', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', background: stage.is_done ? '#3A5240' : '#fff', flexShrink: 0, transition: 'all 0.2s' }}>
                  {stage.is_done ? <span style={{ color: '#fff', fontSize: 14, fontWeight: 700 }}>✓</span> : <span style={{ color: '#AAA', fontSize: 12 }}>{i + 1}</span>}
                </div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontWeight: 700, fontSize: 14, color: stage.is_done ? '#3A5240' : '#222' }}>{stage.stage_name}</div>
                  <div style={{ display: 'flex', gap: 12, marginTop: 2, alignItems: 'center' }}>
                    {prog && <span style={{ fontSize: 11, color: '#888' }}>{prog.done}/{prog.total} 項完成</span>}
                    {stage.planned_date && <span style={{ fontSize: 11, color: '#888' }}>預計 {stage.planned_date}</span>}
                    {stage.actual_date && <span style={{ fontSize: 11, color: '#3A5240' }}>完成 {stage.actual_date}</span>}
                  </div>
                </div>
                {/* Mini progress bar */}
                {prog && (
                  <div style={{ width: 60, height: 4, borderRadius: 4, background: '#E0E0E0', overflow: 'hidden', flexShrink: 0 }}>
                    <div style={{ width: prog.pct + '%', height: '100%', background: prog.pct === 100 ? '#3A5240' : '#2E4D5C', transition: 'width 0.3s' }} />
                  </div>
                )}
                <span style={{ color: '#AAA', fontSize: 14, flexShrink: 0 }}>{isOpen ? '▲' : '▼'}</span>
              </div>

              {/* Stage body */}
              {isOpen && (
                <div style={{ padding: '12px 16px' }}>
                  {/* Date inputs */}
                  <div style={{ display: 'flex', gap: 16, marginBottom: 12, flexWrap: 'wrap' }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 12 }}>
                      <span style={{ color: '#888', flexShrink: 0 }}>預計日期</span>
                      <input type="date" value={stage.planned_date || ''} onChange={e => updateStage(stage.id, 'planned_date', e.target.value || null)}
                        style={{ border: '1px solid #D8D8D8', borderRadius: 5, padding: '3px 8px', fontSize: 12 }} />
                    </div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 12 }}>
                      <span style={{ color: '#888', flexShrink: 0 }}>實際完成</span>
                      <input type="date" value={stage.actual_date || ''} onChange={e => updateStage(stage.id, 'actual_date', e.target.value || null)}
                        style={{ border: '1px solid #D8D8D8', borderRadius: 5, padding: '3px 8px', fontSize: 12 }} />
                    </div>
                  </div>

                  {/* Checklist */}
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 6, marginBottom: 12 }}>
                    {items.map(item => (
                      item.is_question ? (
                        // Question format
                        <div key={item.id} style={{ display: 'flex', alignItems: 'flex-start', gap: 10, padding: '8px 10px', borderRadius: 6, background: item.answer ? '#F5FAF7' : '#FAFAFA', border: '1px solid ' + (item.answer ? '#C8DDD0' : '#EBEBEB') }}>
                          <input type="checkbox" checked={!!item.answer} readOnly
                            style={{ width: 14, height: 14, marginTop: 3, accentColor: '#3A5240', flexShrink: 0, cursor: 'default' }} />
                          <div style={{ flex: 1, minWidth: 0 }}>
                            <div style={{ fontSize: 12, color: '#666', marginBottom: 4 }}>{item.content}</div>
                            <IMETextarea value={item.answer || ''} onChange={val => updateAnswer(item.id, val)}
                              placeholder="填寫..."
                              style={{ width: '100%', border: '1px solid #D8D8D8', borderRadius: 5, padding: '5px 8px', fontSize: 13, resize: 'none', minHeight: 34, background: '#fff', outline: 'none', fontFamily: 'inherit' }} />
                          </div>
                          <button onClick={() => deleteCheckItem(item.id)} style={{ background: 'none', border: 'none', color: '#DDD', cursor: 'pointer', fontSize: 13, flexShrink: 0, marginTop: 2 }}>✕</button>
                        </div>
                      ) : (
                        // Checklist format
                        <div key={item.id} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '6px 10px', borderRadius: 6, background: item.is_checked ? '#F5FAF7' : '#FAFAFA', border: '1px solid ' + (item.is_checked ? '#C8DDD0' : '#EBEBEB') }}>
                          <input type="checkbox" checked={item.is_checked} onChange={() => toggleCheck(item)}
                            style={{ width: 16, height: 16, accentColor: '#3A5240', cursor: 'pointer', flexShrink: 0 }} />
                          <span style={{ flex: 1, fontSize: 13, color: item.is_checked ? '#888' : '#222', textDecoration: item.is_checked ? 'line-through' : 'none' }}>{item.content}</span>
                          <button onClick={() => deleteCheckItem(item.id)} style={{ background: 'none', border: 'none', color: '#DDD', cursor: 'pointer', fontSize: 13, flexShrink: 0 }}>✕</button>
                        </div>
                      )
                    ))}
                  </div>

                  {/* Add item */}
                  <div style={{ display: 'flex', gap: 6, marginBottom: 8 }}>
                    <IMEInput className="form-input form-input-sm" style={{ flex: 1 }}
                      value={newItem[stage.stage_key] || ''}
                      onChange={val => setNewItem(p => ({ ...p, [stage.stage_key]: val }))}
                      placeholder="新增項目..."
                      onKeyDown={e => e.key === 'Enter' && addCheckItem(stage.stage_key, false)} />
                    <button className="btn btn-ghost btn-sm" onClick={() => addCheckItem(stage.stage_key, false)}>＋ 待辦</button>
                    <button className="btn btn-ghost btn-sm" style={{ color: '#2E4D5C' }} onClick={() => addCheckItem(stage.stage_key, true)}>＋ 問題</button>
                  </div>

                  {/* Notes */}
                  <div style={{ marginTop: 10 }}>
                    <IMETextarea className="form-textarea" style={{ fontSize: 12, minHeight: 50, color: '#666' }}
                      value={stage.notes || ''}
                      onChange={val => updateStage(stage.id, 'notes', val)}
                      placeholder="此階段備註..." />
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function ProjectSummaryTab({ project, onUpdate, showCost }) {
  const [p, setP] = useState({ ...project });
  const [cats, setCats] = useState([]);
  const [items, setItems] = useState([]);
  const [purchaseItems, setPurchaseItems] = useState([]);
  const [bankAccounts, setBankAccounts] = useState([]);
  const [saveStatus, setSaveStatus] = useState(''); // '' | 'saving' | 'saved'
  const isDirty = React.useRef(false);
  const lastSaved = React.useRef(JSON.stringify(project));

  useEffect(() => {
    setP({ ...project });
    lastSaved.current = JSON.stringify(project);
    isDirty.current = false;
    db.from('work_categories').select('*').eq('project_id', project.id).order('sort_order').then(r => setCats(r.data || []));
    db.from('work_items').select('*').eq('project_id', project.id).then(r => setItems(r.data || []));
    db.from('purchase_items').select('*').eq('project_id', project.id).then(r => setPurchaseItems(r.data || []));
    db.from('bank_accounts').select('*').order('sort_order').then(r => setBankAccounts(r.data || []));
  }, [project.id]);

  // Auto-save: only fires when user actually edits (isDirty), not on prop changes
  useEffect(() => {
    if (!isDirty.current) return;
    setSaveStatus('saving');
    const timer = setTimeout(async () => {
      await db.from('projects').update({ ...p, updated_at: new Date().toISOString() }).eq('id', p.id);
      lastSaved.current = JSON.stringify(p);
      isDirty.current = false;
      onUpdate({ ...p });
      setSaveStatus('saved');
      setTimeout(() => setSaveStatus(''), 2000);
    }, 1500);
    return () => clearTimeout(timer);
  }, [p]);

  const upd = (k, v) => { isDirty.current = true; setP(prev => ({ ...prev, [k]: v })); };

  const catTotal = (catId) => items.filter(i => i.category_id === catId && i.unit !== '__note__').reduce((s, i) => s + (i.unit_price * i.quantity), 0);
  const catCost = (catId) => items.filter(i => i.category_id === catId && i.unit !== '__note__').reduce((s, i) => s + (i.cost_price || 0) * i.quantity, 0);
  const workTotal = cats.reduce((s, c) => s + catTotal(c.id), 0);
  const workCost = cats.reduce((s, c) => s + catCost(c.id), 0);
  const designFee = (p.area_sqm || 0) * (p.design_fee_per_sqm || 0);
  const mgmtFee = workTotal * ((p.management_fee_rate || 7) / 100);
  const subtotal = workTotal + designFee + mgmtFee;
  const tax = p.tax_enabled ? subtotal * ((p.tax_rate || 5) / 100) : 0;
  const purchaseTotal = purchaseItems.reduce((s, i) => s + i.unit_price * i.quantity, 0);
  const grandTotal = subtotal + tax + purchaseTotal;

  const selectedBank = bankAccounts.find(b => b.id === p.bank_account_id) || bankAccounts.find(b => b.is_default);

  return (
    <div>
      <div className="flex justify-between items-center mb-4">
        <div className="section-title">專案總表</div>
        <div style={{ fontSize: 12, color: saveStatus === 'saving' ? '#888' : '#3A5240', transition: 'color 0.3s' }}>
          {saveStatus === 'saving' ? '儲存中...' : saveStatus === 'saved' ? '已自動儲存' : ''}
        </div>
      </div>

      {/* Project info */}
      <div className="card mb-4">
        <div className="card-body">
          <div className="grid-2 mb-3">
            <div className="form-group"><label className="form-label">專案名稱</label>
              <input className="form-input" value={p.name || ''} onChange={e => upd('name', e.target.value)} /></div>
            <div className="form-group"><label className="form-label">日期</label>
              <input className="form-input" type="date" value={p.project_date?.split('T')[0] || ''} onChange={e => upd('project_date', e.target.value)} /></div>
          </div>
          <div className="grid-2 mb-3">
            <div className="form-group"><label className="form-label">客戶名稱</label>
              <input className="form-input" value={p.client_name || ''} onChange={e => upd('client_name', e.target.value)} /></div>
            <div className="form-group"><label className="form-label">聯絡人</label>
              <input className="form-input" value={p.contact_person || ''} onChange={e => upd('contact_person', e.target.value)} /></div>
          </div>
          <div className="grid-2">
            <div className="form-group"><label className="form-label">聯絡電話</label>
              <input className="form-input" value={p.contact_phone || ''} onChange={e => upd('contact_phone', e.target.value)} /></div>
            <div className="form-group"><label className="form-label">工程地址</label>
              <input className="form-input" value={p.address || ''} onChange={e => upd('address', e.target.value)} /></div>
          </div>
        </div>
      </div>

      {/* Cost summary */}
      <div className="card mb-4">
        <div className="card-header"><div className="card-title">工程費用總表</div></div>
        <div className="table-wrap">
          <table>
            <thead><tr><th>項次</th><th>項目名稱</th><th className="num">報價金額</th>{showCost && <th className="num" style={{ background: '#F2F0EC', color: '#6B4835' }}>成本</th>}{showCost && <th className="num" style={{ background: '#F2F0EC', color: '#6B4835' }}>毛利</th>}</tr></thead>
            <tbody>
              {cats.map((c, i) => (
                <tr key={c.id}>
                  <td style={{ width: 60, color: '#888' }}>{String.fromCharCode(65 + i)}</td>
                  <td>{c.name}</td>
                  <td className="num" style={{ color: catTotal(c.id) ? '#2E2E2E' : '#CCC' }}>{fmt(catTotal(c.id))}</td>
                  {showCost && <td className="num" style={{ background: '#F2F0EC', fontSize: 12, color: '#888' }}>{fmt(catCost(c.id))}</td>}
                  {showCost && <td className="num" style={{ background: '#F2F0EC', fontSize: 12, color: (catTotal(c.id)-catCost(c.id)) > 0 ? '#3A5240' : '#DC2626', fontWeight: 500 }}>{fmt(catTotal(c.id)-catCost(c.id))}</td>}
                </tr>
              ))}
            </tbody>
          </table>
          <div style={{ borderTop: '1px solid #E8E8E6', padding: '10px 16px', display: 'flex', flexDirection: 'column', gap: 6 }}>
            <div className="flex justify-between text-sm"><span>工程小計</span><span className="font-semibold">{fmt(workTotal)}</span></div>
            {showCost && <div className="flex justify-between text-sm" style={{ background: '#F2F0EC', padding: '4px 0', borderRadius: 4 }}>
              <span style={{ color: '#6B4835' }}>工程成本合計</span><span style={{ color: '#6B4835' }}>{fmt(workCost)}</span>
            </div>}
            {showCost && <div className="flex justify-between text-sm" style={{ background: '#F2F0EC', padding: '4px 0', borderRadius: 4 }}>
              <span style={{ color: '#333', fontWeight: 600 }}>工程毛利合計</span><span style={{ color: '#333', fontWeight: 600 }}>{fmt(workTotal - workCost)}</span>
            </div>}
            <div className="flex justify-between text-sm">
              <div className="flex items-center gap-2">
                <span>工程管理費</span>
                <input className="form-input-sm" style={{ width: 50 }} type="number" value={p.management_fee_rate || 7}
                  onChange={e => upd('management_fee_rate', +e.target.value)} />%
              </div>
              <span>{fmt(mgmtFee)}</span>
            </div>
            <div className="flex justify-between text-sm">
              <div className="flex items-center gap-2">
                <span>設計規劃費</span>
                <input className="form-input-sm" style={{ width: 55 }} type="number" value={p.area_sqm || 0}
                  onChange={e => upd('area_sqm', +e.target.value)} />坪 ×
                <input className="form-input-sm" style={{ width: 65 }} type="number" value={p.design_fee_per_sqm || 0}
                  onChange={e => upd('design_fee_per_sqm', +e.target.value)} />
              </div>
              <span>{fmt(designFee)}</span>
            </div>
            <div className="flex justify-between text-sm">
              <div className="flex items-center gap-2">
                <input type="checkbox" checked={!!p.tax_enabled} onChange={e => upd('tax_enabled', e.target.checked)} />
                <span>營業稅 ({p.tax_rate || 5}%)</span>
              </div>
              <span>{fmt(tax)}</span>
            </div>
            <div className="flex justify-between text-sm" style={{ color: '#8B2E2E' }}>
              <span>採購設備/材料總計</span><span>{fmt(purchaseTotal)}</span>
            </div>
            <div className="flex justify-between font-bold" style={{ fontSize: 16, borderTop: '1px solid #E8E8E6', paddingTop: 8 }}>
              <span>專案總結（含工程與採購）</span><span>{fmt(grandTotal)}</span>
            </div>
          </div>
        </div>
      </div>

      {/* Notes */}
      {(() => {
        const lines = (p.notes || '').split('\n');
        const updateLine = (idx, val) => {
          const next = [...lines]; next[idx] = val;
          upd('notes', next.join('\n'));
        };
        const deleteLine = (idx) => {
          const next = lines.filter((_, i) => i !== idx);
          upd('notes', next.join('\n'));
        };
        const addLine = () => {
          upd('notes', [...lines, ''].join('\n'));
        };
        return (
          <div className="card mb-4">
            <div className="card-header">
              <div className="card-title">注意事項與條款</div>
              <button className="btn btn-ghost btn-sm" onClick={addLine}>＋ 新增條款</button>
            </div>
            <div className="card-body" style={{ paddingTop: 8, paddingBottom: 8 }}>
              {lines.map((line, idx) => (
                <div key={idx} style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '5px 0', borderBottom: idx < lines.length - 1 ? '1px solid #F5F5F3' : 'none' }}>
                  <span style={{ color: '#888', fontSize: 13, minWidth: 22, flexShrink: 0 }}>{idx + 1}.</span>
                  <InlineEdit style={{ flex: 1, fontSize: 13 }}
                    value={line}
                    onChange={e => updateLine(idx, e.target.value)}
                    placeholder="輸入條款內容..." />
                  <button className="btn-icon" style={{ color: '#8B2E2E', opacity: 0.5, flexShrink: 0 }} onClick={() => deleteLine(idx)}>✕</button>
                </div>
              ))}
              {lines.length === 0 && (
                <div style={{ color: '#CCC', fontSize: 12, textAlign: 'center', padding: '12px 0' }}>尚無條款，點擊「新增條款」</div>
              )}
            </div>
          </div>
        );
      })()}

      {/* Bank info */}
      <div className="card mb-4">
        <div className="card-header">
          <div className="card-title">匯款資訊</div>
          <select className="form-select" style={{ width: 220 }} value={p.bank_account_id || ''}
            onChange={e => upd('bank_account_id', e.target.value)}>
            <option value="">請選擇匯款帳戶</option>
            {bankAccounts.map(b => <option key={b.id} value={b.id}>{b.bank_name}</option>)}
          </select>
        </div>
        {selectedBank && (
          <div className="card-body" style={{ fontSize: 13, lineHeight: 2 }}>
            <div>匯款銀行：{selectedBank.bank_name}</div>
            <div>帳號：{selectedBank.account_number}</div>
            <div>戶名：{selectedBank.account_holder}</div>
          </div>
        )}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────
// WORK DETAIL TAB
// ─────────────────────────────────────────
function WorkDetailTab({ project, onLock, showCost }) {
  const [cats, setCats] = useState([]);
  const [items, setItems] = useState([]);
  const [collapsed, setCollapsed] = useState({});
  const [showAddItem, setShowAddItem] = useState(null);
  const [newItem, setNewItem] = useState({ name: '', unit: '', quantity: 1, unit_price: 0, cost_price: 0, notes: '' });
  const [showAddCat, setShowAddCat] = useState(false);
  const [newCatName, setNewCatName] = useState('');
  const [showLockConfirm, setShowLockConfirm] = useState(false);
  const [templateCats, setTemplateCats] = useState([]);
  const [templateItems, setTemplateItems] = useState([]);
  const dragItem = useRef(null);
  const dragOver = useRef(null);
  const [importCatId, setImportCatId] = useState(null);
  const [importText, setImportText] = useState('');
  const [importPreview, setImportPreview] = useState([]);

  const load = useCallback(async () => {
    const { data: c } = await db.from('work_categories').select('*').eq('project_id', project.id).order('sort_order');
    const { data: i } = await db.from('work_items').select('*').eq('project_id', project.id).order('sort_order');
    setCats(c || []); setItems(i || []);
  }, [project.id]);

  useEffect(() => { load(); }, [load]);

  // Load template items for quick-select
  useEffect(() => {
    db.from('item_templates').select('*').order('category_name').order('sort_order').then(r => {
      const data = r.data || [];
      setTemplateItems(data);
      const uniqueCats = [...new Set(data.map(i => i.category_name).filter(Boolean))];
      setTemplateCats(uniqueCats);
    });
  }, []);

  const catItems = (catId) => items.filter(i => i.category_id === catId);
  const catTotal = (catId) => catItems(catId).reduce((s, i) => s + (i.unit_price * i.quantity), 0);
  const workTotal = cats.reduce((s, c) => s + catTotal(c.id), 0);
  const mgmtFee = workTotal * ((project.management_fee_rate || 7) / 100);

  const addItem = async () => {
    if (!newItem.name.trim()) return;
    await db.from('work_items').insert({ ...newItem, project_id: project.id, category_id: showAddItem, sort_order: catItems(showAddItem).length });
    if (project.is_locked) {
      const cat = cats.find(c => c.id === showAddItem);
      await db.from('change_orders').insert({ project_id: project.id, category_name: cat?.name || '', item_name: newItem.name, change_type: 'add', new_quantity: newItem.quantity, new_price: newItem.unit_price, notes: '（自動追蹤）' + (newItem.notes||'') });
      toast('已新增工程細項（自動記錄至追加追減）');
    } else { toast('已新增工程細項'); }
    setShowAddItem(null);
    setNewItem({ name: '', unit: '', quantity: 1, unit_price: 0, cost_price: 0, notes: '' });
    load();
  };

  const updateItem = async (id, field, val) => {
    const item = items.find(i => i.id === id);
    await db.from('work_items').update({ [field]: val }).eq('id', id);
    setItems(prev => prev.map(i => i.id === id ? { ...i, [field]: val } : i));
    if (project.is_locked && item && (field === 'unit_price' || field === 'quantity')) {
      const cat = cats.find(c => c.id === item.category_id);
      await db.from('change_orders').insert({
        project_id: project.id, category_name: cat?.name || '', item_name: item.name,
        change_type: 'add',
        original_quantity: item.quantity, new_quantity: field === 'quantity' ? val : item.quantity,
        original_price: item.unit_price, new_price: field === 'unit_price' ? val : item.unit_price,
        notes: '（自動追蹤 - 修改' + (field === 'unit_price' ? '單價' : '數量') + '）'
      });
    }
  };

  const deleteItem = async (id) => {
    const item = items.find(i => i.id === id);
    await db.from('work_items').delete().eq('id', id);
    if (project.is_locked && item) {
      const cat = cats.find(c => c.id === item.category_id);
      await db.from('change_orders').insert({ project_id: project.id, category_name: cat?.name || '', item_name: item.name, change_type: 'reduce', original_quantity: item.quantity, new_quantity: 0, original_price: item.unit_price, new_price: 0, notes: '（自動追蹤 - 刪除項目）' });
      toast('已刪除（自動記錄至追加追減）');
    } else { toast('已刪除'); }
    load();
  };

  const addCat = async () => {
    if (!newCatName.trim()) return;
    await db.from('work_categories').insert({ project_id: project.id, name: newCatName, sort_order: cats.length });
    setShowAddCat(false); setNewCatName(''); load(); toast('已新增大項');
  };

  const deleteCat = async (id) => {
    if (!confirm('刪除此大項及所有細項？')) return;
    await db.from('work_categories').delete().eq('id', id);
    load(); toast('已刪除大項');
  };

  const lockProject = async () => {
    await db.from('projects').update({ is_locked: true }).eq('id', project.id);
    toast('已鎖定第一版！往後變動將記錄於追加追減。');
    setShowLockConfirm(false);
    onLock();
  };

  const toggleCatVisible = async (catId, current) => {
    await db.from('work_categories').update({ is_visible: !current }).eq('id', catId);
    setCats(prev => prev.map(c => c.id === catId ? { ...c, is_visible: !current } : c));
  };

  const moveCat = async (index, dir) => {
    const si = index + dir;
    if (si < 0 || si >= cats.length) return;
    const a = cats[index], b = cats[si];
    await Promise.all([
      db.from('work_categories').update({ sort_order: b.sort_order }).eq('id', a.id),
      db.from('work_categories').update({ sort_order: a.sort_order }).eq('id', b.id),
    ]);
    load();
  };

  const moveItem = async (catId, index, dir) => {
    const list = catItems(catId);
    const si = index + dir;
    if (si < 0 || si >= list.length) return;
    const reordered = [...list];
    const [moved] = reordered.splice(index, 1);
    reordered.splice(si, 0, moved);
    await Promise.all(reordered.map((it, idx) =>
      db.from('work_items').update({ sort_order: idx }).eq('id', it.id)
    ));
    load();
  };

  const dropItem = async (catId) => {
    const list = catItems(catId);
    const from = dragItem.current;
    const to = dragOver.current;
    if (from === null || to === null || from === to) return;
    const reordered = [...list];
    const [moved] = reordered.splice(from, 1);
    reordered.splice(to, 0, moved);
    await Promise.all(reordered.map((it, idx) =>
      db.from('work_items').update({ sort_order: idx }).eq('id', it.id)
    ));
    dragItem.current = null; dragOver.current = null;
    load();
  };

  const insertTextRow = async (catId) => {
    const list = catItems(catId);
    await db.from('work_items').insert({ project_id: project.id, category_id: catId, name: '', unit: '__note__', quantity: 0, unit_price: 0, cost_price: 0, notes: '', sort_order: list.length });
    load();
  };

  const parseImportText = (text) => {
    if (!text.trim()) return [];
    const lines = text.trim().split('\n').filter(l => l.trim());
    return lines.map(line => {
      // Try tab-separated (from Excel paste)
      const parts = line.split('\t').map(s => s.trim());
      if (parts.length >= 2) {
        const last = parts[parts.length - 1];
        const secondLast = parts[parts.length - 2];
        const num = (s) => parseFloat(s.replace(/[,$,，]/g, '')) || 0;
        // Try: name, unit, qty, price or name, qty, price or name, price
        if (parts.length >= 4) {
          return { name: parts[0], unit: parts[1], quantity: num(parts[2]), cost_price: num(parts[3]), unit_price: num(parts[3]) };
        } else if (parts.length === 3) {
          return { name: parts[0], unit: parts[1], quantity: 1, cost_price: num(parts[2]), unit_price: num(parts[2]) };
        } else {
          return { name: parts[0], unit: '', quantity: 1, cost_price: num(parts[1]), unit_price: num(parts[1]) };
        }
      }
      // Comma separated
      const cparts = line.split(/[,，]/).map(s => s.trim());
      if (cparts.length >= 2) {
        const num = (s) => parseFloat(s.replace(/[$,]/g, '')) || 0;
        if (cparts.length >= 4) return { name: cparts[0], unit: cparts[1], quantity: num(cparts[2]), cost_price: num(cparts[3]), unit_price: num(cparts[3]) };
        if (cparts.length === 3) return { name: cparts[0], unit: cparts[1], quantity: 1, cost_price: num(cparts[2]), unit_price: num(cparts[2]) };
        return { name: cparts[0], unit: '', quantity: 1, cost_price: num(cparts[1]), unit_price: num(cparts[1]) };
      }
      // Single line with trailing number
      const m = line.match(/^(.+?)\s+([\d,]+(?:\.\d+)?)$/);
      if (m) return { name: m[1].trim(), unit: '', quantity: 1, cost_price: parseFloat(m[2].replace(/,/g,''))||0, unit_price: parseFloat(m[2].replace(/,/g,''))||0 };
      return { name: line.trim(), unit: '', quantity: 1, cost_price: 0, unit_price: 0 };
    }).filter(r => r.name);
  };

  const handleImportFile = async (file) => {
    try {
      const data = await file.arrayBuffer();
      const wb = XLSX.read(data, { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
      // Find header row
      let dataRows = rows;
      const headerIdx = rows.findIndex(r => r.some(c => String(c).match(/名稱|品項|項目|name/i)));
      if (headerIdx >= 0) dataRows = rows.slice(headerIdx + 1);
      const parsed = dataRows.filter(r => r[0]).map(r => {
        const num = (v) => parseFloat(String(v||0).replace(/[,$,，]/g,''))||0;
        if (r.length >= 4) return { name: String(r[0]), unit: String(r[1]||''), quantity: num(r[2])||1, cost_price: num(r[3]), unit_price: num(r[3]) };
        if (r.length === 3) return { name: String(r[0]), unit: String(r[1]||''), quantity: 1, cost_price: num(r[2]), unit_price: num(r[2]) };
        return { name: String(r[0]), unit: '', quantity: 1, cost_price: num(r[1]), unit_price: num(r[1]) };
      }).filter(r => r.name);
      setImportPreview(parsed);
      toast(`解析出 ${parsed.length} 筆，請確認後匯入`);
    } catch(e) { toast('檔案解析失敗：' + e.message, 'error'); }
  };

  const doImport = async () => {
    if (!importPreview.length || !importCatId) return;
    const base = catItems(importCatId).length;
    await db.from('work_items').insert(importPreview.map((r, i) => ({
      project_id: project.id, category_id: importCatId,
      name: r.name, unit: r.unit || '', quantity: r.quantity || 1,
      cost_price: r.cost_price || 0, unit_price: r.unit_price || 0,
      notes: '', sort_order: base + i,
    })));
    toast(`已匯入 ${importPreview.length} 筆細項`);
    setImportCatId(null); setImportText(''); setImportPreview([]);
    load();
  };

  const realCost = items.reduce((s, i) => s + (i.cost_price || 0) * i.quantity, 0);

  return (
    <div>
      <div className="flex justify-between items-center mb-4">
        <div>
          <div className="section-title">工程明細</div>
          {showCost && <div className="text-sm text-muted mt-1">
            發包實際成本：{fmt(realCost)} ｜ 預估毛利：{fmt(workTotal - realCost)}
          </div>}
        </div>
        <div className="flex gap-2">
          {!project.is_locked && (
            <button className="btn btn-ghost btn-sm" style={{ color: '#8B2E2E', borderColor: '#DC2626' }}
              onClick={() => setShowLockConfirm(true)}>鎖定第一版</button>
          )}
          {project.is_locked && <span className="tag" style={{ background: '#E0E0E0', color: '#444' }}>已鎖定第一版</span>}
          <button className="btn btn-ghost btn-sm" onClick={() => {
            const wb = XLSX.utils.book_new();
            const rows = [];
            cats.forEach((cat, ci) => {
              rows.push({ '項次': String.fromCharCode(65+ci), '細項名稱': cat.name, '單位': '', '數量': '', '報價單價': '', '報價總計': '', '備註': showCost ? '' : undefined, '成本單價': showCost ? '' : undefined });
              catItems(cat.id).forEach((item, ii) => {
                if (item.unit === '__note__') {
                  rows.push({ '項次': '', '細項名稱': '  ※ ' + item.name, '單位': '', '數量': '', '報價單價': '', '報價總計': '', '備註': '' });
                } else {
                  const r = { '項次': ii + 1, '細項名稱': item.name, '單位': item.unit, '數量': item.quantity, '報價單價': item.unit_price, '報價總計': item.unit_price * item.quantity, '備註': item.notes || '' };
                  if (showCost) { r['成本單價'] = item.cost_price || 0; r['毛利'] = (item.unit_price - (item.cost_price||0)) * item.quantity; }
                  rows.push(r);
                }
              });
              rows.push({ '項次': '', '細項名稱': '小計', '單位': '', '數量': '', '報價單價': '', '報價總計': catTotal(cat.id), '備註': '' });
              rows.push({});
            });
            const ws = XLSX.utils.json_to_sheet(rows);
            ws['!cols'] = [{ wch: 6 }, { wch: 36 }, { wch: 6 }, { wch: 6 }, { wch: 10 }, { wch: 12 }, { wch: 20 }];
            XLSX.utils.book_append_sheet(wb, ws, '工程明細');
            XLSX.writeFile(wb, project.name + '_工程明細.xlsx');
          }}>匯出 Excel</button>
          <button className="btn btn-primary btn-sm" onClick={() => setShowAddCat(true)}>＋ 新增大項</button>
        </div>
      </div>

      {cats.map((cat, ci) => (
        <div key={cat.id} className="mb-3">
          <div className="category-header" onClick={() => setCollapsed(p => ({ ...p, [cat.id]: !p[cat.id] }))}
            style={{ opacity: cat.is_visible === false ? 0.5 : 1 }}>
            <div className="flex items-center gap-2">
              <span style={{ color: '#888', fontSize: 12, width: 20 }}>{String.fromCharCode(65 + ci)}.</span>
              <span>{cat.name}</span>
              {cat.is_visible === false && <span style={{ fontSize: 11, color: '#999', background: '#F2F2F2', borderRadius: 4, padding: '1px 6px' }}>已隱藏</span>}
              <span style={{ fontSize: 12, color: '#2E4D5C', marginLeft: 8 }}>小計：{fmt(catTotal(cat.id))}</span>
            </div>
            <div className="flex gap-2" onClick={e => e.stopPropagation()}>
              <button className="btn btn-ghost btn-xs" onClick={() => moveCat(ci, -1)} disabled={ci===0} style={{ padding: '3px 7px' }}>↑</button>
              <button className="btn btn-ghost btn-xs" onClick={() => moveCat(ci, 1)} disabled={ci===cats.length-1} style={{ padding: '3px 7px' }}>↓</button>
              <button className="btn btn-ghost btn-xs" onClick={() => setShowAddItem(cat.id)}>＋ 新增細項</button>
              <button className="btn btn-ghost btn-xs" onClick={() => insertTextRow(cat.id)}>＋ 空行</button>
              <button className="btn btn-ghost btn-xs" style={{ color: '#6B4835', borderColor: '#C8B8A8' }} onClick={() => setImportCatId(cat.id)}>匯入廠商估價</button>
              <button className="btn btn-xs" style={{ border: '1px solid #DDD', borderRadius: 4, padding: '3px 8px', background: cat.is_visible === false ? '#F2F2F2' : '#fff', color: cat.is_visible === false ? '#888' : '#444' }}
                onClick={() => toggleCatVisible(cat.id, cat.is_visible !== false)}>{cat.is_visible === false ? '顯示' : '隱藏'}</button>
              <button className="btn btn-xs" style={{ background: '#FFF0F0', color: '#8B2E2E', border: '1px solid #EEC0C0', borderRadius: 4, padding: '3px 8px' }}
                onClick={() => deleteCat(cat.id)}>刪除</button>
              <span style={{ color: '#888', fontSize: 14 }}>{collapsed[cat.id] ? '▲' : '▼'}</span>
            </div>
          </div>
          {!collapsed[cat.id] && (
            <div className="category-body">
              <table style={{ width: '100%', borderCollapse: 'collapse' }}>
                <thead>
                  <tr style={{ background: '#888' }}>
                    <th style={{ padding: '9px 14px', fontSize: 12, color: '#222', fontWeight: 700, borderBottom: '2px solid #777', textAlign: 'left' }}>細項名稱</th>
                    <th style={{ width: 60, padding: '9px 8px', fontSize: 12, color: '#222', fontWeight: 700, borderBottom: '2px solid #777', textAlign: 'center' }}>單位</th>
                    <th style={{ width: 70, padding: '9px 8px', fontSize: 12, color: '#222', fontWeight: 700, borderBottom: '2px solid #777', textAlign: 'center' }}>數量</th>
                    {showCost && <th style={{ width: 90, padding: '9px 8px', background: '#4A3A2A', fontSize: 12, color: '#E8D8C0', fontWeight: 700, borderBottom: '2px solid #777', textAlign: 'right' }}>成本單價</th>}
                    <th style={{ width: 90, padding: '9px 8px', fontSize: 12, color: '#222', fontWeight: 700, borderBottom: '2px solid #777', textAlign: 'right' }}>報價單價</th>
                    <th style={{ width: 100, padding: '9px 8px', fontSize: 12, color: '#222', fontWeight: 700, borderBottom: '2px solid #777', textAlign: 'right' }}>報價總計</th>
                    {showCost && <th style={{ width: 90, padding: '9px 8px', background: '#4A3A2A', fontSize: 12, color: '#E8D8C0', fontWeight: 700, borderBottom: '2px solid #777', textAlign: 'right' }}>毛利</th>}
                    <th style={{ width: 120, padding: '9px 8px', fontSize: 12, color: '#222', fontWeight: 700, borderBottom: '2px solid #777', textAlign: 'left' }}>備註</th>
                    <th style={{ width: 60, padding: '9px 8px', borderBottom: '2px solid #777' }}></th>
                  </tr>
                </thead>
                <tbody>
                  {catItems(cat.id).map((item, ii) => {
                    const isNote = item.unit === '__note__';
                    if (isNote) return (
                      <tr key={item.id} style={{ background: '#fff', borderBottom: '1px solid #EAEAE8' }}>
                        <td colSpan={showCost ? 7 : 5} style={{ padding: '7px 14px' }}>
                          <InlineEdit value={item.name} placeholder="補充說明文字..."
                            onChange={val => updateItem(item.id, 'name', val)}
                            style={{ width: '100%', color: '#666', fontStyle: item.name ? 'italic' : 'italic', fontSize: 12 }} />
                        </td>
                        <td colSpan={2} style={{ padding: '7px 8px', textAlign: 'right' }}>
                          <div className="flex gap-1" style={{ justifyContent: 'flex-end' }}>
                            <button className="btn-icon" style={{ fontSize: 11, color: '#888' }} onClick={() => moveItem(cat.id, ii, -1)}>↑</button>
                            <button className="btn-icon" style={{ fontSize: 11, color: '#888' }} onClick={() => moveItem(cat.id, ii, 1)}>↓</button>
                            <button className="btn-icon" style={{ color: '#8B2E2E', fontSize: 14 }} onClick={() => deleteItem(item.id)}>✕</button>
                          </div>
                        </td>
                      </tr>
                    );
                    return (
                    <tr key={item.id} style={{ background: '#fff', borderBottom: '1px solid #EAEAE8' }}>
                      <td style={{ padding: '9px 14px' }}>
                        <InlineEdit value={item.name} onChange={val => updateItem(item.id, 'name', val)} /></td>
                      <td style={{ padding: '9px 8px', textAlign: 'center' }}>
                        <InlineEdit style={{ textAlign: 'center', width: 50 }} value={item.unit || ''} onChange={val => updateItem(item.id, 'unit', val)} /></td>
                      <td style={{ padding: '9px 8px', textAlign: 'center' }}>
                        <InlineEdit style={{ textAlign: 'center', width: 60 }} type="number" value={item.quantity || 1}
                          onChange={val => updateItem(item.id, 'quantity', +val)} /></td>
                      {showCost && <td style={{ padding: '9px 8px', background: '#F5F3F0', textAlign: 'right' }}>
                        <InlineEdit style={{ textAlign: 'right', width: 75 }} type="number" value={item.cost_price || 0}
                          onChange={val => updateItem(item.id, 'cost_price', +val)} /></td>}
                      <td style={{ padding: '9px 8px', textAlign: 'right' }}>
                        <InlineEdit style={{ textAlign: 'right', width: 80 }} type="number" value={item.unit_price || 0}
                          onChange={val => updateItem(item.id, 'unit_price', +val)} /></td>
                      <td style={{ padding: '9px 8px', textAlign: 'right', fontWeight: 600, color: '#222' }}>{fmt(item.unit_price * item.quantity)}</td>
                      {showCost && <td style={{ padding: '9px 8px', background: '#F5F3F0', textAlign: 'right', fontSize: 12, color: (item.unit_price - item.cost_price) * item.quantity > 0 ? '#333' : '#DC2626' }}>
                        {fmt((item.unit_price - item.cost_price) * item.quantity)}
                      </td>}
                      <td style={{ padding: '9px 8px', color: '#666', fontSize: 12 }}>
                        <InlineEdit value={item.notes || ''} onChange={val => updateItem(item.id, 'notes', val)} /></td>
                      <td style={{ padding: '6px 8px', textAlign: 'center' }}>
                        <div className="flex gap-1" style={{ justifyContent: 'center' }}>
                          <button className="btn-icon" style={{ fontSize: 11, color: '#888' }} onClick={() => moveItem(cat.id, ii, -1)}>↑</button>
                          <button className="btn-icon" style={{ fontSize: 11, color: '#888' }} onClick={() => moveItem(cat.id, ii, 1)}>↓</button>
                          <button className="btn-icon" style={{ color: '#8B2E2E', fontSize: 14 }} onClick={() => deleteItem(item.id)}>✕</button>
                        </div>
                      </td>
                    </tr>
                  );})}
                  {catItems(cat.id).length === 0 && (
                    <tr><td colSpan={showCost ? 9 : 7} style={{ padding: '16px', textAlign: 'center', color: '#CCC', fontSize: 12 }}>尚無細項，點擊「新增細項」開始輸入</td></tr>
                  )}
                </tbody>
              </table>
              <div className="category-subtotal">小計：{fmt(catTotal(cat.id))}</div>
            </div>
          )}
        </div>
      ))}

      <div style={{ marginTop: 16, background: '#F8F8F6', borderRadius: 8, padding: '14px 20px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <span className="font-semibold">工程小計</span>
        <span className="font-bold" style={{ fontSize: 18, color: '#2E4D5C' }}>{fmt(workTotal)}</span>
      </div>
      <div style={{ marginTop: 8, textAlign: 'right', fontSize: 12, color: '#888' }}>
        工程管理費 ({project.management_fee_rate || 7}%)：{fmt(mgmtFee)}
      </div>

      {/* Vendor Import Modal */}
      <Modal open={!!importCatId} title={'匯入廠商估價 — ' + (cats.find(c => c.id === importCatId)?.name || '')}
        onClose={() => { setImportCatId(null); setImportText(''); setImportPreview([]); }}
        footer={
          <>
            <button className="btn btn-ghost" onClick={() => { setImportCatId(null); setImportText(''); setImportPreview([]); }}>取消</button>
            <button className="btn btn-primary" onClick={doImport} disabled={!importPreview.length}>
              匯入 {importPreview.length > 0 ? importPreview.length + ' 筆' : ''}
            </button>
          </>
        }>
        <div style={{ fontSize: 12, color: '#666', marginBottom: 8 }}>
          支援格式：<br/>
          · Excel / CSV 上傳（欄位順序：品名、單位、數量、廠商報價）<br/>
          · 文字貼上：每行一筆，欄位用 Tab 或逗號分隔
        </div>
        {/* Excel upload */}
        <div style={{ marginBottom: 12 }}>
          <label style={{ display: 'inline-flex', alignItems: 'center', gap: 8, cursor: 'pointer', padding: '7px 14px', border: '1px solid #D0CCC8', borderRadius: 6, background: '#F5F3F0', fontSize: 12, color: '#6B4835' }}>
            上傳 Excel / CSV
            <input type="file" accept=".xlsx,.xls,.csv" style={{ display: 'none' }}
              onChange={async e => { if (e.target.files[0]) { await handleImportFile(e.target.files[0]); e.target.value = ''; } }} />
          </label>
        </div>
        {/* Text paste */}
        <div className="form-group" style={{ marginBottom: 10 }}>
          <label className="form-label">或直接貼上文字</label>
          <IMETextarea className="form-textarea" style={{ minHeight: 100, fontSize: 12, fontFamily: 'monospace' }}
            value={importText}
            onChange={val => { setImportText(val); setImportPreview(parseImportText(val)); }}
            placeholder={'例：\n磁磚鋪設\t坪\t20\t3500\n衛浴配件安裝\t式\t1\t8000'} />
        </div>
        {/* Preview */}
        {importPreview.length > 0 && (
          <div>
            <div style={{ fontSize: 12, fontWeight: 600, marginBottom: 6, color: '#555' }}>預覽（共 {importPreview.length} 筆）</div>
            <div style={{ maxHeight: 200, overflowY: 'auto', border: '1px solid #E8E8E6', borderRadius: 6 }}>
              <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 11 }}>
                <thead>
                  <tr style={{ background: '#D8D8D8' }}>
                    <th style={{ padding: '5px 8px', textAlign: 'left', color: '#333' }}>品名</th>
                    <th style={{ padding: '5px 8px', textAlign: 'center', color: '#333' }}>單位</th>
                    <th style={{ padding: '5px 8px', textAlign: 'right', color: '#333' }}>數量</th>
                    <th style={{ padding: '5px 8px', textAlign: 'right', color: '#6B4835' }}>廠商報價（成本）</th>
                  </tr>
                </thead>
                <tbody>
                  {importPreview.map((r, i) => (
                    <tr key={i} style={{ borderBottom: '1px solid #F0F0F0' }}>
                      <td style={{ padding: '4px 8px' }}>{r.name}</td>
                      <td style={{ padding: '4px 8px', textAlign: 'center', color: '#888' }}>{r.unit || '–'}</td>
                      <td style={{ padding: '4px 8px', textAlign: 'right' }}>{r.quantity}</td>
                      <td style={{ padding: '4px 8px', textAlign: 'right', color: '#6B4835', fontWeight: 500 }}>{fmt(r.cost_price)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <div style={{ fontSize: 11, color: '#AAA', marginTop: 6 }}>廠商報價將填入「成本單價」欄，報價單價請匯入後另行填寫</div>
          </div>
        )}
      </Modal>

      {/* Add Item Modal */}
      <Modal open={!!showAddItem} title="新增工程細項" onClose={() => setShowAddItem(null)}
        footer={<><button className="btn btn-ghost" onClick={() => setShowAddItem(null)}>取消</button><button className="btn btn-primary" onClick={addItem}>新增</button></>}>
        {/* Quick-pick from templates */}
        {(() => {
          const catName = cats.find(c => c.id === showAddItem)?.name || '';
          const tpls = templateItems.filter(t => t.category_name === catName);
          return tpls.length > 0 ? (
            <div className="form-group">
              <label className="form-label">從資料庫快選</label>
              <select className="form-select" onChange={e => {
                const t = templateItems.find(i => i.id === e.target.value);
                if (t) setNewItem({ name: t.item_name, unit: t.unit||'', quantity: t.quantity||1, unit_price: t.unit_price||0, cost_price: t.cost_price||0, notes: t.notes||'' });
              }}>
                <option value="">— 選擇資料庫細項（自動帶入）—</option>
                {tpls.map(t => <option key={t.id} value={t.id}>{t.item_name}　{t.unit} / {fmt(t.unit_price)}</option>)}
              </select>
            </div>
          ) : null;
        })()}
        <div className="form-group"><label className="form-label">細項名稱 *</label>
          <input className="form-input" value={newItem.name} onChange={e => setNewItem(p => ({ ...p, name: e.target.value }))} /></div>
        <div className="grid-3">
          <div className="form-group"><label className="form-label">單位</label>
            <input className="form-input" value={newItem.unit} onChange={e => setNewItem(p => ({ ...p, unit: e.target.value }))} /></div>
          <div className="form-group"><label className="form-label">數量</label>
            <input className="form-input" type="number" value={newItem.quantity} onChange={e => setNewItem(p => ({ ...p, quantity: +e.target.value }))} /></div>
          <div className="form-group"><label className="form-label">報價單價</label>
            <input className="form-input" type="number" value={newItem.unit_price} onChange={e => setNewItem(p => ({ ...p, unit_price: +e.target.value }))} /></div>
        </div>
        <div className="grid-2">
          <div className="form-group"><label className="form-label">成本單價</label>
            <input className="form-input" type="number" value={newItem.cost_price} onChange={e => setNewItem(p => ({ ...p, cost_price: +e.target.value }))} /></div>
          <div className="form-group"><label className="form-label">備註</label>
            <input className="form-input" value={newItem.notes} onChange={e => setNewItem(p => ({ ...p, notes: e.target.value }))} /></div>
        </div>
      </Modal>

      {/* Add Category Modal */}
      <Modal open={showAddCat} title="新增工程大項" onClose={() => setShowAddCat(false)}
        footer={<><button className="btn btn-ghost" onClick={() => setShowAddCat(false)}>取消</button><button className="btn btn-primary" onClick={addCat}>新增</button></>}>
        <div className="form-group"><label className="form-label">大項名稱 *</label>
          <input className="form-input" list="cat-db-list" value={newCatName} onChange={e => setNewCatName(e.target.value)} placeholder="輸入或從資料庫選擇..." />
          <datalist id="cat-db-list">{templateCats.map(c => <option key={c} value={c} />)}</datalist>
          {templateCats.length > 0 && <div style={{ fontSize: 11, color: '#888', marginTop: 4 }}>資料庫大項：{templateCats.join('、')}</div>}
        </div>
      </Modal>

      {/* Lock Confirm */}
      <Modal open={showLockConfirm} title="確認鎖定第一版" onClose={() => setShowLockConfirm(false)}
        footer={<><button className="btn btn-ghost" onClick={() => setShowLockConfirm(false)}>取消</button><button className="btn btn-danger" onClick={lockProject}>確認鎖定</button></>}>
        <div style={{ fontSize: 14, lineHeight: 1.8 }}>
          鎖定後，目前的工程明細將記錄為「第一版估價單」。<br />
          往後新增、修改或刪除的項目，將自動記錄在<strong>追加追減</strong>明細中。<br /><br />
          此操作<span className="text-danger">無法復原</span>，確定要鎖定嗎？
        </div>
      </Modal>
    </div>
  );
}
