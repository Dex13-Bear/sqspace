<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="dns-prefetch" href="https://cdn.jsdelivr.net">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>無澀空間 專案管理</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC',sans-serif;background:#F4F4F4;color:#2E2E2E;font-size:14px;line-height:1.6}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:#F0F0F0}
::-webkit-scrollbar-thumb{background:#C4C4C4;border-radius:3px}
input,textarea,select{font-family:'Noto Sans TC',sans-serif;font-size:13px}
button{cursor:pointer;font-family:'Noto Sans TC',sans-serif;font-size:13px}

/* Layout */
.app-layout{display:flex;height:100vh;overflow:hidden}
.sidebar{width:200px;min-width:200px;background:#fff;color:#1A1A1A;display:flex;flex-direction:column;overflow-y:auto}
.main-content{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:52px;background:#fff;border-bottom:1px solid #E0E0E0;display:flex;align-items:center;padding:0 24px;gap:12px;flex-shrink:0}
.page-body{flex:1;overflow-y:auto;padding:24px}

/* Sidebar */
.sidebar-logo{padding:16px;border-bottom:1px solid #E0E0E0;display:flex;align-items:center;justify-content:center}
.sidebar-logo img{max-width:100%;max-height:40px;object-fit:contain}
.sidebar-logo-text{font-size:15px;font-weight:600;letter-spacing:0.05em;color:#1A1A1A}
.sidebar-section{padding:8px 0}
.sidebar-section-title{font-size:10px;color:#999;padding:8px 16px 4px;text-transform:uppercase;letter-spacing:0.1em}
.sidebar-item{display:flex;align-items:center;gap:10px;padding:8px 16px;color:#888;cursor:pointer;transition:all .15s;font-size:13px;border-left:3px solid transparent}
.sidebar-item:hover{background:#333333;color:#E0E0E0}
.sidebar-item.active{background:#333333;color:#fff;border-left-color:#7A9A8A}
.sidebar-item svg{flex-shrink:0}
.sidebar-user{margin-top:auto;padding:12px 16px;border-top:1px solid #E0E0E0;display:flex;align-items:center;gap:8px}
.sidebar-user-name{font-size:12px;color:#888}

/* Topbar */
.topbar-title{font-size:16px;font-weight:600;flex:1}
.topbar-subtitle{font-size:12px;color:#888;flex:1}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:6px;border:none;font-weight:500;transition:all .15s;white-space:nowrap}
.btn-primary{background:#222;color:#fff}.btn-primary:hover{background:#333}
.btn-success{background:#444;color:#fff}.btn-success:hover{background:#333}
.btn-danger{background:#8B2E2E;color:#fff}.btn-danger:hover{background:#6B2020}
.btn-ghost{background:transparent;color:#555;border:1px solid #D8D8D8}.btn-ghost:hover{background:#F0F0F0}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-xs{padding:3px 8px;font-size:11px}
.btn-icon{padding:6px;background:transparent;border:none;color:#999}.btn-icon:hover{color:#222}

/* Forms */
.form-group{display:flex;flex-direction:column;gap:4px}
.form-label{font-size:12px;color:#555;font-weight:500}
.form-input{border:1px solid #D8D8D8;border-radius:6px;padding:7px 10px;background:#fff;width:100%;transition:border .15s;outline:none}
.form-input:focus{border-color:#2E4D5C}
.form-input-sm{padding:4px 8px;font-size:12px;border-radius:4px}
.form-select{border:1px solid #D8D8D8;border-radius:6px;padding:7px 10px;background:#fff;width:100%;outline:none;cursor:pointer}
.form-textarea{border:1px solid #D8D8D8;border-radius:6px;padding:8px 10px;background:#fff;width:100%;resize:vertical;outline:none;min-height:80px}
.form-textarea:focus,.form-select:focus{border-color:#2E4D5C}

/* Cards */
.card{background:#fff;border-radius:8px;border:1px solid #E0E0E0;overflow:hidden}
.card-header{padding:14px 20px;border-bottom:1px solid #EBEBEB;display:flex;align-items:center;gap:12px}
.card-title{font-size:15px;font-weight:600}
.card-body{padding:20px}

/* Tables */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{background:#F5F5F5;padding:8px 12px;text-align:left;font-size:12px;font-weight:700;color:#444;border-bottom:2px solid #D8D8D8;white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid #EBEBEB;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#FAFAFA}
td.num{text-align:right;font-variant-numeric:tabular-nums}
th.num{text-align:right}

/* Project status badges */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:500}
.badge-active{background:#E8E8E8;color:#2E2E2E}
.badge-change{background:#C8C8C8;color:#333}
.badge-closed{background:#F0F0F0;color:#888}

/* Tabs */
.tab-bar{display:flex;gap:0;border-bottom:2px solid #E0E0E0;overflow-x:auto;flex-shrink:0}
.tab-item{padding:10px 18px;cursor:pointer;font-size:13px;font-weight:500;color:#999;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:all .15s}
.tab-item:hover{color:#333}
.tab-item.active{color:#2E2E2E;border-bottom-color:#2E2E2E;font-weight:700}
.tab-content{flex:1;overflow-y:auto;padding:24px}

/* Project list */
.project-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.project-card{background:#fff;border-radius:8px;border:1px solid #E0E0E0;padding:18px;cursor:pointer;transition:all .15s}
.project-card:hover{border-color:#888;box-shadow:0 2px 12px rgba(0,0,0,.08);transform:translateY(-1px)}
.project-card-name{font-size:16px;font-weight:600;margin-bottom:4px}
.project-card-client{font-size:12px;color:#888;margin-bottom:10px}
.project-card-meta{display:flex;gap:8px;font-size:11px;color:#999}

/* Section headers */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.section-title{font-size:16px;font-weight:700}

/* Summary table */
.summary-row{display:grid;grid-template-columns:120px 1fr auto;gap:12px;padding:10px 16px;border-bottom:1px solid #EBEBEB;align-items:center}
.summary-total{background:#F5F5F5;font-weight:700;font-size:15px;border-radius:0 0 8px 8px}

/* Work item table */
.category-header{background:#EBEBEB;padding:11px 16px;font-weight:700;font-size:13.5px;display:flex;align-items:center;justify-content:space-between;border-radius:6px 6px 0 0;border:1px solid #D4D4D4;border-bottom:none;cursor:pointer}
.category-body{border:1px solid #D4D4D4;border-radius:0 0 6px 6px;margin-bottom:20px;overflow:hidden}
.category-subtotal{background:#F5F5F5;padding:8px 16px;text-align:right;font-size:12px;font-weight:700;color:#333;border-top:1px solid #E0E0E0}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:10px;width:100%;max-width:560px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
.modal-header{padding:18px 20px;border-bottom:1px solid #E0E0E0;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.modal-title{font-size:16px;font-weight:700}
.modal-body{padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.modal-footer{padding:14px 20px;border-top:1px solid #E0E0E0;display:flex;justify-content:flex-end;gap:8px;flex-shrink:0}

/* Grid helpers */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.flex{display:flex}.flex-1{flex:1}.items-center{align-items:center}.justify-between{justify-content:space-between}.gap-2{gap:8px}.gap-3{gap:12px}.gap-4{gap:16px}
.mb-2{margin-bottom:8px}.mb-3{margin-bottom:12px}.mb-4{margin-bottom:16px}.mb-6{margin-bottom:24px}
.mt-2{margin-top:8px}.mt-3{margin-top:12px}.mt-4{margin-top:16px}
.text-sm{font-size:12px}.text-xs{font-size:11px}.text-muted{color:#888}.text-danger{color:#8B2E2E}.text-success{color:#333}.text-primary{color:#333}
.font-bold{font-weight:700}.font-semibold{font-weight:600}
.text-right{text-align:right}.text-center{text-align:center}
.divider{border:none;border-top:1px solid #E0E0E0;margin:16px 0}
.tag{display:inline-flex;padding:2px 8px;background:#EBEBEB;color:#444;border-radius:4px;font-size:11px;font-weight:500}

/* Gantt */
.gantt-wrap{overflow-x:auto}
.gantt-table{border-collapse:collapse;min-width:100%}
.gantt-table th,.gantt-table td{padding:6px 8px;border:1px solid #E0E0E0;font-size:12px}
.gantt-table th{background:#F5F5F5;font-weight:600;white-space:nowrap;min-width:100px}
.gantt-bar{background:#333;border-radius:4px;height:22px;display:flex;align-items:center;padding:0 8px;color:#fff;font-size:11px;white-space:nowrap}
.gantt-holiday{background:#F0F0F0}

/* Login */
.login-page{min-height:100vh;background:#EBEBEB;display:flex;align-items:center;justify-content:center}
.login-card{background:#fff;border-radius:12px;padding:48px 40px;width:100%;max-width:380px;box-shadow:0 4px 32px rgba(0,0,0,.08)}
.login-logo{text-align:center;margin-bottom:32px}
.login-title{font-size:22px;font-weight:700;text-align:center;margin-bottom:6px}
.login-subtitle{font-size:13px;color:#888;text-align:center;margin-bottom:28px}

/* Toast */
.toast-container{position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{background:#fff;border:1px solid #E0E0E0;border-radius:8px;padding:12px 16px;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.1);display:flex;align-items:center;gap:8px;min-width:240px}
.toast-success{border-left:3px solid #555}
.toast-error{border-left:3px solid #8B2E2E}

/* Change orders */
.co-add{color:#3A5240;font-weight:600}
.co-reduce{color:#DC2626;font-weight:600}

/* Inline edit */
.inline-edit{border:none;background:transparent;width:100%;padding:2px 4px;border-radius:4px;font-size:13px}
.inline-edit:hover{background:#F0F0F0}
.inline-edit:focus{background:#fff;border:1px solid #888;outline:none}

/* Todo */
.todo-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid #F0F0F0}
.todo-check{width:18px;height:18px;cursor:pointer;accent-color:#333;flex-shrink:0;margin-top:2px}
.todo-done{text-decoration:line-through;color:#B0B0B0}

/* Site log */
.log-card{border:1px solid #E0E0E0;border-radius:8px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,0.18)}
.log-date-header{font-weight:600;font-size:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px}

/* Gallery */
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.gallery-card{border:1px solid #E0E0E0;border-radius:8px;overflow:hidden;background:#fff}
.gallery-img{width:100%;height:160px;object-fit:cover;background:#F0F0F0;display:flex;align-items:center;justify-content:center;color:#CCC;font-size:13px}
.gallery-info{padding:10px 12px}

/* Payment */
.payment-row{display:grid;grid-template-columns:auto 2fr 1fr 1fr 1fr 1fr 1fr auto;gap:0;align-items:center}
.payment-header{background:#F5F5F5;border-radius:6px 6px 0 0}
.payment-cell{padding:10px 12px;border-bottom:1px solid #EBEBEB;font-size:13px}

/* ── Print ── */
@media print{
  .no-print{display:none!important}
  body{background:#fff!important;margin:0;padding:0}
  #root > *{display:none!important}
  .print-doc-container{display:block!important;position:static!important;overflow:visible!important}
}

/* Global todos panel */
.global-todos{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:24px}
.global-todo-card{background:#fff;border-radius:8px;border:1px solid #E0E0E0;padding:16px}
.global-todo-card-title{font-size:13px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.global-todo-item{padding:6px 0;border-bottom:1px solid #F0F0F0;font-size:12px;color:#444}
.global-todo-source{font-size:10px;color:#999;margin-top:2px}

/* Spinner */
.spinner{width:32px;height:32px;border:3px solid #E0E0E0;border-top-color:#333;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-center{display:flex;align-items:center;justify-content:center;padding:60px;flex-direction:column;gap:12px;color:#888;font-size:13px}

/* Project detail layout */
.project-detail{display:flex;flex-direction:column;height:100%}
.project-topbar{padding:16px 24px;background:#fff;border-bottom:1px solid #E0E0E0;display:flex;align-items:center;gap:16px;flex-shrink:0}
.project-tabs-bar{background:#fff;border-bottom:2px solid #E0E0E0;padding:0 24px;display:flex;overflow-x:auto;flex-shrink:0}

/* Admin */
.admin-section{background:#fff;border-radius:8px;border:1px solid #E0E0E0;margin-bottom:20px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.18)}
.admin-section-header{padding:9px 14px;border-bottom:1px solid #B8B8B8;font-weight:700;font-size:13px;background:#C8C8C8}
.admin-section-body{padding:20px}
/* ── Mobile ── */
@media (max-width: 768px) {
  body { font-size: 13px; }

  /* Layout */
  .app-layout { flex-direction: column }
  .sidebar {
    position: fixed; top: 0; left: 0; bottom: 0; z-index: 500;
    transform: translateX(-100%); transition: transform .25s ease;
    width: 220px; min-width: 220px;
  }
  .sidebar.open { transform: translateX(0); box-shadow: 4px 0 24px rgba(0,0,0,.4) }
  .sidebar-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 499;
  }
  .sidebar-overlay.open { display: block }
  .main-content { width: 100%; height: 100vh }
  .topbar { padding: 0 12px; gap: 8px }
  .topbar-title { font-size: 14px }
  .page-body { padding: 12px }

  /* Hamburger button */
  .hamburger { display: flex !important }

  /* Project list */
  .project-grid { grid-template-columns: 1fr }
  .global-todos { grid-template-columns: 1fr }

  /* Tables - horizontal scroll */
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch }
  table { min-width: 500px }

  /* Project tabs */
  .project-tabs-bar { padding: 0 8px }
  .tab-item { padding: 10px 12px; font-size: 12px }
  .tab-content { padding: 12px }

  /* Modal full screen */
  .modal-overlay { padding: 0; align-items: flex-end }
  .modal { max-width: 100%; max-height: 92vh; border-radius: 16px 16px 0 0 }

  /* Project topbar */
  .project-topbar { padding: 10px 12px; flex-wrap: wrap; gap: 8px }

  /* Gallery */
  .gallery-grid { grid-template-columns: repeat(2, 1fr); gap: 10px }

  /* Cards */
  .card-body { padding: 12px }

  /* Grid helpers */
  .grid-2, .grid-3 { grid-template-columns: 1fr }

  /* Buttons */
  .btn { padding: 6px 10px; font-size: 12px }

  /* Log cards */
  .log-card { padding: 12px }

  /* Section header */
  .section-header { flex-wrap: wrap; gap: 8px }
}
.hamburger { display: none; background: none; border: none; color: #fff; padding: 6px; cursor: pointer; flex-direction: column; gap: 4px; flex-shrink: 0 }
.hamburger span { display: block; width: 20px; height: 2px; background: #555; border-radius: 2px }
</style>
</head>

<div id="app-boot" style="position:fixed;inset:0;background:#1A1A1A;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;font-family:sans-serif">
  <div style="color:#C8A96E;font-size:28px;font-weight:700;letter-spacing:.1em;margin-bottom:8px">無澀空間</div>
  <div style="color:#555;font-size:12px;letter-spacing:.2em;margin-bottom:32px">ARTRIUM</div>
  <div style="width:40px;height:40px;border:3px solid #333;border-top-color:#C8A96E;border-radius:50%;animation:spin .8s linear infinite"></div>
  <div id="boot-msg" style="color:#555;font-size:12px;margin-top:20px">載入中...</div>
  <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
</div>
<script>
(function(){
  var t = setTimeout(function(){
    var msg = document.getElementById('boot-msg');
    if(msg) msg.innerHTML = '載入時間較長，請稍候...<br><span style="font-size:11px;color:#444">若超過30秒仍無反應，請改用 Chrome 或 Firefox 開啟</span>';
  }, 8000);
  window._bootDone = function(){
    clearTimeout(t);
    var el = document.getElementById('app-boot');
    if(el){ el.style.opacity='0'; el.style.transition='opacity .4s'; setTimeout(function(){el.remove();},400); }
  };
})();
</script>

<div id="root"></div>
<script type="text/babel" data-presets="react,env">
// Global error display
window.addEventListener('error', function(e) {
  document.getElementById('root').innerHTML =
    '<div style="padding:32px;font-family:monospace;color:#DC2626;background:#FEF2F2;min-height:100vh">' +
    '<h2 style="margin-bottom:16px">❌ 執行錯誤</h2>' +
    '<div style="background:#fff;border:1px solid #FCA5A5;border-radius:8px;padding:16px;white-space:pre-wrap;font-size:13px">' +
    (e.message || 'Unknown error') + '\n\nFile: ' + (e.filename || '') +
    '\nLine: ' + (e.lineno || '') + ', Col: ' + (e.colno || '') +
    '\n\n' + (e.error?.stack || '') + '</div>' +
    '<p style="margin-top:16px;font-size:12px;color:#666">請截圖此訊息回報。</p></div>';
});

class ErrorBoundary extends React.Component {
  constructor(p) { super(p); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err }; }
  render() {
    if (this.state.err) return (
      <div style={{padding:32,fontFamily:'monospace',color:'#8B2E2E',background:'#FEF2F2',minHeight:'100vh'}}>
        <h2 style={{marginBottom:16}}>❌ React 渲染錯誤</h2>
        <div style={{background:'#fff',border:'1px solid #FCA5A5',borderRadius:8,padding:16,whiteSpace:'pre-wrap',fontSize:13}}>
          {String(this.state.err)}{'\n\n'}{this.state.err?.stack}
        </div>
        <p style={{marginTop:16,fontSize:12,color:'#666'}}>請截圖此訊息回報。</p>
      </div>
    );
    return this.props.children;
  }
}

const { useState, useEffect, useCallback, useRef } = React;

// ─────────────────────────────────────────
// SETUP
// ─────────────────────────────────────────
const DEFAULT_SB_URL = '';
const DEFAULT_SB_KEY = '';
const SUPABASE_URL = localStorage.getItem('sb_url') || DEFAULT_SB_URL;
const SUPABASE_KEY = localStorage.getItem('sb_key') || DEFAULT_SB_KEY;
// Mock db - login handled locally via ARTRIUM_ACCOUNTS
const db = SUPABASE_URL && SUPABASE_KEY ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : {
  from: () => ({ select: () => ({ eq: () => ({ eq: () => ({ single: async () => ({ data: null, error: 'no-db' }) }), single: async () => ({ data: null }) }), single: async () => ({ data: null }) }), insert: () => ({ select: () => ({ single: async () => ({ data: null }) }) }), update: () => ({ eq: () => ({}) }), delete: () => ({ eq: () => ({}) }), upsert: () => ({}) }),
  storage: { from: () => ({ upload: async () => ({}), getPublicUrl: () => ({ data: { publicUrl: '' } }) }) },
};

const fmt = n => '$' + Math.round(n || 0).toLocaleString();
const pct = (n, total) => total ? Math.round(n / total * 100) : 0;
const today = () => new Date().toISOString().split('T')[0];
const fmtDate = d => d ? d.replace(/-/g, '/') : '-';

// ─── Upload to Supabase Storage ───
async function uploadToStorage(file, folder = 'general') {
  const ext = file.name.split('.').pop();
  const filename = `${folder}/${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
  const { error } = await db.storage.from('uploads').upload(filename, file, { contentType: file.type, upsert: true });
  if (error) throw error;
  const { data } = db.storage.from('uploads').getPublicUrl(filename);
  return data.publicUrl;
}

// ─── ImageUpload component ───
// Debounce hook - fires callback after delay when value stops changing
function useDebounce(callback, delay) {
  const timer = React.useRef(null);
  return React.useCallback((...args) => {
    clearTimeout(timer.current);
    timer.current = setTimeout(() => callback(...args), delay);
  }, [callback, delay]);
}

// IME-safe inline edit with debounced auto-save
function InlineEdit({ value, onChange, style, type, placeholder, className }) {
  const [local, setLocal] = React.useState(value ?? '');
  const composing = React.useRef(false);
  const saveTimer = React.useRef(null);
  React.useEffect(() => { if (!composing.current) setLocal(value ?? ''); }, [value]);

  const scheduleSave = (val) => {
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => onChange(val), 800);
  };

  return (
    <input
      className={className || 'inline-edit'}
      type={type || 'text'}
      style={style}
      value={local}
      placeholder={placeholder}
      onChange={e => {
        setLocal(e.target.value);
        if (!composing.current) scheduleSave(e.target.value);
      }}
      onCompositionStart={() => { composing.current = true; }}
      onCompositionEnd={e => {
        composing.current = false;
        setLocal(e.target.value);
        scheduleSave(e.target.value);
      }}
      onBlur={e => {
        clearTimeout(saveTimer.current);
        if (!composing.current) onChange(e.target.value);
      }}
      onKeyDown={e => { if (e.key === 'Enter' && !composing.current) e.target.blur(); }}
    />
  );
}

// IME-safe input for form fields
function IMEInput({ value, onChange, className, style, type, placeholder, disabled, ...rest }) {
  const [local, setLocal] = React.useState(value ?? '');
  const composing = React.useRef(false);
  React.useEffect(() => { if (!composing.current) setLocal(value ?? ''); }, [value]);
  return (
    <input className={className || 'form-input'} type={type || 'text'} style={style}
      placeholder={placeholder} disabled={disabled} value={local}
      onChange={e => setLocal(e.target.value)}
      onCompositionStart={() => { composing.current = true; }}
      onCompositionEnd={e => { composing.current = false; setLocal(e.target.value); onChange(e.target.value); }}
      onBlur={e => { if (!composing.current) onChange(e.target.value); }}
      {...rest}
    />
  );
}

// IME-safe textarea for form fields
function IMETextarea({ value, onChange, className, style, placeholder, rows }) {
  const [local, setLocal] = React.useState(value ?? '');
  const composing = React.useRef(false);
  React.useEffect(() => { if (!composing.current) setLocal(value ?? ''); }, [value]);
  return (
    <textarea className={className || 'form-textarea'} style={style}
      placeholder={placeholder} rows={rows} value={local}
      onChange={e => setLocal(e.target.value)}
      onCompositionStart={() => { composing.current = true; }}
      onCompositionEnd={e => { composing.current = false; setLocal(e.target.value); onChange(e.target.value); }}
      onBlur={e => { if (!composing.current) onChange(e.target.value); }}
    />
  );
}

function ImageUpload({ onUploaded, label = '選擇圖片', accept = 'image/*', folder = 'general' }) {
  const [uploading, setUploading] = useState(false);
  const inputRef = useRef(null);

  const handleFile = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setUploading(true);
    try {
      const url = await uploadToStorage(file, folder);
      onUploaded(url);
      toast('圖片上傳成功');
    } catch (err) {
      toast('上傳失敗：' + err.message, 'error');
    }
    setUploading(false);
    e.target.value = '';
  };

  return (
    <>
      <input ref={inputRef} type="file" accept={accept} style={{ display: 'none' }} onChange={handleFile} />
      <button className="btn btn-ghost btn-sm" onClick={() => inputRef.current?.click()} disabled={uploading}
        style={{ display: 'inline-flex', alignItems: 'center', gap: 5 }}>
        {uploading ? <><div style={{ width: 12, height: 12, border: '2px solid #CCC', borderTopColor: '#2E4D5C', borderRadius: '50%', animation: 'spin 0.8s linear infinite' }} />上傳中...</> : <>{label}</>}
      </button>
    </>
  );
}

// ─────────────────────────────────────────
// TOAST
// ─────────────────────────────────────────
let toastFn = null;
function ToastContainer() {
  const [toasts, setToasts] = useState([]);
  toastFn = (msg, type = 'success') => {
    const id = Date.now();
    setToasts(t => [...t, { id, msg, type }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3000);
  };
  return (
    <div className="toast-container">
      {toasts.map(t => (
        <div key={t.id} className={`toast toast-${t.type}`}>
          {t.type === 'success' ? '✓' : '✗'} {t.msg}
        </div>
      ))}
    </div>
  );
}
const toast = (msg, type) => toastFn && toastFn(msg, type);

// ─────────────────────────────────────────
// MODAL
// ─────────────────────────────────────────
function Modal({ open, title, onClose, children, footer, size = 'md' }) {
  if (!open) return null;
  const maxW = size === 'lg' ? '800px' : size === 'xl' ? '1000px' : '560px';
  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal" style={{ maxWidth: maxW }}>
        <div className="modal-header">
          <div className="modal-title">{title}</div>
          <button className="btn-icon" onClick={onClose}>✕</button>
        </div>
        <div className="modal-body">{children}</div>
        {footer && <div className="modal-footer">{footer}</div>}
      </div>
    </div>
  );
}

      .reduce((s, st) => s + Math.max(0, (st.amount||0) - (st.paid_amount||0)), 0);
    const currentAmt = currentStage ? (currentStage.amount || 0) : 0;
    const totalDue = currentAmt + prevUnpaid;

      if (!s.amount) return '未設定';

      if ((s.paid_amount||0) > 0) return '部分付款';
      return '未付款';
    };
    const stageStatusColor = function(s) {
      const l = stageStatusLabel(s);
      if (l === '已結清') return '#3A5240';
      if (l === '部分付款') return '#6B4835';
      return '#888';
    };

    const stageRows = ps.map(function(s) { return '<tr style="border-bottom:1px solid #EBEBEA">' +
      '<td style="padding:6px 10px;font-weight:' + (s.is_current?'700':'400') + '">' +
        (s.is_current ? '<span style="color:#8B2E2E">[本期]</span> ' : '') + esc(s.name) + '</td>' +
      '<td style="padding:6px 10px;text-align:right">' + fmtN(s.amount||0) + '</td>' +

function PrintModal({ open, onClose, project }) {
  const [sections, setSections] = useState({ summary: true, work: true, purchase: true, schedule: false, gallery: true, payment: false });
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(false);

  useEffect(() => {
    if (!open || !project) return;
    setData(null);
    setLoading(true);
    Promise.all([
      db.from('work_categories').select('*').eq('project_id', project.id).order('sort_order'),
      db.from('work_items').select('*').eq('project_id', project.id).order('sort_order'),
      db.from('purchase_categories').select('*').eq('project_id', project.id).order('sort_order'),
      db.from('purchase_items').select('*').eq('project_id', project.id).order('sort_order'),
      db.from('gallery').select('*').eq('project_id', project.id).eq('is_selected', true),
      db.from('bank_accounts').select('*').order('sort_order'),
      db.from('settings').select('*'),
      db.from('schedule_items').select('*').eq('project_id', project.id).order('sort_order'),
      db.from('schedule_events').select('*').eq('project_id', project.id).order('start_date'),
      db.from('payment_stages').select('*').eq('project_id', project.id).order('sort_order'),
    ]).then(([c,i,pc,pi,g,b,s,sched,sevents,pay]) => {
      const sObj = {}; (s.data||[]).forEach(x => sObj[x.key]=x.value);
      setData({ cats:c.data||[], items:i.data||[], pCats:pc.data||[], pItems:pi.data||[], gallery:g.data||[], banks:b.data||[], settings:sObj, scheduleItems:sched.data||[], scheduleEvents:sevents.data||[], paymentStages:pay.data||[] });
      setLoading(false);
    });
  }, [open, project?.id]);

  const toggle = k => setSections(p => ({ ...p, [k]: !p[k] }));

  const doPrint = () => {
    if (!data) return;
    openPrintWindow(project, data, sections);
    onClose();
  };

  if (!open) return null;
  return (
    <div className="modal-overlay" onClick={e => e.target===e.currentTarget && onClose()}>
      <div className="modal" style={{ maxWidth:420 }}>
        <div className="modal-header">
          <div className="modal-title">列印選項</div>
          <button className="btn-icon" onClick={onClose}>✕</button>
        </div>
        <div className="modal-body">
          {loading
            ? <div className="loading-center"><div className="spinner"/><div>載入資料中...</div></div>
            : <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
                {[
                  { key:'summary', label:' 專案總表', desc:'費用總表、注意事項、匯款資訊、業主簽名欄' },
                  { key:'work', label:' 工程明細', desc:'各大項工程細項清單' },
                  { key:'purchase', label:' 採購明細', desc:'採購品項清單' },
                  { key:'schedule', label:' 進度排程', desc:'甘特圖與工種退場進場排程' },
                  { key:'gallery', label:' 附件（已勾選圖庫）', desc:'圖庫中已勾「本案選用」的圖片' },
                  { key:'payment', label:' 請款單', desc:'各期付款明細、本期應收、匯款資訊' },
                ].map(s => (
                  <label key={s.key} style={{ display:'flex', gap:12, cursor:'pointer', padding:'12px 14px', background:sections[s.key]?'#EDF0EC':'#F8F8F6', borderRadius:8, border:(sections[s.key]?'1px solid #C8D0C0':'1px solid #E8E8E6'), alignItems:'center' }}>
                    <input type="checkbox" checked={sections[s.key]} onChange={()=>toggle(s.key)} style={{ width:16, height:16, accentColor:'#2E4D5C', flexShrink:0 }} />
                    <div>
                      <div style={{ fontWeight:600, fontSize:13 }}>{s.label}</div>
                      <div style={{ fontSize:11, color:'#888', marginTop:2 }}>{s.desc}</div>
                    </div>
                  </label>
                ))}
              </div>
          }
        </div>
        <div className="modal-footer">
          <button className="btn btn-ghost" onClick={onClose}>取消</button>
          <button className="btn btn-primary" onClick={doPrint} disabled={loading || !Object.values(sections).some(Boolean)}>
            列印 / 存 PDF
          </button>
        </div>
      </div>
    </div>
  );
}

function LoginPage({ onLogin }) {
  const [un, setUn] = useState('');
  const [pw, setPw] = useState('');
  const [err, setErr] = useState('');
  const [loading, setLoading] = useState(false);

  const ARTRIUM_ACCOUNTS = [
    { id:1, username:'HC',   password:'SQ1234', display_name:'HC',   role:'admin' },
    { id:2, username:'User', password:'SQ888',  display_name:'User', role:'staff' },
  ];
  const handleLogin = async () => {
    if (!un || !pw) return setErr('請輸入帳號與密碼');
    setLoading(true); setErr('');
    await new Promise(r => setTimeout(r, 300)); // small delay for UX
    const data = ARTRIUM_ACCOUNTS.find(a => a.username === un && a.password === pw);
    setLoading(false);
    if (!data) return setErr('帳號或密碼錯誤');
    localStorage.setItem('user', JSON.stringify(data));
    onLogin(data);

  return (
    <div className="login-page">
      <div className="login-card">
        <div className="login-logo">
          <LoginLogo />

          <input className="form-input" placeholder="帳號" value={un} onChange={e => setUn(e.target.value)}
            onKeyDown={e => e.key === 'Enter' && handleLogin()} />
          <input className="form-input" type="password" placeholder="密碼" value={pw} onChange={e => setPw(e.target.value)}
            onKeyDown={e => e.key === 'Enter' && handleLogin()} />
          {err && <div style={{ color: '#8B2E2E', fontSize: 12 }}>{err}</div>}
          <button className="btn btn-primary" style={{ width: '100%', justifyContent: 'center', padding: '10px' }}
            onClick={handleLogin} disabled={loading}>
            {loading ? '登入中...' : '登 入'}

        </div>
      </div>
    </div>
  );
}

function ProjectListPage({ user, onSelectProject }) {
  const [projects, setProjects] = useState([]);
  const [todos, setTodos] = useState([]);
  const [loading, setLoading] = useState(true);
  const [showNew, setShowNew] = useState(false);
  const [newName, setNewName] = useState('');
  const [newClient, setNewClient] = useState('');
  const [labelEdits, setLabelEdits] = useState({});

  const load = useCallback(async () => {
    setLoading(true);
    const { data: p } = await db.from('projects').select('*').order('created_at', { ascending: false });
    const { data: t } = await db.from('todos').select('*, projects(name)').eq('is_done', false);
    let visible = p || [];
    if (user.role !== 'admin') {
      // Non-admin: own projects + projects with granted access
      const { data: memberships } = await db.from('project_members').select('project_id').eq('user_id', user.id);
      const grantedIds = new Set((memberships || []).map(m => m.project_id));
      visible = visible.filter(proj => proj.created_by === user.username || grantedIds.has(proj.id));
    }
    setProjects(visible);
    setTodos(t || []);
    setLoading(false);
  }, [user]);

  useEffect(() => { load(); }, [load]);

  const createProject = async () => {
    if (!newName.trim()) return;
    const { data: settingsData } = await db.from('settings').select('*');
    const sObj = {}; (settingsData||[]).forEach(s => sObj[s.key] = s.value);
    const workCatsRaw = sObj['default_work_cats'] || '前置、拆除、清潔工程\n水電、弱電工程\n冷氣工程\n木作工程\n油漆工程\n泥作工程\n清潔';
    const purchaseCatsRaw = sObj['default_purchase_cats'] || '電器、家電\n廚房設備\n衛浴設備\n家具採購\n其他';
    const workCats = workCatsRaw.split('\n').map(s=>s.trim()).filter(Boolean);
    const purchaseCats = purchaseCatsRaw.split('\n').map(s=>s.trim()).filter(Boolean);
    const { data } = await db.from('projects').insert({
      name: newName, client_name: newClient,
      notes: sObj['default_notes'] || '', created_by: user.username
    }).select().single();
    if (data) {
      await db.from('work_categories').insert(workCats.map((name, i) => ({ project_id: data.id, name, sort_order: i })));
      if (purchaseCats.length) await db.from('purchase_categories').insert(purchaseCats.map((name, i) => ({ project_id: data.id, name, sort_order: i })));
      toast('專案已建立');
      setShowNew(false); setNewName(''); setNewClient('');
      load();
    }
  };

  const updateStatus = async (id, status) => {
    await db.from('projects').update({ status }).eq('id', id);
    setProjects(prev => prev.map(p => p.id === id ? { ...p, status } : p));
  };

  const saveLabel = async (id, label) => {
    await db.from('projects').update({ label }).eq('id', id);
    setProjects(prev => prev.map(p => p.id === id ? { ...p, label } : p));
    toast('已儲存');
  };

  const deleteProject = async (id) => {
    if (!confirm('確認刪除此專案？此操作無法復原。')) return;
    await db.from('projects').delete().eq('id', id);
    load(); toast('已刪除');
  };

  const copyProject = async (proj) => {
    const newName = prompt('新專案名稱：', proj.name + '（複製）');
    if (!newName) return;
    toast('複製中...');
    try {
      // Copy project
      const { id: oldId, created_at, updated_at, ...projData } = proj;
      const { data: newProj } = await db.from('projects').insert({ ...projData, name: newName, status: 'active', is_locked: false }).select().single();
      if (!newProj) throw new Error('建立專案失敗');
      // Copy work categories & items
      const { data: cats } = await db.from('work_categories').select('*').eq('project_id', oldId).order('sort_order');
      const { data: items } = await db.from('work_items').select('*').eq('project_id', oldId);
      if (cats && cats.length) {
        for (const cat of cats) {
          const { id: oldCatId, project_id, ...catData } = cat;
          const { data: newCat } = await db.from('work_categories').insert({ ...catData, project_id: newProj.id }).select().single();
          if (newCat && items) {
            const catItems = items.filter(i => i.category_id === oldCatId);
            if (catItems.length) {
              await db.from('work_items').insert(catItems.map(({ id, project_id, category_id, ...d }) => ({ ...d, project_id: newProj.id, category_id: newCat.id })));
            }
          }
        }
      }
      // Copy purchase categories & items
      const { data: pCats } = await db.from('purchase_categories').select('*').eq('project_id', oldId).order('sort_order');
      const { data: pItems } = await db.from('purchase_items').select('*').eq('project_id', oldId);
      if (pCats && pCats.length) {
        for (const pCat of pCats) {
          const { id: oldPCatId, project_id, ...pCatData } = pCat;
          const { data: newPCat } = await db.from('purchase_categories').insert({ ...pCatData, project_id: newProj.id }).select().single();
          if (newPCat && pItems) {
            const pCatItems = pItems.filter(i => i.category_id === oldPCatId);
            if (pCatItems.length) {
              await db.from('purchase_items').insert(pCatItems.map(({ id, project_id, category_id, ...d }) => ({ ...d, project_id: newProj.id, category_id: newPCat.id })));
            }
          }
        }
      }
      load(); toast('複製完成：' + newName);
    } catch(e) { toast('複製失敗：' + e.message, 'error'); }
  };

  const exportProject = async (proj) => {
    toast('匯出中...');
    try {
      const [{ data: cats }, { data: items }, { data: pCats }, { data: pItems }] = await Promise.all([
        db.from('work_categories').select('*').eq('project_id', proj.id).order('sort_order'),
        db.from('work_items').select('*').eq('project_id', proj.id),
        db.from('purchase_categories').select('*').eq('project_id', proj.id).order('sort_order'),
        db.from('purchase_items').select('*').eq('project_id', proj.id),
      ]);
      const wb = XLSX.utils.book_new();
      // Sheet 1: 專案基本資料
      const infoRows = [
        ['專案名稱', proj.name],
        ['業主名稱', proj.client_name || ''],
        ['狀態', proj.status || 'active'],
        ['備註', proj.notes || ''],
      ];
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(infoRows), '專案資料');
      // Sheet 2: 工程明細
      const workRows = [['大項', '細項名稱', '單位', '數量', '報價單價', '成本單價', '備註']];
      (cats || []).forEach(cat => {
        (items || []).filter(i => i.category_id === cat.id).forEach(item => {
          workRows.push([cat.name, item.name, item.unit || '', item.quantity || 0, item.unit_price || 0, item.cost_price || 0, item.notes || '']);
        });
      });
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(workRows), '工程明細');
      // Sheet 3: 採購明細
      const purchaseRows = [['大項', '品名', '規格', '數量', '單位', '單價', '備註']];
      (pCats || []).forEach(cat => {
        (pItems || []).filter(i => i.category_id === cat.id).forEach(item => {
          purchaseRows.push([cat.name, item.name, item.spec || '', item.quantity || 0, item.unit || '', item.unit_price || 0, item.notes || '']);
        });
      });
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(purchaseRows), '採購明細');
      XLSX.writeFile(wb, proj.name + '_匯出.xlsx');
      toast('匯出完成');
    } catch(e) { toast('匯出失敗：' + e.message, 'error'); }
  };

  const [showImport, setShowImport] = useState(false);
  const [importPreview, setImportPreview] = useState(null);
  const [importing, setImporting] = useState(false);
  const [importStatus, setImportStatus] = useState('active');
  const [importDragOver, setImportDragOver] = useState(false);

  const handleImportFile = async (file) => {
    try {
      const data = await file.arrayBuffer();
      const wb = XLSX.read(data, { type: 'array' });
      const info = XLSX.utils.sheet_to_json(wb.Sheets['專案資料'] || wb.Sheets[wb.SheetNames[0]], { header: 1 });
      const infoObj = {};
      (info || []).forEach(row => { if (row[0]) infoObj[row[0]] = row[1] || ''; });

      const workSheet = wb.Sheets['工程明細'] || wb.Sheets[wb.SheetNames[1]];
      const workRows = workSheet ? XLSX.utils.sheet_to_json(workSheet, { header: 1, defval: '' }).slice(1) : [];

      const purchaseSheet = wb.Sheets['採購明細'] || wb.Sheets[wb.SheetNames[2]];
      const purchaseRows = purchaseSheet ? XLSX.utils.sheet_to_json(purchaseSheet, { header: 1, defval: '' }).slice(1) : [];

      setImportPreview({
        name: infoObj['專案名稱'] || file.name.replace('.xlsx','').replace('_匯出',''),
        client_name: infoObj['業主名稱'] || '',
        notes: infoObj['備註'] || '',
        workRows, purchaseRows,
        workCatCount: [...new Set(workRows.map(r => r[0]).filter(Boolean))].length,
        workItemCount: workRows.filter(r => r[1]).length,
        purchaseCatCount: [...new Set(purchaseRows.map(r => r[0]).filter(Boolean))].length,
        purchaseItemCount: purchaseRows.filter(r => r[1]).length,
      });
    } catch(e) { toast('檔案解析失敗：' + e.message, 'error'); }
  };

  const doImport = async () => {
    if (!importPreview) return;
    setImporting(true);
    try {
      const { data: newProj } = await db.from('projects').insert({
        name: importPreview.name, client_name: importPreview.client_name,
        notes: importPreview.notes, status: importStatus, is_locked: false, created_by: user.username,
      }).select().single();

      // Import work items
      const catMap = {};
      for (const row of importPreview.workRows) {
        const [catName, itemName, unit, qty, unitPrice, costPrice, notes] = row;
        if (!catName) continue;
        if (!catMap[catName]) {
          const { data: cat } = await db.from('work_categories').insert({ project_id: newProj.id, name: catName, sort_order: Object.keys(catMap).length }).select().single();
          catMap[catName] = cat.id;
        }
        if (itemName) {
          await db.from('work_items').insert({ project_id: newProj.id, category_id: catMap[catName], name: itemName, unit: unit||'', quantity: +qty||1, unit_price: +unitPrice||0, cost_price: +costPrice||0, notes: notes||'', sort_order: 0 });
        }
      }

      // Import purchase items
      const pCatMap = {};
      for (const row of importPreview.purchaseRows) {
        const [catName, itemName, spec, qty, unit, unitPrice, notes] = row;
        if (!catName) continue;
        if (!pCatMap[catName]) {
          const { data: cat, error: catErr } = await db.from('purchase_categories').insert({ project_id: newProj.id, name: catName, sort_order: Object.keys(pCatMap).length }).select().single();
          if (catErr) throw new Error('採購大項建立失敗：' + catErr.message);
          pCatMap[catName] = cat.id;
        }
        if (itemName) {
          const { error: itemErr } = await db.from('purchase_items').insert({ project_id: newProj.id, category_id: pCatMap[catName], name: String(itemName), spec: spec ? String(spec) : '', quantity: parseFloat(qty) || 1, unit: unit ? String(unit) : '', unit_price: parseFloat(unitPrice) || 0, notes: notes ? String(notes) : '', sort_order: 0 });
          if (itemErr) throw new Error('採購細項建立失敗：' + itemErr.message);
        }
      }

      toast('匯入完成：' + importPreview.name);
      setShowImport(false); setImportPreview(null);
      load();
    } catch(e) { toast('匯入失敗：' + e.message, 'error'); }
    setImporting(false);
  };

  const statusGroups = [
    { key: 'active', label: '進行中專案', color: '#363636' },
    { key: 'change', label: '客變專案',   color: '#555' },
    { key: 'closed', label: '結案專案',   color: '#888' },
  ];
  const statusOptions = [
    { value: 'active', label: '進行中' },
    { value: 'change', label: '客變' },
    { value: 'closed', label: '結案' },
  ];
  const statusColor = { active: '#333', change: '#666', closed: '#888' };
  const fmtTs = ts => ts ? ts.replace('T', ' ').slice(0, 16).replace(/-/g, '/') : '-';

  if (loading) return React.createElement('div', {className:'loading-center'}, React.createElement('div', {className:'spinner'}), React.createElement('div', null, '載入中...'));

  return (
    <div>
      <div className="flex items-center justify-between mb-5">
        <div>
          <span style={{ fontWeight: 700, fontSize: 15 }}>雲端專案庫</span>
          <span style={{ fontSize: 12, color: '#888', marginLeft: 8 }}>（{user.role === 'admin' ? '管理員：可見所有專案' : user.username + ' 的專案'}）</span>
        </div>
        <div className="flex gap-2">
          <button className="btn btn-ghost btn-sm" onClick={load}>重新讀取列表</button>
          <button className="btn btn-ghost btn-sm" onClick={() => { setShowImport(true); setImportPreview(null); }}>匯入專案</button>
          <button className="btn btn-primary btn-sm" onClick={() => setShowNew(true)}>建立新專案</button>
        </div>
      </div>

      {statusGroups.map(function(sg) {
        var list = projects.filter(function(p) { return (p.status || 'active') === sg.key; });
        if (!list.length) return null;
        return (
          <div key={sg.key} style={{ marginBottom: 28 }}>
            <div style={{ display:'flex', alignItems:'center', gap:6, marginBottom:8 }}>
              <span style={{ width:10, height:10, borderRadius:'50%', background:sg.color, display:'inline-block' }} />
              <span style={{ fontWeight:600, fontSize:14 }}>{sg.label}</span>
              <span style={{ fontSize:12, color:'#888' }}>（共 {list.length} 筆）</span>
            </div>
            <table style={{ width:'100%', borderCollapse:'collapse', fontSize:13, background:'#fff', borderRadius:8, overflow:'hidden', boxShadow:'0 2px 8px rgba(0,0,0,0.18)' }}>
              <thead>
                <tr style={{ background:'#C8C8C8', borderBottom:'1px solid #B8B8B8' }}>
                  <th style={{ padding:'8px 14px', textAlign:'left', fontWeight:700, color:'#222' }}>專案名稱</th>
                  <th style={{ padding:'8px 10px', textAlign:'left', fontWeight:600, color:'#444', width:100 }}>客戶名稱</th>
                  <th style={{ padding:'8px 10px', textAlign:'left', fontWeight:600, color:'#444', width:130 }}>專案狀態</th>
                  <th style={{ padding:'8px 10px', textAlign:'left', fontWeight:600, color:'#444', width:95 }}>建檔日期</th>
                  <th style={{ padding:'8px 10px', textAlign:'left', fontWeight:600, color:'#2E4D5C', width:140 }}>最後修改</th>
                  <th style={{ padding:'8px 10px', textAlign:'center', fontWeight:600, color:'#444', width:160 }}>操作</th>
                </tr>
              </thead>
              <tbody>
                {list.map(function(proj, pi) {
                  return (
                    <tr key={proj.id} style={{ borderBottom: pi < list.length-1 ? '1px solid #F0F0EE' : 'none' }}>
                      <td style={{ padding:'9px 14px', fontWeight:500 }}>{proj.name}</td>
                      <td style={{ padding:'9px 10px', color:'#666' }}>{proj.client_name || ''}</td>
                      <td style={{ padding:'9px 10px' }}>
                        <select value={proj.status || 'active'} onChange={function(e){ updateStatus(proj.id, e.target.value); }}
                          style={{ border:'1px solid #DDD', borderRadius:4, padding:'3px 6px', fontSize:12, color:statusColor[proj.status||'active'], fontWeight:500, background:'#fff', cursor:'pointer' }}>
                          {statusOptions.map(function(o){ return <option key={o.value} value={o.value}>{o.label}</option>; })}
                        </select>
                      </td>
                      <td style={{ padding:'9px 10px', color:'#888', fontSize:12 }}>{(proj.created_at||'').slice(0,10).replace(/-/g,'/')}</td>
                      <td style={{ padding:'9px 10px', color:'#2E4D5C', fontSize:12 }}>{fmtTs(proj.updated_at)}</td>
                      <td style={{ padding:'9px 10px', textAlign:'center', whiteSpace:'nowrap' }}>
                        <div style={{ display:'flex', gap:5, justifyContent:'center' }}>
                          <button style={{ background:'#EDF0EC', color:'#2E4D5C', border:'1px solid #C8D0C0', borderRadius:4, padding:'4px 10px', fontSize:12, cursor:'pointer', whiteSpace:'nowrap' }}
                            onClick={function(){ onSelectProject(proj); }}>載入</button>
                          <button style={{ background:'#F0F0F0', color:'#555', border:'1px solid #D0D0D0', borderRadius:4, padding:'4px 10px', fontSize:12, cursor:'pointer', whiteSpace:'nowrap' }}
                            onClick={function(){ copyProject(proj); }}>複製</button>
                          <button style={{ background:'#F5F3F0', color:'#6B4835', border:'1px solid #D8CCC0', borderRadius:4, padding:'4px 10px', fontSize:12, cursor:'pointer', whiteSpace:'nowrap' }}
                            onClick={function(){ exportProject(proj); }}>匯出</button>
                          <button style={{ background:'#FEF2F2', color:'#8B2E2E', border:'1px solid #FECACA', borderRadius:4, padding:'4px 10px', fontSize:12, cursor:'pointer', whiteSpace:'nowrap' }}
                            onClick={function(){ deleteProject(proj.id); }}>刪除</button>
                        </div>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        );
      })}

      {todos.length > 0 && (
        <div style={{ marginTop:24 }}>
          <div style={{ fontWeight:700, fontSize:14, marginBottom:14 }}>□ 所有專案：未完成待辦事項總表</div>
          <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:16 }}>
            {[
              { type:'general', label:'一般專案待辦（跨案）', border:'#D8D8D8', bg:'#fff' },
              { type:'site',    label:'現場待辦事項（跨案）', border:'#D8D8D8', bg:'#fff' },
              { type:'purchase',label:'待採購清單（跨案）',   border:'#D8D8D8', bg:'#fff' },
            ].map(function(col) {
              var items = todos.filter(function(t){ return t.todo_type === col.type; });
              return (
                <div key={col.type} style={{ background:col.bg, border:'1px solid '+col.border, borderRadius:10, padding:'14px 16px', minHeight:80 }}>
                  <div style={{ fontWeight:700, fontSize:13, marginBottom:10, color:'#333' }}>{col.label}</div>
                  {items.map(function(t){ return (
                    <div key={t.id} style={{ background:'#fff', border:'1px solid '+col.border, borderRadius:6, padding:'8px 12px', marginBottom:8, fontSize:12 }}>
                      <div style={{ color:'#888', fontSize:11, marginBottom:2 }}>{t.projects && t.projects.name}</div>
                      <div style={{ color:'#222' }}>{t.content}</div>
                    </div>
                  ); })}
                  {items.length === 0 && <div style={{ color:'#CCC', fontSize:12 }}>無待辦事項</div>}
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* Import project modal */}
      <Modal open={showImport} title="匯入專案" onClose={() => { setShowImport(false); setImportPreview(null); setImportDragOver(false); }}
        footer={<>
          <button className="btn btn-ghost" onClick={() => { setShowImport(false); setImportPreview(null); }}>取消</button>
          <button className="btn btn-primary" onClick={doImport} disabled={!importPreview || importing}>{importing ? '匯入中...' : '確認匯入'}</button>
        </>}>
        <div style={{ fontSize:12, color:'#666', marginBottom:12 }}>上傳由本系統匯出的 Excel 檔，會自動建立新專案並帶入工程明細與採購明細。</div>

        {/* Drag-drop zone */}
        <div
          style={{ display:'flex', alignItems:'center', justifyContent:'center', flexDirection:'column', gap:6, padding:'24px', border: importDragOver ? '2px solid #2E4D5C' : '1.5px dashed #CCC', borderRadius:8, background: importDragOver ? '#EDF2F7' : '#FAFAFA', marginBottom:12, cursor:'pointer', transition:'all 0.15s' }}
          onClick={() => document.getElementById('proj-import-file').click()}
          onDragOver={e => { e.preventDefault(); setImportDragOver(true); }}
          onDragLeave={() => setImportDragOver(false)}
          onDrop={async e => { e.preventDefault(); setImportDragOver(false); const f = e.dataTransfer.files[0]; if(f) await handleImportFile(f); }}>
          <span style={{ fontSize:24 }}>📂</span>
          <span style={{ fontSize:13, color: importDragOver ? '#2E4D5C' : '#666', fontWeight: importDragOver ? 600 : 400 }}>
            {importDragOver ? '放開以上傳' : '點擊選擇或拖曳 Excel 檔'}
          </span>
          <input id="proj-import-file" type="file" accept=".xlsx,.xls" style={{ display:'none' }} onChange={async e => { if(e.target.files[0]) await handleImportFile(e.target.files[0]); e.target.value=''; }} />
        </div>

        {/* Status selection */}
        <div className="form-group" style={{ marginBottom:12 }}>
          <label className="form-label">匯入為哪類專案？</label>
          <div style={{ display:'flex', gap:8 }}>
            {[{ val:'active', label:'進行中' }, { val:'change', label:'客變' }, { val:'closed', label:'結案' }].map(s => (
              <button key={s.val} type="button" onClick={() => setImportStatus(s.val)} style={{
                flex:1, padding:'7px', borderRadius:6, fontSize:13, cursor:'pointer',
                border: importStatus === s.val ? '2px solid #2E4D5C' : '1px solid #D8D8D8',
                background: importStatus === s.val ? '#EDF2F7' : '#F8F8F8',
                color: importStatus === s.val ? '#2E4D5C' : '#555',
                fontWeight: importStatus === s.val ? 700 : 400,
              }}>{s.label}</button>
            ))}
          </div>
        </div>

        {importPreview && (
          <div style={{ background:'#F5F8F5', borderRadius:8, padding:'14px 16px', border:'1px solid #D0E0D0' }}>
            <div style={{ fontWeight:600, fontSize:14, marginBottom:8, color:'#3A5240' }}>✓ 解析成功</div>
            {[
              { label:'專案名稱', val: importPreview.name },
              { label:'業主', val: importPreview.client_name || '（未填）' },
              { label:'工程大項', val: importPreview.workCatCount + ' 項' },
              { label:'工程細項', val: importPreview.workItemCount + ' 筆' },
              { label:'採購大項', val: importPreview.purchaseCatCount + ' 項' },
              { label:'採購細項', val: importPreview.purchaseItemCount + ' 筆' },
            ].map(r => (
              <div key={r.label} style={{ display:'flex', gap:12, fontSize:13, marginBottom:4 }}>
                <span style={{ color:'#888', width:70, flexShrink:0 }}>{r.label}</span>
                <span style={{ color:'#222' }}>{r.val}</span>
              </div>
            ))}
          </div>
        )}
      </Modal>

      <Modal open={showNew} title="建立新專案" onClose={() => setShowNew(false)}
        footer={<><button className="btn btn-ghost" onClick={() => setShowNew(false)}>取消</button><button className="btn btn-primary" onClick={createProject}>建立</button></>}>
        <div className="form-group"><label className="form-label">專案名稱 *</label>
          <IMEInput className="form-input" value={newName} onChange={function(val){ setNewName(val); }} placeholder="例：台北信義區住宅案" /></div>
        <div className="form-group"><label className="form-label">客戶名稱</label>
          <IMEInput className="form-input" value={newClient} onChange={function(val){ setNewClient(val); }} /></div>
      </Modal>
    </div>
  );
}
