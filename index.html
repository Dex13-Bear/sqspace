<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>無澀空間 專案管理</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC',sans-serif;background:#F4F4F4;color:#2E2E2E;font-size:14px;line-height:1.6}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:#F0F0F0}
::-webkit-scrollbar-thumb{background:#C4C4C4;border-radius:3px}
input,textarea,select{font-family:'Noto Sans TC',sans-serif;font-size:13px}
button{cursor:pointer;font-family:'Noto Sans TC',sans-serif;font-size:13px}

/* Layout */
.app-layout{display:flex;height:100vh;overflow:hidden}
.sidebar{width:200px;min-width:200px;background:#fff;color:#1A1A1A;display:flex;flex-direction:column;overflow-y:auto}
.main-content{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:52px;background:#fff;border-bottom:1px solid #E0E0E0;display:flex;align-items:center;padding:0 24px;gap:12px;flex-shrink:0}
.page-body{flex:1;overflow-y:auto;padding:24px}

/* Sidebar */
.sidebar-logo{padding:16px;border-bottom:1px solid #E0E0E0;display:flex;align-items:center;justify-content:center}
.sidebar-logo img{max-width:100%;max-height:40px;object-fit:contain}
.sidebar-logo-text{font-size:15px;font-weight:600;letter-spacing:0.05em;color:#1A1A1A}
.sidebar-section{padding:8px 0}
.sidebar-section-title{font-size:10px;color:#999;padding:8px 16px 4px;text-transform:uppercase;letter-spacing:0.1em}
.sidebar-item{display:flex;align-items:center;gap:10px;padding:8px 16px;color:#888;cursor:pointer;transition:all .15s;font-size:13px;border-left:3px solid transparent}
.sidebar-item:hover{background:#333333;color:#E0E0E0}
.sidebar-item.active{background:#333333;color:#fff;border-left-color:#7A9A8A}
.sidebar-item svg{flex-shrink:0}
.sidebar-user{margin-top:auto;padding:12px 16px;border-top:1px solid #E0E0E0;display:flex;align-items:center;gap:8px}
.sidebar-user-name{font-size:12px;color:#888}

/* Topbar */
.topbar-title{font-size:16px;font-weight:600;flex:1}
.topbar-subtitle{font-size:12px;color:#888;flex:1}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:6px;border:none;font-weight:500;transition:all .15s;white-space:nowrap}
.btn-primary{background:#222;color:#fff}.btn-primary:hover{background:#333}
.btn-success{background:#444;color:#fff}.btn-success:hover{background:#333}
.btn-danger{background:#8B2E2E;color:#fff}.btn-danger:hover{background:#6B2020}
.btn-ghost{background:transparent;color:#555;border:1px solid #D8D8D8}.btn-ghost:hover{background:#F0F0F0}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-xs{padding:3px 8px;font-size:11px}
.btn-icon{padding:6px;background:transparent;border:none;color:#999}.btn-icon:hover{color:#222}

/* Forms */
.form-group{display:flex;flex-direction:column;gap:4px}
.form-label{font-size:12px;color:#555;font-weight:500}
.form-input{border:1px solid #D8D8D8;border-radius:6px;padding:7px 10px;background:#fff;width:100%;transition:border .15s;outline:none}
.form-input:focus{border-color:#2E4D5C}
.form-input-sm{padding:4px 8px;font-size:12px;border-radius:4px}
.form-select{border:1px solid #D8D8D8;border-radius:6px;padding:7px 10px;background:#fff;width:100%;outline:none;cursor:pointer}
.form-textarea{border:1px solid #D8D8D8;border-radius:6px;padding:8px 10px;background:#fff;width:100%;resize:vertical;outline:none;min-height:80px}
.form-textarea:focus,.form-select:focus{border-color:#2E4D5C}

/* Cards */
.card{background:#fff;border-radius:8px;border:1px solid #E0E0E0;overflow:hidden}
.card-header{padding:14px 20px;border-bottom:1px solid #EBEBEB;display:flex;align-items:center;gap:12px}
.card-title{font-size:15px;font-weight:600}
.card-body{padding:20px}

/* Tables */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{background:#F5F5F5;padding:8px 12px;text-align:left;font-size:12px;font-weight:700;color:#444;border-bottom:2px solid #D8D8D8;white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid #EBEBEB;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#FAFAFA}
td.num{text-align:right;font-variant-numeric:tabular-nums}
th.num{text-align:right}

/* Project status badges */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:500}
.badge-active{background:#E8E8E8;color:#2E2E2E}
.badge-change{background:#C8C8C8;color:#333}
.badge-closed{background:#F0F0F0;color:#888}

/* Tabs */
.tab-bar{display:flex;gap:0;border-bottom:2px solid #E0E0E0;overflow-x:auto;flex-shrink:0}
.tab-item{padding:10px 18px;cursor:pointer;font-size:13px;font-weight:500;color:#999;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:all .15s}
.tab-item:hover{color:#333}
.tab-item.active{color:#2E2E2E;border-bottom-color:#2E2E2E;font-weight:700}
.tab-content{flex:1;overflow-y:auto;padding:24px}

/* Project list */
.project-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.project-card{background:#fff;border-radius:8px;border:1px solid #E0E0E0;padding:18px;cursor:pointer;transition:all .15s}
.project-card:hover{border-color:#888;box-shadow:0 2px 12px rgba(0,0,0,.08);transform:translateY(-1px)}
.project-card-name{font-size:16px;font-weight:600;margin-bottom:4px}
.project-card-client{font-size:12px;color:#888;margin-bottom:10px}
.project-card-meta{display:flex;gap:8px;font-size:11px;color:#999}

/* Section headers */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.section-title{font-size:16px;font-weight:700}

/* Summary table */
.summary-row{display:grid;grid-template-columns:120px 1fr auto;gap:12px;padding:10px 16px;border-bottom:1px solid #EBEBEB;align-items:center}
.summary-total{background:#F5F5F5;font-weight:700;font-size:15px;border-radius:0 0 8px 8px}

/* Work item table */
.category-header{background:#EBEBEB;padding:11px 16px;font-weight:700;font-size:13.5px;display:flex;align-items:center;justify-content:space-between;border-radius:6px 6px 0 0;border:1px solid #D4D4D4;border-bottom:none;cursor:pointer}
.category-body{border:1px solid #D4D4D4;border-radius:0 0 6px 6px;margin-bottom:20px;overflow:hidden}
.category-subtotal{background:#F5F5F5;padding:8px 16px;text-align:right;font-size:12px;font-weight:700;color:#333;border-top:1px solid #E0E0E0}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:10px;width:100%;max-width:560px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
.modal-header{padding:18px 20px;border-bottom:1px solid #E0E0E0;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.modal-title{font-size:16px;font-weight:700}
.modal-body{padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.modal-footer{padding:14px 20px;border-top:1px solid #E0E0E0;display:flex;justify-content:flex-end;gap:8px;flex-shrink:0}

/* Grid helpers */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.flex{display:flex}.flex-1{flex:1}.items-center{align-items:center}.justify-between{justify-content:space-between}.gap-2{gap:8px}.gap-3{gap:12px}.gap-4{gap:16px}
.mb-2{margin-bottom:8px}.mb-3{margin-bottom:12px}.mb-4{margin-bottom:16px}.mb-6{margin-bottom:24px}
.mt-2{margin-top:8px}.mt-3{margin-top:12px}.mt-4{margin-top:16px}
.text-sm{font-size:12px}.text-xs{font-size:11px}.text-muted{color:#888}.text-danger{color:#8B2E2E}.text-success{color:#333}.text-primary{color:#333}
.font-bold{font-weight:700}.font-semibold{font-weight:600}
.text-right{text-align:right}.text-center{text-align:center}
.divider{border:none;border-top:1px solid #E0E0E0;margin:16px 0}
.tag{display:inline-flex;padding:2px 8px;background:#EBEBEB;color:#444;border-radius:4px;font-size:11px;font-weight:500}

/* Gantt */
.gantt-wrap{overflow-x:auto}
.gantt-table{border-collapse:collapse;min-width:100%}
.gantt-table th,.gantt-table td{padding:6px 8px;border:1px solid #E0E0E0;font-size:12px}
.gantt-table th{background:#F5F5F5;font-weight:600;white-space:nowrap;min-width:100px}
.gantt-bar{background:#333;border-radius:4px;height:22px;display:flex;align-items:center;padding:0 8px;color:#fff;font-size:11px;white-space:nowrap}
.gantt-holiday{background:#F0F0F0}

/* Login */
.login-page{min-height:100vh;background:#EBEBEB;display:flex;align-items:center;justify-content:center}
.login-card{background:#fff;border-radius:12px;padding:48px 40px;width:100%;max-width:380px;box-shadow:0 4px 32px rgba(0,0,0,.08)}
.login-logo{text-align:center;margin-bottom:32px}
.login-title{font-size:22px;font-weight:700;text-align:center;margin-bottom:6px}
.login-subtitle{font-size:13px;color:#888;text-align:center;margin-bottom:28px}

/* Toast */
.toast-container{position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{background:#fff;border:1px solid #E0E0E0;border-radius:8px;padding:12px 16px;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.1);display:flex;align-items:center;gap:8px;min-width:240px}
.toast-success{border-left:3px solid #555}
.toast-error{border-left:3px solid #8B2E2E}

/* Change orders */
.co-add{color:#3A5240;font-weight:600}
.co-reduce{color:#DC2626;font-weight:600}

/* Inline edit */
.inline-edit{border:none;background:transparent;width:100%;padding:2px 4px;border-radius:4px;font-size:13px}
.inline-edit:hover{background:#F0F0F0}
.inline-edit:focus{background:#fff;border:1px solid #888;outline:none}

/* Todo */
.todo-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid #F0F0F0}
.todo-check{width:18px;height:18px;cursor:pointer;accent-color:#333;flex-shrink:0;margin-top:2px}
.todo-done{text-decoration:line-through;color:#B0B0B0}

/* Site log */
.log-card{border:1px solid #E0E0E0;border-radius:8px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,0.18)}
.log-date-header{font-weight:600;font-size:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px}

/* Gallery */
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.gallery-card{border:1px solid #E0E0E0;border-radius:8px;overflow:hidden;background:#fff}
.gallery-img{width:100%;height:160px;object-fit:cover;background:#F0F0F0;display:flex;align-items:center;justify-content:center;color:#CCC;font-size:13px}
.gallery-info{padding:10px 12px}

/* Payment */
.payment-row{display:grid;grid-template-columns:auto 2fr 1fr 1fr 1fr 1fr 1fr auto;gap:0;align-items:center}
.payment-header{background:#F5F5F5;border-radius:6px 6px 0 0}
.payment-cell{padding:10px 12px;border-bottom:1px solid #EBEBEB;font-size:13px}

/* ── Print ── */
@media print{
  .no-print{display:none!important}
  body{background:#fff!important;margin:0;padding:0}
  #root > *{display:none!important}
  .print-doc-container{display:block!important;position:static!important;overflow:visible!important}
}

/* Global todos panel */
.global-todos{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:24px}
.global-todo-card{background:#fff;border-radius:8px;border:1px solid #E0E0E0;padding:16px}
.global-todo-card-title{font-size:13px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.global-todo-item{padding:6px 0;border-bottom:1px solid #F0F0F0;font-size:12px;color:#444}
.global-todo-source{font-size:10px;color:#999;margin-top:2px}

/* Spinner */
.spinner{width:32px;height:32px;border:3px solid #E0E0E0;border-top-color:#333;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-center{display:flex;align-items:center;justify-content:center;padding:60px;flex-direction:column;gap:12px;color:#888;font-size:13px}

/* Project detail layout */
.project-detail{display:flex;flex-direction:column;height:100%}
.project-topbar{padding:16px 24px;background:#fff;border-bottom:1px solid #E0E0E0;display:flex;align-items:center;gap:16px;flex-shrink:0}
.project-tabs-bar{background:#fff;border-bottom:2px solid #E0E0E0;padding:0 24px;display:flex;overflow-x:auto;flex-shrink:0}

/* Admin */
.admin-section{background:#fff;border-radius:8px;border:1px solid #E0E0E0;margin-bottom:20px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.18)}
.admin-section-header{padding:9px 14px;border-bottom:1px solid #B8B8B8;font-weight:700;font-size:13px;background:#C8C8C8}
.admin-section-body{padding:20px}
/* ── Mobile ── */
@media (max-width: 768px) {
  body { font-size: 13px; }

  /* Layout */
  .app-layout { flex-direction: column }
  .sidebar {
    position: fixed; top: 0; left: 0; bottom: 0; z-index: 500;
    transform: translateX(-100%); transition: transform .25s ease;
    width: 220px; min-width: 220px;
  }
  .sidebar.open { transform: translateX(0); box-shadow: 4px 0 24px rgba(0,0,0,.4) }
  .sidebar-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 499;
  }
  .sidebar-overlay.open { display: block }
  .main-content { width: 100%; height: 100vh }
  .topbar { padding: 0 12px; gap: 8px }
  .topbar-title { font-size: 14px }
  .page-body { padding: 12px }

  /* Hamburger button */
  .hamburger { display: flex !important }

  /* Project list */
  .project-grid { grid-template-columns: 1fr }
  .global-todos { grid-template-columns: 1fr }

  /* Tables - horizontal scroll */
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch }
  table { min-width: 500px }

  /* Project tabs */
  .project-tabs-bar { padding: 0 8px }
  .tab-item { padding: 10px 12px; font-size: 12px }
  .tab-content { padding: 12px }

  /* Modal full screen */
  .modal-overlay { padding: 0; align-items: flex-end }
  .modal { max-width: 100%; max-height: 85vh; border-radius: 16px 16px 0 0 }
  .modal-footer { position: sticky; bottom: 0; background: #fff; padding: 12px 20px; border-top: 1px solid #EEE; z-index: 2 }
  .modal-body { padding-bottom: env(safe-area-inset-bottom, 0) }

  /* Project topbar */
  .project-topbar { padding: 10px 12px; flex-wrap: wrap; gap: 8px }

  /* Gallery */
  .gallery-grid { grid-template-columns: repeat(2, 1fr); gap: 10px }

  /* Cards */
  .card-body { padding: 12px }

  /* Grid helpers */
  .grid-2, .grid-3 { grid-template-columns: 1fr }

  /* Buttons */
  .btn { padding: 6px 10px; font-size: 12px }

  /* Log cards */
  .log-card { padding: 12px }

  /* Section header */
  .section-header { flex-wrap: wrap; gap: 8px }
}
.hamburger { display: none; background: none; border: none; color: #fff; padding: 6px; cursor: pointer; flex-direction: column; gap: 4px; flex-shrink: 0 }
.hamburger span { display: block; width: 20px; height: 2px; background: #555; border-radius: 2px }
</style>
</head>

<div id="error-display" style="display:none;padding:20px;background:#fee;color:#c00;font-family:monospace;font-size:13px;white-space:pre-wrap;position:fixed;top:0;left:0;right:0;z-index:9999;max-height:60vh;overflow:auto;border-bottom:3px solid #c00"></div>
<script>
window.addEventListener('load', function() {
  setTimeout(function() {
    var root = document.getElementById('root');
    if (!root || root.children.length === 0) {
      var d = document.getElementById('error-display');
      if (window.Babel) {
        var scripts = document.querySelectorAll('script[type="text/babel"]');
        scripts.forEach(function(s) {
          try {
            Babel.transform(s.textContent, { presets: ['react'] });
          } catch(e) {
            d.style.display = 'block';
            d.textContent = 'Babel 編譯錯誤:\n' + e.message;
          }
        });
        if (d.style.display === 'none') {
          d.style.display = 'block';
          d.textContent = 'React 未能渲染，但 Babel 無錯誤。可能是執行期錯誤。';
        }
      } else {
        d.style.display = 'block';
        d.textContent = 'Babel 未載入（可能是網路問題）';
      }
    }
  }, 4000);
});
</script>

<script>

function openPrintWindow(project, data, sections, paymentMode) {
  const { cats, items, pCats, pItems, gallery, banks, settings } = data;
  const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const fmtN = n => '$ ' + Math.round(n||0).toLocaleString();
  const catTotal = catId => items.filter(i=>i.category_id===catId).reduce((s,i)=>s+i.unit_price*i.quantity,0);
  const workTotal = cats.reduce((s,c)=>s+catTotal(c.id),0);
  const designFee = (project.area_sqm||0)*(project.design_fee_per_sqm||0);
  const mgmtFee = workTotal*((project.management_fee_rate||7)/100);
  const subtotal = workTotal+designFee+mgmtFee;
  const tax = project.tax_enabled ? subtotal*((project.tax_rate||5)/100) : 0;
  const purchaseTotal = pItems.reduce((s,i)=>s+i.unit_price*i.quantity,0);
  const grandTotal = subtotal+tax;

  // Payment info based on selected mode
  const isCompany = paymentMode === 'company';
  const payeeName = isCompany ? '無澀空間室內裝修股份有限公司' : '鄭凱群';
  const paymentHTML = `

      <div style="font-size:11px;font-weight:700;color:#555;margin-bottom:8px;letter-spacing:.06em">PAYMENT ITEMS</div>
      <div style="font-size:12px;color:#555;line-height:2.2">

        ${isCompany

          : `銀行：台北富邦 營業部（012）　帳號：81680008713711`
        }
      </div>
    </div>
    <div style="margin-top:20px;border-top:1px solid #E0E0E0;padding-top:16px">
      <div style="font-size:11px;font-weight:700;color:#555;margin-bottom:6px;letter-spacing:.06em">THANKS FOR CHOOSING 無澀空間 ARTRIUM</div>
      <div style="font-size:11px;color:#888;line-height:1.9">
        如有任何問題，請聯絡 Dexigner13@gmail.com 或 0910119114。<br>
        本報價單有效期限為開立日起 30 天。＊未列項目及尺寸增加均列為追加項目
      </div>
    </div>`;

  // Logo block
  const logoSrc = settings['large_logo_url'] || '';
  const logoBlock = logoSrc
    ? `<img src="${esc(logoSrc)}" style="height:72px;object-fit:contain">`
    : `<div style="font-size:11px;font-weight:700;letter-spacing:.15em;color:#888">ARTRIUM</div>
       <div style="font-size:22px;font-weight:700;margin-top:2px;letter-spacing:.05em">無澀空間</div>`;

  // FROM / BILLED TO header
  const headerBlock = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-bottom:32px">
      <div>
        <div style="font-size:10px;font-weight:700;letter-spacing:.12em;color:#888;margin-bottom:8px">FROM</div>
        <div style="font-size:13px;line-height:2;color:#222">
          <div style="font-weight:700">無澀空間 ARTRIUM</div>
          <div>台北市內湖區陽光街321巷18號4樓</div>
          <div>M / 0910119114</div>
          <div>E / Dexigner13@gmail.com</div>
        </div>
      </div>
      <div>
        <div style="font-size:10px;font-weight:700;letter-spacing:.12em;color:#888;margin-bottom:8px">BILLED TO</div>
        <div style="font-size:13px;line-height:2;color:#222">
          <div style="font-weight:700">${esc(project.client_name||'—')}</div>
          ${project.contact_person ? `<div>${esc(project.contact_person)}</div>` : ''}
          ${project.address ? `<div>${esc(project.address)}</div>` : ''}
          ${project.contact_phone ? `<div>${esc(project.contact_phone)}</div>` : ''}
        </div>
      </div>
    </div>`;

  // Invoice meta
  const _now = new Date();
  const dateStr = _now.getFullYear() + '/' + String(_now.getMonth()+1).padStart(2,'0') + '/' + String(_now.getDate()).padStart(2,'0');
  const invoiceNo = String(_now.getFullYear()).slice(2) + String(_now.getMonth()+1).padStart(2,'0') + String(_now.getDate()).padStart(2,'0') + '-' + String(Math.floor(Math.random()*900)+100);
  const metaBlock = `
    <div style="margin-bottom:28px">
      <div style="font-size:11px;font-weight:700;color:#555;margin-bottom:3px">Invoice</div>
      <div style="font-size:12px;color:#555"># ${invoiceNo}</div>
      <div style="font-size:11px;font-weight:700;color:#555;margin-top:10px;margin-bottom:3px">Date</div>
      <div style="font-size:12px;color:#555">${dateStr}</div>
    </div>`;

  // Table header
  const tableHeader = `
    <div style="border-top:1.5px solid #333;margin-bottom:0"></div>
    <table style="width:100%;border-collapse:collapse">

          <th style="padding:10px 0;text-align:left;font-size:11px;font-weight:700;letter-spacing:.06em;width:60px">Qty</th>
          <th style="padding:10px 0;text-align:left;font-size:11px;font-weight:700;letter-spacing:.06em">Description</th>
          <th style="padding:10px 0;text-align:right;font-size:11px;font-weight:700;letter-spacing:.06em">Price</th>
        </tr>
      </thead>`;

  const dateP = _now.getFullYear() + String(_now.getMonth()+1).padStart(2,'0') + String(_now.getDate()).padStart(2,'0');
  let body = '';

  // ── Summary Page ──
  if (sections.summary) {
    let rowNum = 1;
    const catRows = cats.map(c => {
      const t = catTotal(c.id);
      return `<tr>
        <td style="padding:13px 0;border-bottom:1px solid #EBEBEA;font-size:13px;color:#888">${String(rowNum++).padStart(2,'0')}</td>
        <td style="padding:13px 0;border-bottom:1px solid #EBEBEA;font-size:13px;color:#666;text-align:center">1</td>
        <td style="padding:13px 0;border-bottom:1px solid #EBEBEA;font-size:13px;font-weight:500;color:#222">${esc(c.name)}</td>
        <td style="padding:13px 0;border-bottom:1px solid #EBEBEA;font-size:13px;font-weight:600;text-align:right;white-space:nowrap">${t?fmtN(t):'—'}</td>
      </tr>`;
    }).join('');

    // Management fee row
    const mgmtRow = `<tr>
      <td style="padding:13px 0;border-bottom:1px solid #EBEBEA;font-size:13px;color:#888">${String(rowNum++).padStart(2,'0')}</td>
      <td style="padding:13px 0;border-bottom:1px solid #EBEBEA;text-align:center;font-size:13px;color:#666">1</td>
      <td style="padding:13px 0;border-bottom:1px solid #EBEBEA">
        <div style="font-size:13px;font-weight:500;color:#222">管理費</div>
        <div style="font-size:11px;color:#888;margin-top:2px">Management Fee (${project.management_fee_rate||7}%)</div>
      </td>
      <td style="padding:13px 0;border-bottom:1px solid #EBEBEA;font-size:13px;font-weight:600;text-align:right;white-space:nowrap">${fmtN(mgmtFee)}</td>
    </tr>`;

    const designRow = designFee > 0 ? `<tr>
      <td style="padding:13px 0;border-bottom:1px solid #EBEBEA;font-size:13px;color:#888">${String(rowNum++).padStart(2,'0')}</td>
      <td style="padding:13px 0;border-bottom:1px solid #EBEBEA;text-align:center;font-size:13px;color:#666">1</td>
      <td style="padding:13px 0;border-bottom:1px solid #EBEBEA">
        <div style="font-size:13px;font-weight:500;color:#222">設計費</div>
        <div style="font-size:11px;color:#888;margin-top:2px">Design Fee</div>
      </td>
      <td style="padding:13px 0;border-bottom:1px solid #EBEBEA;font-size:13px;font-weight:600;text-align:right;white-space:nowrap">${fmtN(designFee)}</td>
    </tr>` : '';

    const summaryBlock = `
      <div style="display:flex;justify-content:flex-end;margin-top:6px">
        <table style="width:200px;border-collapse:collapse">
          <tr><td style="padding:6px 0;font-size:12px;color:#555;text-align:right;padding-right:16px">Sub Total</td><td style="padding:6px 0;font-size:12px;text-align:right;white-space:nowrap">${fmtN(subtotal)}</td></tr>
          ${project.tax_enabled ? `<tr><td style="padding:6px 0;font-size:12px;color:#555;text-align:right;padding-right:16px">Tax (${project.tax_rate||5}%)</td><td style="padding:6px 0;font-size:12px;text-align:right;white-space:nowrap">${fmtN(tax)}</td></tr>` : ''}
          <tr style="border-top:1.5px solid #333">
            <td style="padding:10px 0;font-size:13px;font-weight:700;text-align:right;padding-right:16px">Total</td>
            <td style="padding:10px 0;font-size:15px;font-weight:700;text-align:right;white-space:nowrap">${fmtN(grandTotal)}</td>
          </tr>
        </table>
      </div>`;

    body += `<div class="page">
      <div style="margin-bottom:36px">${logoBlock}</div>
      ${headerBlock}
      ${metaBlock}
      ${tableHeader}
        <tbody>${catRows}${mgmtRow}${designRow}</tbody>
      </table>
      ${summaryBlock}
      ${paymentHTML}
    </div>`;
  }

  // ── Detail Pages ──
  if (sections.detail) {
    cats.forEach((cat, ci) => {
      const catItems = items.filter(i => i.category_id === cat.id);
      if (!catItems.length) return;
      const itemRows = catItems.map((it, ii) => {
        const total = it.unit_price * it.quantity;
        return `<tr>
          <td style="padding:8px 0;border-bottom:1px solid #F0F0F0;font-size:11px;color:#AAA;width:40px;padding-left:10px">${ii+1}</td>
          <td style="padding:8px 0;border-bottom:1px solid #F0F0F0;font-size:11px;color:#666;width:70px;text-align:center">${it.quantity} ${esc(it.unit||'')}</td>
          <td style="padding:8px 0;border-bottom:1px solid #F0F0F0">
            <div style="font-size:12px;color:#333">${esc(it.name)}</div>
            ${it.notes ? `<div style="font-size:10px;color:#AAA;margin-top:1px">${esc(it.notes)}</div>` : ''}
          </td>
          <td style="padding:8px 0;border-bottom:1px solid #F0F0F0;text-align:right;font-size:12px;color:#333;white-space:nowrap">${total ? fmtN(total) : '—'}</td>
        </tr>`;
      }).join('');
      const t = catTotal(cat.id);
      body += `<div class="page">
        <div style="margin-bottom:24px">${logoBlock}</div>
        <div style="font-size:13px;font-weight:700;letter-spacing:.02em;margin-bottom:16px;padding-bottom:10px;border-bottom:1.5px solid #333">${String.fromCharCode(65+ci)}. ${esc(cat.name)}</div>
        ${tableHeader}
          <tbody>${itemRows}</tbody>
          <tfoot>
            <tr style="border-top:1px solid #999">
              <td colspan="3" style="padding:8px 0;text-align:right;font-size:12px;color:#888;padding-right:16px">Subtotal</td>
              <td style="padding:8px 0;text-align:right;font-size:13px;font-weight:700;white-space:nowrap">${fmtN(t)}</td>
            </tr>
          </tfoot>
        </table>
      </div>`;
    });
  }

  // ── Purchase Page ──
  if (sections.purchase && pItems.length > 0) {
    const pRows = pItems.map((it, ii) => {
      const total = it.unit_price * it.quantity;
      const pCat = pCats.find(c => c.id === it.category_id);
      return `<tr>
        <td style="padding:8px 0;border-bottom:1px solid #F0F0F0;font-size:11px;color:#AAA;width:40px;padding-left:10px">${ii+1}</td>
        <td style="padding:8px 0;border-bottom:1px solid #F0F0F0;font-size:11px;color:#666;width:70px;text-align:center">${it.quantity} ${esc(it.unit||'')}</td>
        <td style="padding:8px 0;border-bottom:1px solid #F0F0F0">
          <div style="font-size:12px;color:#333">${esc(it.name)}</div>
          ${pCat ? `<div style="font-size:10px;color:#AAA;margin-top:1px">${esc(pCat.name)}</div>` : ''}
        </td>
        <td style="padding:8px 0;border-bottom:1px solid #F0F0F0;text-align:right;font-size:12px;color:#333;white-space:nowrap">${total ? fmtN(total) : '—'}</td>
      </tr>`;
    }).join('');
    body += `<div class="page">
      <div style="margin-bottom:24px">${logoBlock}</div>
      <div style="font-size:13px;font-weight:700;margin-bottom:16px;padding-bottom:10px;border-bottom:1.5px solid #333">採購明細</div>
      ${tableHeader}
        <tbody>${pRows}</tbody>
        <tfoot>
          <tr style="border-top:1px solid #999">
            <td colspan="3" style="padding:8px 0;text-align:right;font-size:12px;color:#888;padding-right:16px">採購合計</td>
            <td style="padding:8px 0;text-align:right;font-size:13px;font-weight:700;white-space:nowrap">${fmtN(purchaseTotal)}</td>
          </tr>
        </tfoot>
      </table>
      ${paymentHTML}
    </div>`;
  }

    const changes = data.changeRecords;
    const changeRows = changes.map((c, i) => {
      const isAdd = (c.change_sign||'add') === 'add';
      return `<tr>
        <td style="padding:8px 0;border-bottom:1px solid #F0F0F0;font-size:11px;color:#AAA;width:40px;padding-left:10px">${i+1}</td>

        <div style="font-size:12px;color:#555"># ${invoiceNo}</div>
        <div style="font-size:11px;font-weight:700;color:#555;margin-top:10px;margin-bottom:3px">Date</div>

        <div style="font-size:12px;color:#888;margin-top:8px">合約總金額：<strong style="color:#222;font-size:14px">${fmtN(totalAmount)}</strong></div>
      </div>
      ${tableHeader}
        <tbody>${stageRows}</tbody>
      </table>
      <div style="display:flex;justify-content:flex-end;margin-top:6px">
        <table style="width:200px;border-collapse:collapse">
          <tr><td style="padding:6px 0;font-size:12px;color:#555;text-align:right;padding-right:16px">Total Amount</td><td style="padding:6px 0;font-size:12px;text-align:right;white-space:nowrap">${fmtN(currentTotal)}</td></tr>
          <tr><td style="padding:6px 0;font-size:12px;color:#555;text-align:right;padding-right:16px">Tax (0%)</td><td style="padding:6px 0;font-size:12px;text-align:right">$ 0</td></tr>
          <tr style="border-top:1.5px solid #333">
            <td style="padding:10px 0;font-size:13px;font-weight:700;text-align:right;padding-right:16px">Amount Due</td>
            <td style="padding:10px 0;font-size:15px;font-weight:700;text-align:right;white-space:nowrap">${fmtN(currentTotal)}</td>
          </tr>
        </table>
      </div>
      ${paymentHTML}
    </div>`;
  }

  const blob = new Blob([html], {type:'text/html;charset=utf-8'});
}
