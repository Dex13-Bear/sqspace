  const [defSettings, setDefSettings] = useState({});
  const [newCatName, setNewCatName] = useState('');
  const [newModName, setNewModName] = useState('');
  const [newPurchaseCat, setNewPurchaseCat] = useState('');
  const [newWorkCat, setNewWorkCat] = useState('');
  const [newRowKey, setNewRowKey] = useState(null);
  const [newRow, setNewRow] = useState({ category_name:'', item_name:'', unit:'', quantity:1, cost_price:0, unit_price:0, notes:'', module_name:'' });
  const importRef = useRef(null);

  const load = useCallback(async () => {
    const { data } = await db.from('item_templates').select('*').order('category_name').order('module_name').order('sort_order');
    setItems(data || []);
  }, []);

  useEffect(() => { load(); }, [load]);

  // Load default settings for the defaults tab
  useEffect(() => {
    if (view === 'defaults') {
      db.from('settings').select('*').then(r => {
        const obj = {};
        (r.data||[]).forEach(s => obj[s.key] = s.value);
        setDefSettings(obj);
      });
    }
  }, [view]);

  const saveDefSetting = async (key, value) => {
    await db.from('settings').upsert({ key, value }, { onConflict: 'key' });
    toast('已儲存');
  };

  const updateItem = async (id, field, val) => {
    await db.from('item_templates').update({ [field]: val }).eq('id', id);
    setItems(p => p.map(i => i.id===id ? {...i,[field]:val} : i));
  };
  const deleteItem = async (id) => { await db.from('item_templates').delete().eq('id', id); load(); };

  const addRowTo = async (keyField, keyVal) => {
    if (!newRow.item_name.trim()) return;
    const count = items.filter(i=>i[keyField]===keyVal).length;
    const insert = { ...newRow, [keyField]: keyVal, sort_order: count };
    if (keyField === 'category_name') insert.module_name = '';
    if (keyField === 'module_name') insert.category_name = newRow.category_name || '';
    await db.from('item_templates').insert(insert);
    setNewRowKey(null);
    setNewRow({ category_name:'', item_name:'', unit:'', quantity:1, cost_price:0, unit_price:0, notes:'', module_name:'' });
    load(); toast('已新增');
  };

  const addCategory = async () => {
    if (!newCatName.trim()) return;
    await db.from('item_templates').insert({ category_name: newCatName.trim(), module_name:'', item_name:'新細項', unit:'', quantity:1, cost_price:0, unit_price:0, notes:'', sort_order:0 });
    setNewCatName(''); load(); toast('已新增大項');
  };

  const deleteCategory = async (catName) => {
    if (!confirm(`刪除「${catName}」大項及所有細項？`)) return;
    await db.from('item_templates').delete().eq('category_name', catName).eq('module_name','');
    load(); toast('已刪除');
  };

  const addModule = async () => {
    if (!newModName.trim()) return;
    await db.from('item_templates').insert({ module_name: newModName.trim(), category_name:'', item_name:'新細項', unit:'', quantity:1, cost_price:0, unit_price:0, notes:'', sort_order:0 });
    setNewModName(''); load(); toast('已新增模組');
  };

  const deleteModule = async (modName) => {
    if (!confirm(`刪除「${modName}」模組及所有細項？`)) return;
    await db.from('item_templates').delete().eq('module_name', modName);
    load(); toast('已刪除');
  };

  const renameGroup = async (field, oldVal, newVal) => {
    if (!newVal.trim() || newVal === oldVal) return;
    await db.from('item_templates').update({ [field]: newVal }).eq(field, oldVal);
    load();
  };

  // Export
  const exportXlsx = () => {
    const sampleCat = [
      { category_name:'水電、弱電工程', item_name:'冷熱水出口配置', unit:'口', quantity:1, cost_price:3000, unit_price:3500, notes:'含材料' },
      { category_name:'水電、弱電工程', item_name:'排水配置', unit:'口', quantity:1, cost_price:1500, unit_price:2500, notes:'' },
      { category_name:'木作工程', item_name:'平釘天花板', unit:'坪', quantity:1, cost_price:3500, unit_price:4000, notes:'' },
    ];
    const sampleMod = [
      { module_name:'浴室翻新', category_name:'水電、弱電工程', item_name:'冷熱水出口配置', unit:'口', quantity:1, cost_price:3000, unit_price:3500, notes:'' },
      { module_name:'空間基本木作', category_name:'木作工程', item_name:'平釘天花板', unit:'坪', quantity:1, cost_price:3500, unit_price:4000, notes:'' },
    ];

    const catItems = items.filter(i => !i.module_name);
    const modItems = items.filter(i => !!i.module_name);
    const isDemo = items.length === 0;

    const catRows = (isDemo ? sampleCat : catItems).map(i => ({
      '工程大項': i.category_name, '細項名稱': i.item_name, '單位': i.unit,
      '數量': i.quantity, '成本單價': i.cost_price, '報價單價': i.unit_price, '備註': i.notes||''
    }));
    const modRows = (isDemo ? sampleMod : modItems).map(i => ({
      '快選模組': i.module_name, '工程大項': i.category_name, '細項名稱': i.item_name, '單位': i.unit,
      '數量': i.quantity, '成本單價': i.cost_price, '報價單價': i.unit_price, '備註': i.notes||''
    }));

    const wb = XLSX.utils.book_new();

    const wsCat = XLSX.utils.json_to_sheet(catRows);
    wsCat['!cols'] = [22,28,8,6,10,10,28].map(w=>({wch:w}));
    XLSX.utils.book_append_sheet(wb, wsCat, '1_工程大項細項');

    const wsMod = XLSX.utils.json_to_sheet(modRows.length ? modRows : [{'快選模組':'','工程大項':'','細項名稱':'','單位':'','數量':'','成本單價':'','報價單價':'','備註':''}]);
    wsMod['!cols'] = [16,18,28,8,6,10,10,28].map(w=>({wch:w}));
    XLSX.utils.book_append_sheet(wb, wsMod, '2_快選模組');

    XLSX.writeFile(wb, isDemo ? '工程資料庫_範本.xlsx' : '工程資料庫.xlsx');
  };

  const importXlsx = async (e) => {
    const file = e.target.files[0]; if (!file) return;
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf);

    const toInsert = [];
    // Read ALL sheets - first sheet = 工程大項細項, second sheet = 快選模組 (if present)
    wb.SheetNames.forEach(sheetName => {
      const ws = wb.Sheets[sheetName];
      const rows = XLSX.utils.sheet_to_json(ws);
      rows.forEach((r, i) => {
        if (!r['細項名稱']) return;
        toInsert.push({
          category_name: r['工程大項']||r['category_name']||'',
          module_name: r['快選模組']||r['module_name']||'',
          item_name: r['細項名稱']||'',
          unit: r['單位']||'',
          quantity: r['數量']||1,
          cost_price: r['成本單價']||0,
          unit_price: r['報價單價']||0,
          notes: r['備註']||'',
          sort_order: toInsert.length,
        });
      });
    });

    if (!toInsert.length) return toast('檔案無資料', 'error');
    if (!confirm(`匯入 ${toInsert.length} 筆資料？\n（將覆蓋現有工程資料庫，此操作無法復原）`)) return;

    // Delete then batch insert (100 per batch to avoid size limits)
    await db.from('item_templates').delete().neq('id','00000000-0000-0000-0000-000000000000');
    const batchSize = 100;
    for (let i = 0; i < toInsert.length; i += batchSize) {
      const batch = toInsert.slice(i, i + batchSize);
      const { error } = await db.from('item_templates').insert(batch);
      if (error) { toast(`匯入失敗：${error.message}`, 'error'); return; }
    }
    toast(`已匯入 ${toInsert.length} 筆`); load(); e.target.value = '';
  };

  // Grouped data
  const catGroups = {};
  items.filter(i => !i.module_name).forEach(i => {
    if (!catGroups[i.category_name]) catGroups[i.category_name] = [];
    catGroups[i.category_name].push(i);
  });
  const modGroups = {};
  items.filter(i => !!i.module_name).forEach(i => {
    if (!modGroups[i.module_name]) modGroups[i.module_name] = [];
    modGroups[i.module_name].push(i);
  });

  // unique categories and items-per-category from the 工程大項細項 database
  const dbCats = [...new Set(items.filter(i=>!i.module_name).map(i=>i.category_name).filter(Boolean))];
  const dbItemsForCat = (catName) => items.filter(i=>!i.module_name && i.category_name===catName);

  const ItemTable = ({ groupItems, keyField, keyVal }) => (
    <div className="table-wrap">
      <table>
        <thead>
          <tr>
            {keyField === 'module_name' && <th style={{width:140}}>工程大項</th>}
            <th>細項名稱</th>
            <th style={{width:45}}>單位</th>
            <th className="num" style={{width:45}}>數量</th>
            {showCost && <th className="num" style={{width:75, background:'#F2F0EC', color:'#6B4835'}}>成本單價</th>}
            <th className="num" style={{width:75}}>報價單價</th>
            {showCost && <th className="num" style={{width:70, background:'#F2F0EC', color:'#6B4835'}}>毛利/單</th>}
            <th>備註</th>
            <th style={{width:36}}></th>
          </tr>
        </thead>
        <tbody>
          {groupItems.map(item => (
            <tr key={item.id}>
              {keyField === 'module_name' && (
                <td>
                  <select style={{border:'none',background:'transparent',fontSize:13,width:'100%',outline:'none',cursor:'pointer',padding:'2px 4px'}}
                    value={item.category_name||''}
                    onChange={e => {
                      updateItem(item.id,'category_name',e.target.value);
                      // clear item_name when category changes
                      updateItem(item.id,'item_name','');
                    }}>
                    <option value="">選擇大項...</option>
                    {dbCats.map(c=><option key={c} value={c}>{c}</option>)}
                  </select>
                </td>
              )}
              <td>
                {keyField === 'module_name' && item.category_name ? (
                  <select style={{border:'none',background:'transparent',fontSize:13,width:'100%',outline:'none',cursor:'pointer',padding:'2px 4px'}}
                    value={item.item_name||''}
                    onChange={e => {
                      const tpl = dbItemsForCat(item.category_name).find(t=>t.item_name===e.target.value);
                      updateItem(item.id,'item_name',e.target.value);
                      if (tpl) {
                        updateItem(item.id,'unit',tpl.unit||'');
                        updateItem(item.id,'quantity',tpl.quantity||1);
                        updateItem(item.id,'cost_price',tpl.cost_price||0);
                        updateItem(item.id,'unit_price',tpl.unit_price||0);
                      }
                    }}>
                    <option value="">選擇細項...</option>
                    {dbItemsForCat(item.category_name).map(t=><option key={t.id} value={t.item_name}>{t.item_name}</option>)}
                  </select>
                ) : (
                  <InlineEdit value={item.item_name||''} onChange={val => updateItem(item.id, 'item_name', val)} />
                )}
              </td>
              <td><InlineEdit style={{width:40,textAlign:'center'}} value={item.unit||''} onChange={val => updateItem(item.id, 'unit', val)} /></td>
              <td className="num"><InlineEdit style={{width:40,textAlign:'right'}} type="number" value={item.quantity||1} onChange={val => updateItem(item.id, 'quantity', +val)} /></td>
              {showCost && <td className="num" style={{background:'#F2F0EC'}}><InlineEdit style={{width:65,textAlign:'right',background:'transparent'}} type="number" value={item.cost_price||0} onChange={val => updateItem(item.id, 'cost_price', +val)} /></td>}
              <td className="num"><InlineEdit style={{width:65,textAlign:'right'}} type="number" value={item.unit_price||0} onChange={val => updateItem(item.id, 'unit_price', +val)} /></td>
              {showCost && <td className="num" style={{background:'#F2F0EC', fontSize:11, color:(item.unit_price||0)-(item.cost_price||0)>0?'#3A5240':'#DC2626', fontWeight:500}}>{fmt((item.unit_price||0)-(item.cost_price||0))}</td>}
              <td><InlineEdit value={item.notes||''} onChange={val => updateItem(item.id, 'notes', val)} /></td>
              <td><button className="btn-icon" style={{color:'#8B2E2E'}} onClick={()=>deleteItem(item.id)}>✕</button></td>
            </tr>
          ))}
          {/* Inline add row */}
          {newRowKey === keyVal && (
            <tr style={{ background:'#F2F0EC' }}>
              {keyField === 'module_name' && (
                <td>
                  <select className="form-select" style={{fontSize:12}}
                    value={newRow.category_name}
                    onChange={e => setNewRow(p=>({...p, category_name:e.target.value, item_name:'', unit:'', cost_price:0, unit_price:0}))}>
                    <option value="">選擇大項...</option>
                    {dbCats.map(c=><option key={c} value={c}>{c}</option>)}
                  </select>
                </td>
              )}
              <td>
                {keyField === 'module_name' && newRow.category_name ? (
                  <select className="form-select" style={{fontSize:12}}
                    value={newRow.item_name}
                    onChange={e => {
                      const tpl = dbItemsForCat(newRow.category_name).find(t=>t.item_name===e.target.value);
                      setNewRow(p=>({...p, item_name:e.target.value,
                        unit: tpl?.unit||p.unit, quantity: tpl?.quantity||p.quantity,
                        cost_price: tpl?.cost_price||p.cost_price, unit_price: tpl?.unit_price||p.unit_price
                      }));
                    }}>
                    <option value="">選擇細項...</option>
                    {dbItemsForCat(newRow.category_name).map(t=><option key={t.id} value={t.item_name}>{t.item_name}</option>)}
                  </select>
                ) : (
                  <InlineEdit style={{background:'#fff'}} placeholder={keyField==='module_name'?"先選大項":"細項名稱 *"} value={newRow.item_name} onChange={val=>setNewRow(p=>({...p,item_name:val}))} onKeyDown={e=>e.key==='Enter'&&addRowTo(keyField,keyVal)} />
                )}
              </td>
              <td><InlineEdit style={{width:40,textAlign:'center',background:'#fff'}} value={newRow.unit} onChange={val=>setNewRow(p=>({...p,unit:val}))} /></td>
              <td className="num"><InlineEdit style={{width:40,textAlign:'right',background:'#fff'}} type="number" value={newRow.quantity} onChange={val=>setNewRow(p=>({...p,quantity:+val}))} /></td>
              {showCost && <td className="num" style={{background:'#F2F0EC'}}><InlineEdit style={{width:65,textAlign:'right',background:'transparent'}} type="number" value={newRow.cost_price} onChange={val=>setNewRow(p=>({...p,cost_price:+val}))} /></td>}
              <td className="num"><InlineEdit style={{width:65,textAlign:'right',background:'#fff'}} type="number" value={newRow.unit_price} onChange={val=>setNewRow(p=>({...p,unit_price:+val}))} /></td>
              {showCost && <td style={{background:'#F2F0EC'}}></td>}
              <td><InlineEdit style={{background:'#fff'}} value={newRow.notes} onChange={val=>setNewRow(p=>({...p,notes:val}))} /></td>
              <td style={{textAlign:'center'}}>
                <button className="btn-icon" style={{color:'#3A5240',fontWeight:700}} onClick={()=>addRowTo(keyField,keyVal)}>✓</button>
                <button className="btn-icon" style={{color:'#888'}} onClick={()=>setNewRowKey(null)}>✕</button>
              </td>
            </tr>
          )}
        </tbody>
      </table>
    </div>
  );

  return (
    <div>
      <div className="flex justify-between items-center mb-4">
        <div className="section-title">工程資料庫</div>
        <div className="flex gap-2">
          <input ref={importRef} type="file" accept=".xlsx,.xls" style={{display:'none'}} onChange={importXlsx} />
          <button className="btn btn-ghost btn-sm" onClick={()=>importRef.current?.click()}>匯入 Excel</button>
          <button className="btn btn-ghost btn-sm" onClick={exportXlsx}>{items.length>0?'匯出 Excel':'下載範本'}</button>
        </div>
      </div>

      {/* Tab switch */}
      <div style={{ display:'flex', gap:0, marginBottom:16, border:'1px solid #E8E8E6', borderRadius:8, overflow:'hidden', width:'fit-content' }}>
        <button onClick={()=>setView('cats')} style={{ padding:'7px 18px', fontSize:13, fontWeight:500, border:'none', cursor:'pointer', background: view==='cats'?'#2E4D5C':'#fff', color: view==='cats'?'#fff':'#555' }}>工程大項細項</button>
        <button onClick={()=>setView('modules')} style={{ padding:'7px 18px', fontSize:13, fontWeight:500, border:'none', cursor:'pointer', background: view==='modules'?'#2E4D5C':'#fff', color: view==='modules'?'#fff':'#555', borderLeft:'1px solid #E8E8E6' }}>快選模組</button>
        <button onClick={()=>setView('defaults')} style={{ padding:'7px 18px', fontSize:13, fontWeight:500, border:'none', cursor:'pointer', background: view==='defaults'?'#2E4D5C':'#fff', color: view==='defaults'?'#fff':'#555', borderLeft:'1px solid #E8E8E6' }}>新專案預設大項</button>
      </div>

      {view === 'defaults' && (() => {
        // Work cats: from item_templates + extra added here
        const templateWorkCats = [...new Set(items.filter(i=>!i.module_name).map(i=>i.category_name).filter(Boolean))];
        const extraWorkCats = (defSettings['default_work_cats_extra'] || '').split('\n').map(s=>s.trim()).filter(Boolean);
        const allWorkCats = [...new Set([...templateWorkCats, ...extraWorkCats])];
        const checkedWork = (defSettings['default_work_cats'] || '').split('\n').map(s=>s.trim()).filter(Boolean);

        const toggleWork = (cat) => {
          const next = checkedWork.includes(cat) ? checkedWork.filter(c=>c!==cat) : [...checkedWork, cat];
          const val = next.join('\n');
          setDefSettings(p => ({ ...p, default_work_cats: val }));
          saveDefSetting('default_work_cats', val);
        };
        const moveWork = (cat, dir) => {
          const idx = checkedWork.indexOf(cat);
          if (idx < 0) return;
          const next = [...checkedWork];
          const si = idx + dir;
          if (si < 0 || si >= next.length) return;
          [next[idx], next[si]] = [next[si], next[idx]];
          const val = next.join('\n');
          setDefSettings(p => ({ ...p, default_work_cats: val }));
          saveDefSetting('default_work_cats', val);
        };
        const addWorkCat = async () => {
          if (!newWorkCat.trim() || allWorkCats.includes(newWorkCat.trim())) return;
          const next = [...extraWorkCats, newWorkCat.trim()];
          const listVal = next.join('\n');
          await db.from('settings').upsert({ key: 'default_work_cats_extra', value: listVal }, { onConflict: 'key' });
          setDefSettings(p => ({ ...p, default_work_cats_extra: listVal }));
          setNewWorkCat('');
          toast('已新增');
        };
        const removeWorkCat = async (cat) => {
          // Only allow removing extra cats (not template cats)
          if (templateWorkCats.includes(cat)) return;
          const nextExtra = extraWorkCats.filter(c=>c!==cat).join('\n');
          const nextChecked = checkedWork.filter(c=>c!==cat).join('\n');
          await db.from('settings').upsert({ key: 'default_work_cats_extra', value: nextExtra }, { onConflict: 'key' });
          await db.from('settings').upsert({ key: 'default_work_cats', value: nextChecked }, { onConflict: 'key' });
          setDefSettings(p => ({ ...p, default_work_cats_extra: nextExtra, default_work_cats: nextChecked }));
        };

        // Purchase cats: standalone list
        const DEFAULT_PURCHASE = '電器、家電\n廚房設備\n衛浴設備\n磁磚\n家具採購\n其他';
        const allPurchaseCats = (defSettings['default_purchase_cats_list'] || DEFAULT_PURCHASE).split('\n').map(s=>s.trim()).filter(Boolean);
        const checkedPurchase = (defSettings['default_purchase_cats'] || DEFAULT_PURCHASE).split('\n').map(s=>s.trim()).filter(Boolean);

        const togglePurchase = (cat) => {
          const next = checkedPurchase.includes(cat) ? checkedPurchase.filter(c=>c!==cat) : [...checkedPurchase, cat];
          const val = next.join('\n');
          setDefSettings(p => ({ ...p, default_purchase_cats: val }));
          saveDefSetting('default_purchase_cats', val);
        };

        const addPurchaseCat = async () => {
          if (!newPurchaseCat.trim()) return;
          const next = [...allPurchaseCats, newPurchaseCat.trim()];
          const listVal = next.join('\n');
          await db.from('settings').upsert({ key: 'default_purchase_cats_list', value: listVal }, { onConflict: 'key' });
          setDefSettings(p => ({ ...p, default_purchase_cats_list: listVal }));
          setNewPurchaseCat('');
          toast('已新增');
        };

        const removePurchaseCat = async (cat) => {
          const nextList = allPurchaseCats.filter(c=>c!==cat).join('\n');
          const nextChecked = checkedPurchase.filter(c=>c!==cat).join('\n');
          await db.from('settings').upsert({ key: 'default_purchase_cats_list', value: nextList }, { onConflict: 'key' });
          await db.from('settings').upsert({ key: 'default_purchase_cats', value: nextChecked }, { onConflict: 'key' });
          setDefSettings(p => ({ ...p, default_purchase_cats_list: nextList, default_purchase_cats: nextChecked }));
        };

        return (
          <div style={{ display:'flex', gap:20, flexWrap:'wrap', alignItems:'flex-start' }}>
            {/* Work categories */}
            <div className="card" style={{ minWidth: 300, flex:1 }}>
              <div className="card-header">
                <div className="card-title" style={{fontSize:14}}>工程明細大項</div>
                <span className="text-sm text-muted">打勾的在新專案中自動建立</span>
              </div>
              <div style={{ padding: '8px 0' }}>
                {/* Checked items with reorder */}
                {checkedWork.length > 0 && (
                  <div style={{ borderBottom: '1px solid #F0F0EE', marginBottom: 8, paddingBottom: 8 }}>
                    <div style={{ padding:'4px 16px 6px', fontSize:11, color:'#888', fontWeight:600 }}>已選（可調整順序）</div>
                    {checkedWork.map((cat, idx) => (
                      <div key={cat} style={{ display:'flex', alignItems:'center', gap:8, padding:'6px 16px' }}>
                        <input type="checkbox" checked={true} onChange={()=>toggleWork(cat)} style={{ accentColor:'#2E4D5C', flexShrink:0 }} />
                        <span style={{ flex:1, fontSize:13 }}>{cat}</span>
                        <button className="btn-icon" style={{fontSize:11,color:'#888',padding:'2px 5px'}} onClick={()=>moveWork(cat,-1)} disabled={idx===0}>↑</button>
                        <button className="btn-icon" style={{fontSize:11,color:'#888',padding:'2px 5px'}} onClick={()=>moveWork(cat,1)} disabled={idx===checkedWork.length-1}>↓</button>
                        {extraWorkCats.includes(cat) && <button className="btn-icon" style={{color:'#8B2E2E',fontSize:12}} onClick={()=>removeWorkCat(cat)}>✕</button>}
                      </div>
                    ))}
                  </div>
                )}
                {/* Unchecked items */}
                {allWorkCats.filter(c=>!checkedWork.includes(c)).map(cat => (
                  <div key={cat} style={{ display:'flex', alignItems:'center', gap:8, padding:'6px 16px' }}>
                    <input type="checkbox" checked={false} onChange={()=>toggleWork(cat)} style={{ accentColor:'#2E4D5C', flexShrink:0 }} />
                    <span style={{ flex:1, fontSize:13, color:'#999' }}>{cat}</span>
                    {extraWorkCats.includes(cat) && <button className="btn-icon" style={{color:'#8B2E2E',fontSize:12}} onClick={()=>removeWorkCat(cat)}>✕</button>}
                  </div>
                ))}
                {allWorkCats.length === 0 && (
                  <div style={{ padding:'16px', color:'#CCC', fontSize:12, textAlign:'center' }}>
                    尚無大項，請在下方新增或至「工程大項細項」分頁建立
                  </div>
                )}
                <div style={{ display:'flex', gap:8, padding:'10px 16px', borderTop:'1px solid #F0F0EE', marginTop:4 }}>
                  <input className="form-input" style={{flex:1,fontSize:12}} placeholder="新增工程大項..." value={newWorkCat} onChange={e=>setNewWorkCat(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addWorkCat()} />
                  <button className="btn btn-primary btn-sm" onClick={addWorkCat}>新增</button>
                </div>
              </div>
            </div>

            {/* Purchase categories */}
            <div className="card" style={{ minWidth: 280, flex:1 }}>
              <div className="card-header">
                <div className="card-title" style={{fontSize:14}}>採購明細大項</div>
                <span className="text-sm text-muted">打勾的在新專案中自動建立</span>
              </div>
              <div style={{ padding: '8px 0' }}>
                {allPurchaseCats.map(cat => (
                  <div key={cat} style={{ display:'flex', alignItems:'center', gap:8, padding:'6px 16px' }}>
                    <input type="checkbox" checked={checkedPurchase.includes(cat)} onChange={()=>togglePurchase(cat)} style={{ accentColor:'#2E4D5C', flexShrink:0 }} />
                    <span style={{ flex:1, fontSize:13, color: checkedPurchase.includes(cat) ? '#2E2E2E' : '#999' }}>{cat}</span>
                    <button className="btn-icon" style={{color:'#8B2E2E',fontSize:12}} onClick={()=>removePurchaseCat(cat)}>✕</button>
                  </div>
                ))}
                <div style={{ display:'flex', gap:8, padding:'10px 16px', borderTop:'1px solid #F0F0EE', marginTop:4 }}>
                  <input className="form-input" style={{flex:1,fontSize:12}} placeholder="新增採購大項..." value={newPurchaseCat} onChange={e=>setNewPurchaseCat(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addPurchaseCat()} />
                  <button className="btn btn-primary btn-sm" onClick={addPurchaseCat}>新增</button>
                </div>
              </div>
            </div>

            <div style={{ width:'100%', fontSize:11, color:'#AAA' }}>
              提示：修改後只影響「新建立」的專案，現有專案不受影響。
            </div>
          </div>
        );
      })()}

      {view === 'cats' && (
        <>
          {/* Add new category */}
          <div className="card mb-4" style={{padding:'10px 14px'}}>
            <div style={{display:'flex',gap:8,alignItems:'center'}}>
              <span style={{fontSize:12,color:'#666',whiteSpace:'nowrap'}}>新增工程大項：</span>
              <input className="form-input" style={{flex:1}} placeholder="大項名稱，例：水電、弱電工程" value={newCatName} onChange={e=>setNewCatName(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addCategory()} />
              <button className="btn btn-primary btn-sm" onClick={addCategory}>新增大項</button>
            </div>
          </div>
          {Object.entries(catGroups).map(([catName, catItems]) => (
            <div key={catName} className="card mb-3">
              <div className="card-header" style={{gap:8}}>
                <input style={{fontWeight:700,fontSize:14,border:'none',background:'transparent',outline:'none',flex:1,minWidth:0}}
                  defaultValue={catName} onBlur={e=>renameGroup('category_name',catName,e.target.value)} onKeyDown={e=>e.key==='Enter'&&e.target.blur()} />
                <span className="text-sm text-muted">{catItems.length} 筆</span>
                <button className="btn btn-ghost btn-sm" onClick={()=>{setNewRowKey(catName);setNewRow({category_name:'',item_name:'',unit:'',quantity:1,cost_price:0,unit_price:0,notes:'',module_name:''})}}>＋ 新增細項</button>
                <button className="btn btn-xs" style={{background:'#FEE2E2',color:'#8B2E2E',border:'none',borderRadius:4}} onClick={()=>deleteCategory(catName)}>刪除大項</button>
              </div>
              <ItemTable groupItems={catItems} keyField="category_name" keyVal={catName} />
            </div>
          ))}
          {Object.keys(catGroups).length===0 && <div style={{textAlign:'center',padding:40,color:'#CCC',fontSize:13}}>尚無大項，在上方輸入大項名稱後點「新增大項」</div>}
        </>
      )}

      {view === 'modules' && (
        <>
          {/* Add new module */}
          <div className="card mb-4" style={{padding:'10px 14px'}}>
            <div style={{display:'flex',gap:8,alignItems:'center'}}>
              <span style={{fontSize:12,color:'#666',whiteSpace:'nowrap'}}>新增快選模組：</span>
              <input className="form-input" style={{flex:1}} placeholder="模組名稱，例：浴室翻新、空間基本木作" value={newModName} onChange={e=>setNewModName(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addModule()} />
              <button className="btn btn-primary btn-sm" onClick={addModule}>新增模組</button>
            </div>
          </div>
          {Object.entries(modGroups).map(([modName, modItems]) => (
            <div key={modName} className="card mb-3">
              <div className="card-header" style={{gap:8}}>
                <input style={{fontWeight:700,fontSize:14,border:'none',background:'transparent',outline:'none',flex:1,minWidth:0}}
                  defaultValue={modName} onBlur={e=>renameGroup('module_name',modName,e.target.value)} onKeyDown={e=>e.key==='Enter'&&e.target.blur()} />
                <span className="text-sm text-muted">{modItems.length} 筆</span>
                <button className="btn btn-ghost btn-sm" onClick={()=>{setNewRowKey(modName);setNewRow({category_name:'',item_name:'',unit:'',quantity:1,cost_price:0,unit_price:0,notes:'',module_name:modName})}}>＋ 新增細項</button>
                <button className="btn btn-xs" style={{background:'#FEE2E2',color:'#8B2E2E',border:'none',borderRadius:4}} onClick={()=>deleteModule(modName)}>刪除模組</button>
              </div>
              <ItemTable groupItems={modItems} keyField="module_name" keyVal={modName} />
            </div>
          ))}
          {Object.keys(modGroups).length===0 && <div style={{textAlign:'center',padding:40,color:'#CCC',fontSize:13}}>尚無模組，在上方輸入模組名稱後點「新增模組」</div>}
        </>
      )}
    </div>
  );
}


function ProjectMembersModal({ open, onClose, project }) {
  const [users, setUsers] = useState([]);
  const [members, setMembers] = useState([]);

  useEffect(() => {
    if (!open) return;
    Promise.all([
      db.from('users').select('*').order('created_at'),
      db.from('project_members').select('*').eq('project_id', project.id),
    ]).then(([u, m]) => { setUsers(u.data||[]); setMembers(m.data||[]); });
  }, [open, project.id]);

  const getMember = uid => members.find(m => m.user_id === uid);

  const isAutoAccess = (u) => u.role === 'admin' || u.username === project.created_by;

  const toggle = async (user, canEdit) => {
    if (isAutoAccess(user)) return; // cannot modify auto-access
    const existing = getMember(user.id);
    if (existing) {
      if (canEdit === null) {
        await db.from('project_members').delete().eq('id', existing.id);
        setMembers(p => p.filter(m => m.id !== existing.id));
      } else {
        await db.from('project_members').update({ can_edit: canEdit }).eq('id', existing.id);
        setMembers(p => p.map(m => m.id === existing.id ? { ...m, can_edit: canEdit } : m));
      }
    } else {
      const { data } = await db.from('project_members').insert({ project_id: project.id, user_id: user.id, can_edit: canEdit !== false }).select().single();
      if (data) setMembers(p => [...p, data]);
    }
    toast('已更新');
  };

  if (!open) return null;
  return (
    <Modal open={open} title="專案成員與權限設定" onClose={onClose}>
      <div style={{ fontSize: 12, color: '#888', marginBottom: 12 }}>管理員與專案建立者預設可查看及編輯。其他成員需手動授權。</div>
      <table style={{ width: '100%', borderCollapse: 'collapse' }}>
        <thead><tr>
          <th style={{ padding: '8px 12px', textAlign: 'left', fontSize: 12, color: '#666', borderBottom: '1px solid #EEE' }}>成員</th>
          <th style={{ width: 80, textAlign: 'center', fontSize: 12, color: '#666', borderBottom: '1px solid #EEE' }}>可查看</th>
          <th style={{ width: 80, textAlign: 'center', fontSize: 12, color: '#666', borderBottom: '1px solid #EEE' }}>可編輯</th>
          <th style={{ width: 60, textAlign: 'center', fontSize: 12, color: '#666', borderBottom: '1px solid #EEE' }}>移除</th>
        </tr></thead>
        <tbody>
          {users.map(u => {
            const m = getMember(u.id);
            const auto = isAutoAccess(u);
            return (
              <tr key={u.id} style={{ borderBottom: '1px solid #F5F5F3', background: auto ? '#F8F8F6' : '#fff' }}>
                <td style={{ padding: '10px 12px' }}>
                  <div style={{ fontWeight: 500 }}>{u.display_name || u.username}</div>
                  <div style={{ fontSize: 11, color: '#999' }}>
                    {u.role === 'admin' ? '管理員' : '工作人員'}
                    {u.username === project.created_by && <span style={{ marginLeft: 6, color: '#2E4D5C', background: '#EDF2F7', padding: '1px 6px', borderRadius: 8, fontSize: 10 }}>建立者</span>}
                  </div>
                </td>
                <td style={{ textAlign: 'center', padding: '10px' }}>
                  {auto
                    ? <span style={{ fontSize: 16, color: '#3A5240' }}>✓</span>
                    : <input type="checkbox" checked={!!m} onChange={() => toggle(u, false)} style={{ accentColor: '#2E4D5C', width: 16, height: 16 }} />}
                </td>
                <td style={{ textAlign: 'center', padding: '10px' }}>
                  {auto
                    ? <span style={{ fontSize: 16, color: '#3A5240' }}>✓</span>
                    : <input type="checkbox" checked={!!m && m.can_edit} onChange={e => toggle(u, e.target.checked)} disabled={!m} style={{ accentColor: '#2E4D5C', width: 16, height: 16 }} />}
                </td>
                <td style={{ textAlign: 'center', padding: '10px' }}>
                  {!auto && m && <button className="btn-icon" style={{ color: '#8B2E2E' }} onClick={() => toggle(u, null)}>✕</button>}
                </td>
              </tr>
            );
          })}
        </tbody>
      </table>
      <div style={{ marginTop: 12, fontSize: 12, color: '#999' }}>
        勾選「可查看」代表此成員可進入此專案。勾選「可編輯」代表可以修改資料。
      </div>
    </Modal>
  );
}

const TABS = [
  { key: 'summary',   label: '專案總表' },
  { key: 'flow',      label: '專案歷程' },
  { key: 'work',      label: '工程明細' },
  { key: 'change',    label: '追加追減' },
  { key: 'purchase',  label: '採購明細' },
  { key: 'schedule',  label: '進度排程' },
  { key: 'sitelog',   label: '施工日誌' },
  { key: 'meeting',   label: '會議記錄' },
  { key: 'todos',     label: '待辦事項' },
  { key: 'gallery',    label: '圖庫與附件' },
  { key: 'payment',   label: '請款單' },
  { key: 'templates',  label: '工程資料庫' },
  { key: 'settlement', label: '成本結算' },
  { key: 'vendors',    label: '廠商管理' },
];

function ProjectDetailPage({ project: initialProject, onBack, user, tab, setTab, onOpenSidebar }) {
  const [project, setProject] = useState(initialProject);
  const [showPrint, setShowPrint] = useState(false);
  const [showUnlock, setShowUnlock] = useState(false);
  const [showMembers, setShowMembers] = useState(false);
  const [showCost, setShowCost] = useState(false);
  const [unlockPw, setUnlockPw] = useState('');
  const [showCostPw, setShowCostPw] = useState(false);
  const [costPwInput, setCostPwInput] = useState('');
  const [tabUnlocked, setTabUnlocked] = useState(null); // which tab is currently unlocked
  const [costPwTarget, setCostPwTarget] = useState(null);

  const isAdmin = user.role === 'admin';

  const requireCostPw = (target) => {
    setCostPwTarget(target);
    setCostPwInput('');
    setShowCostPw(true);
  };

  const verifyCostPw = async () => {
    const { data } = await db.from('users').select('*').eq('username', user.username).eq('password', costPwInput).single();
    if (!data) return toast('密碼錯誤', 'error');
    setShowCostPw(false);
    if (costPwTarget === 'cost') setShowCost(true);
    else if (costPwTarget === 'settlement') { setTabUnlocked('settlement'); setTab('settlement'); }
    else if (costPwTarget === 'vendors') { setTabUnlocked('vendors'); setTab('vendors'); }
  };

  useEffect(() => { setProject(initialProject); }, [initialProject.id]);
  useEffect(() => {
    if (tab === 'settlement' && tabUnlocked !== 'settlement') requireCostPw('settlement');
    else if (tab === 'vendors' && tabUnlocked !== 'vendors') { if (user.role === 'admin') requireCostPw('vendors'); }
    else if (tab !== 'settlement' && tab !== 'vendors') setTabUnlocked(null);
  }, [tab]);

  const statusBadge = { active: 'badge-active', change: 'badge-change', closed: 'badge-closed' };

  const handleStatusChange = async (status) => {
    await db.from('projects').update({ status }).eq('id', project.id);
    setProject(p => ({ ...p, status }));
    toast('專案狀態已更新');
  };

  const doUnlock = async () => {
    const { data } = await db.from('users').select('*').eq('username', user.username).eq('password', unlockPw).single();
    if (!data) return toast('密碼錯誤', 'error');
    await db.from('projects').update({ is_locked: false }).eq('id', project.id);
    setProject(p => ({ ...p, is_locked: false }));
    setShowUnlock(false); setUnlockPw('');
    toast('已解除鎖定');
  };

  const renderTab = () => {
    switch (tab) {
      case 'summary':   return <ProjectSummaryTab project={project} onUpdate={setProject} showCost={showCost} />;
      case 'flow':      return <ProjectFlowTab project={project} />;
      case 'work':      return <WorkDetailTab project={project} onLock={() => setProject(p => ({ ...p, is_locked: true }))} showCost={showCost} />;
      case 'change':    return <ChangeOrdersTab project={project} />;
      case 'purchase':  return <PurchaseDetailTab project={project} />;
      case 'schedule':  return <ScheduleTab project={project} />;
      case 'sitelog':   return <SiteLogTab project={project} />;
      case 'meeting':   return <MeetingRecordTab project={project} />;
      case 'todos':     return <TodosTab project={project} />;
      case 'gallery':   return <GalleryTab project={project} />;
      case 'payment':    return <PaymentTab project={project} />;
      case 'settlement': return tabUnlocked === 'settlement' ? <SettlementTab project={project} showCost={showCost} /> : null;
      case 'templates': return <TemplatesTab showCost={showCost} />;
      case 'vendors':   if (user.role !== 'admin') return null; return tabUnlocked === 'vendors' ? <VendorsTab project={project} /> : null;

      default: return null;
    }
  };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: '100%', overflow: 'hidden' }}>
      <div style={{ padding: '10px 20px', background: '#fff', borderBottom: '1px solid #E8E8E6', display: 'flex', alignItems: 'center', gap: 12, flexShrink: 0 }}>
        <button className="hamburger" style={{ color: '#333' }} onClick={onOpenSidebar}><span style={{ background:'#333' }}/><span style={{ background:'#333' }}/><span style={{ background:'#333' }}/></button>
        <div style={{ fontWeight: 700, fontSize: 15 }}>{project.name}</div>
        <div style={{ fontSize: 12, color: '#888' }}>{project.client_name}</div>
        <select className={`badge ${statusBadge[project.status]}`} value={project.status} onChange={e => handleStatusChange(e.target.value)}
          style={{ cursor: 'pointer', border: 'none', background: 'transparent', fontWeight: 600, fontSize: 11 }}>
          <option value="active">進行中</option>
          <option value="change">客變</option>
          <option value="closed">結案</option>
        </select>
        {project.is_locked && (
          <div className="flex items-center gap-2">
            <span className="tag" style={{ background: '#E0E0E0', color: '#444', fontSize: 11 }}>第一版已鎖定</span>
            <button className="btn btn-xs" style={{ background: '#E0E0E0', color: '#444', border: '1px solid #CCC', borderRadius: 4 }}
              onClick={() => setShowUnlock(true)}>解除鎖定</button>
          </div>
        )}
        <button className="btn btn-ghost btn-sm" onClick={() => setShowMembers(true)}>成員權限</button>
        <label style={{ display:'flex', alignItems:'center', gap:5, cursor:'pointer', fontSize:12, color:'#666', border:'1px solid #DDD', borderRadius:6, padding:'4px 10px', background: showCost ? '#F2F0EC' : '#fff', userSelect:'none' }}>
          <input type="checkbox" checked={showCost} onChange={e => {
            if (e.target.checked) {
              if (e.target.checked) requireCostPw('cost');
              else setShowCost(false);
            } else { setShowCost(false); }
          }} style={{ accentColor:'#2E4D5C' }} />
          *
        </label>
        <button className="btn btn-ghost btn-sm" style={{ marginLeft: 'auto' }} onClick={() => setShowPrint(true)}>列印 / 存 PDF</button>
      </div>

      {/* Content */}
      <div style={{ flex: 1, overflowY: 'auto', padding: '24px', background: '#F5F5F3' }}>
        {renderTab()}
      </div>

      <PrintModal open={showPrint} onClose={() => setShowPrint(false)} project={project} />
      <ProjectMembersModal open={showMembers} onClose={() => setShowMembers(false)} project={project} />

      <Modal open={showCostPw} title="請輸入密碼" onClose={() => setShowCostPw(false)}
        footer={<><button className="btn btn-ghost" onClick={() => setShowCostPw(false)}>取消</button><button className="btn btn-primary" onClick={verifyCostPw}>確認</button></>}>
        <div style={{ fontSize:13, color:'#666', marginBottom:12 }}>此功能需要驗證身份</div>
        <input className="form-input" type="password" value={costPwInput} onChange={e => setCostPwInput(e.target.value)}
          onKeyDown={e => e.key === 'Enter' && verifyCostPw()}
          placeholder="請輸入您的登入密碼" autoFocus />
      </Modal>

      <Modal open={showUnlock} title="解除第一版鎖定" onClose={() => { setShowUnlock(false); setUnlockPw(''); }}
        footer={<><button className="btn btn-ghost" onClick={() => { setShowUnlock(false); setUnlockPw(''); }}>取消</button><button className="btn btn-danger" onClick={doUnlock}>確認解除</button></>}>
        <div style={{ fontSize: 13, marginBottom: 12, color: '#666', lineHeight: 1.8 }}>
          解除鎖定後，工程明細的變動將不再記錄於追加追減。<br/>請輸入您的登入密碼確認。
        </div>
        <div className="form-group"><label className="form-label">登入密碼</label>
          <input className="form-input" type="password" value={unlockPw} onChange={e => setUnlockPw(e.target.value)}
            onKeyDown={e => e.key === 'Enter' && doUnlock()} placeholder="請輸入密碼" /></div>
      </Modal>
    </div>
  );
}

function MobileTodosPage({ user }) {
  const [todos, setTodos] = useState([]);
  const [projects, setProjects] = useState([]);
  const [newText, setNewText] = useState({ general: '', site: '', purchase: '' });
  const [newProj, setNewProj] = useState({ general: '', site: '', purchase: '' });

  const load = useCallback(async () => {
    const [{ data: t }, { data: p }] = await Promise.all([
      db.from('todos').select('*').eq('is_done', false).order('created_at', { ascending: false }),
      db.from('projects').select('id, name').order('name'),
    ]);
    setTodos(t || []);
    setProjects(p || []);
  }, []);

  useEffect(() => { load(); }, [load]);

  const toggleDone = async (id) => {
    await db.from('todos').update({ is_done: true }).eq('id', id);
    setTodos(prev => prev.filter(t => t.id !== id));
  };

  const deleteTodo = async (id) => {
    await db.from('todos').delete().eq('id', id);
    setTodos(prev => prev.filter(t => t.id !== id));
  };

  const addTodo = async (type) => {
    const text = newText[type].trim();
    if (!text) return;
    await db.from('todos').insert({ content: text, todo_type: type, project_id: newProj[type] || null });
    setNewText(p => ({ ...p, [type]: '' }));
    load();
  };

  const projName = (id) => projects.find(p => p.id === id)?.name;

  const cols = [
    { key: 'general',  label: '一般待辦',  placeholder: '新增一般待辦...' },
    { key: 'site',     label: '現場待辦',  placeholder: '新增現場待辦...' },
    { key: 'purchase', label: '待採購',    placeholder: '新增採購項目...' },
  ];

  return (
    <div style={{ padding: 12, display: 'flex', flexDirection: 'column', gap: 16 }}>
      {cols.map(col => {
        const colTodos = todos.filter(t => t.todo_type === col.key);
        return (
          <div key={col.key} style={{ background: '#fff', borderRadius: 8, border: '1px solid #E0E0E0', boxShadow: '0 2px 8px rgba(0,0,0,0.08)', overflow: 'hidden' }}>
            <div style={{ background: '#D8D8D8', padding: '8px 14px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
              <span style={{ fontWeight: 700, fontSize: 13, color: '#222' }}>{col.label}</span>
              <span style={{ fontSize: 11, color: '#666' }}>{colTodos.length} 筆</span>
            </div>
            <div>
              {colTodos.map(todo => (
                <div key={todo.id} style={{ display: 'flex', gap: 10, padding: '11px 14px', borderBottom: '1px solid #F0F0F0', alignItems: 'flex-start' }}>
                  <input type="checkbox" checked={false} onChange={() => toggleDone(todo.id)}
                    style={{ width: 18, height: 18, marginTop: 2, accentColor: '#333', flexShrink: 0, cursor: 'pointer' }} />
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 14, color: '#1A1A1A', lineHeight: 1.5 }}>{todo.content}</div>
                    {todo.project_id && <div style={{ fontSize: 11, color: '#999', marginTop: 2 }}>{projName(todo.project_id)}</div>}
                  </div>
                  <button onClick={() => deleteTodo(todo.id)}
                    style={{ background: 'none', border: 'none', color: '#CCC', fontSize: 16, cursor: 'pointer', flexShrink: 0, padding: '0 2px' }}>✕</button>
                </div>
              ))}
              {colTodos.length === 0 && (
                <div style={{ padding: '14px', textAlign: 'center', color: '#CCC', fontSize: 12 }}>沒有待辦事項</div>
              )}
            </div>
            <div style={{ padding: '8px 10px', borderTop: '1px solid #F0F0F0', background: '#FAFAFA', display: 'flex', flexDirection: 'column', gap: 6 }}>
              <select value={newProj[col.key]} onChange={e => setNewProj(p => ({ ...p, [col.key]: e.target.value }))}
                style={{ width: '100%', border: '1px solid #D8D8D8', borderRadius: 6, padding: '6px 8px', fontSize: 12, background: '#fff', color: newProj[col.key] ? '#333' : '#AAA' }}>
                <option value="">不指定專案</option>
                {projects.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
              </select>
              <div style={{ display: 'flex', gap: 6 }}>
                <input value={newText[col.key]} onChange={e => setNewText(p => ({ ...p, [col.key]: e.target.value }))}
                  onKeyDown={e => e.key === 'Enter' && addTodo(col.key)}
                  placeholder={col.placeholder}
                  style={{ flex: 1, border: '1px solid #D8D8D8', borderRadius: 6, padding: '7px 10px', fontSize: 13, outline: 'none', background: '#fff' }} />
                <button onClick={() => addTodo(col.key)}
                  style={{ background: '#333', color: '#fff', border: 'none', borderRadius: 6, padding: '0 14px', fontSize: 13, cursor: 'pointer', flexShrink: 0 }}>＋</button>
              </div>
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ─────────────────────────────────────────
// MOBILE FIELD CHANGE PAGE（現場調整記錄）
// ─────────────────────────────────────────
function MobileFieldChangePage({ user }) {
  const [projects, setProjects] = useState([]);
  const [selProj, setSelProj] = useState('');
  const [records, setRecords] = useState([]);
  const [showAdd, setShowAdd] = useState(false);
  const [form, setForm] = useState({ item_name: '', category_name: '追加工序', amount: '', sign: '+', notes: '' });
  const [formImgs, setFormImgs] = useState([]);
  const [uploading, setUploading] = useState(false);

  useEffect(() => {
    db.from('projects').select('id, name').in('status', ['active', 'change']).order('name')
      .then(r => {
        const ps = r.data || [];
        setProjects(ps);
        if (ps.length) setSelProj(ps[0].id);
      });
  }, []);

  const load = useCallback(async () => {
    if (!selProj) return;
    const { data } = await db.from('change_orders').select('*')
      .eq('project_id', selProj)
      .in('category_name', ['追加工序', '材料採購'])
      .order('created_at', { ascending: false });
    setRecords(data || []);
  }, [selProj]);

  useEffect(() => { load(); }, [load]);

  const uploadFormImg = async (file) => {
    setUploading(true);
    try {
      const url = await uploadToStorage(file, `field_changes/${selProj}`);
      setFormImgs(p => [...p, url]);
    } catch(e) { toast('上傳失敗', 'error'); }
    setUploading(false);
  };

  const [editId, setEditId] = useState(null);
  const [editForm, setEditForm] = useState({});
  const [editImgs, setEditImgs] = useState([]);

  const startEdit = (r) => {
    const imgs = getImgs(r);
    const noteText = getNotes(r);
    setEditId(r.id);
    setEditForm({
      item_name: r.item_name || '',
      category_name: r.category_name || '追加工序',
      amount: String(Math.abs(r.new_price || 0)),
      sign: r.change_type === 'reduce' ? '-' : '+',
      notes: noteText,
    });
    setEditImgs(imgs);
  };

  const saveEdit = async () => {
    if (!editForm.item_name.trim() || !editForm.amount) return toast('請填寫項目名稱和金額', 'error');
    const amt = parseFloat(editForm.amount) || 0;
    const isAdd = editForm.sign === '+';
    const notesWithImgs = editImgs.length
      ? (editForm.notes ? editForm.notes + '\n' : '') + '__imgs__' + JSON.stringify(editImgs)
      : editForm.notes;
    await db.from('change_orders').update({
      category_name: editForm.category_name,
      item_name: editForm.item_name.trim(),
      change_type: isAdd ? 'add' : 'reduce',
      new_price: amt,
      notes: notesWithImgs,
    }).eq('id', editId);
    setEditId(null);
    toast('已更新');
    load();
  };

  const uploadEditImg = async (file) => {
    setUploading(true);
    try {
      const url = await uploadToStorage(file, `field_changes/${selProj}`);
      setEditImgs(p => [...p, url]);
    } catch(e) { toast('上傳失敗', 'error'); }
    setUploading(false);
  };

  const addRecord = async () => {
    if (!form.item_name.trim() || !form.amount) return toast('請填寫項目名稱和金額', 'error');
    const amt = parseFloat(form.amount) || 0;
    const isAdd = form.sign === '+';
    const notesWithImgs = formImgs.length
      ? (form.notes ? form.notes + '\n' : '') + '__imgs__' + JSON.stringify(formImgs)
      : form.notes;
    await db.from('change_orders').insert({
      project_id: selProj,
      category_name: form.category_name,
      item_name: form.item_name.trim(),
      change_type: isAdd ? 'add' : 'reduce',
      new_quantity: 1,
      new_price: amt,
      original_quantity: 0,
      original_price: 0,
      notes: notesWithImgs,
    });
    toast('已記錄');
    setForm({ item_name: '', category_name: form.category_name, amount: '', sign: form.sign, notes: '' });
    setFormImgs([]);
    setShowAdd(false);
    load();
  };

  const deleteRecord = async (id) => {
    if (!confirm('確認刪除？')) return;
    await db.from('change_orders').delete().eq('id', id);
    load();
  };

  const getAmt = (r) => {
    const amt = (r.new_price || 0) * (r.new_quantity || 1) - (r.original_price || 0) * (r.original_quantity || 0);
    return r.change_type === 'reduce' ? -Math.abs(amt) : amt;
  };

  const getImgs = (r) => {
    const notes = r.notes || '';
    const marker = notes.indexOf('__imgs__');
    if (marker === -1) return [];
    try { return JSON.parse(notes.slice(marker + 8)); } catch { return []; }
  };

  const getNotes = (r) => {
    const notes = r.notes || '';
    const marker = notes.indexOf('__imgs__');
    return marker === -1 ? notes : notes.slice(0, marker).trim();
  };

  const total = records.reduce((s, r) => s + getAmt(r), 0);
  const catGroups = ['追加工序', '材料採購'];
  const catColor = { '追加工序': '#2E4D5C', '材料採購': '#6B4835' };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: '100%' }}>
      {/* Project selector + total */}
      <div style={{ padding: '10px 12px', background: '#fff', borderBottom: '1px solid #E0E0E0' }}>
        <div style={{ display: 'flex', gap: 8, alignItems: 'center', marginBottom: 8 }}>
          <span style={{ fontSize: 12, color: '#666', flexShrink: 0 }}>專案：</span>
          <select value={selProj} onChange={e => setSelProj(e.target.value)}
            style={{ flex: 1, border: '1px solid #D8D8D8', borderRadius: 6, padding: '6px 8px', fontSize: 13, background: '#F5F5F5' }}>
            {projects.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
          </select>
        </div>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <span style={{ fontSize: 12, color: '#888' }}>本次現場調整合計</span>
          <span style={{ fontSize: 16, fontWeight: 700, color: total >= 0 ? '#2E4D5C' : '#8B2E2E' }}>
            {total >= 0 ? '+' : ''}{fmt(total)}
          </span>
        </div>
      </div>

      {/* Records */}
      <div style={{ flex: 1, overflowY: 'auto', padding: 12, display: 'flex', flexDirection: 'column', gap: 12 }}>
        {catGroups.map(cat => {
          const catRecords = records.filter(r => r.category_name === cat);
          if (catRecords.length === 0) return null;
          const catTotal = catRecords.reduce((s, r) => s + getAmt(r), 0);
          return (
            <div key={cat} style={{ background: '#fff', borderRadius: 8, border: '1px solid #E0E0E0', boxShadow: '0 2px 8px rgba(0,0,0,0.08)', overflow: 'hidden' }}>
              <div style={{ background: '#D8D8D8', padding: '8px 14px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                <span style={{ fontWeight: 700, fontSize: 13, color: '#222' }}>{cat}</span>
                <span style={{ fontSize: 12, fontWeight: 600, color: catColor[cat] }}>{catTotal >= 0 ? '+' : ''}{fmt(catTotal)}</span>
              </div>
              {catRecords.map(r => {
                const amt = getAmt(r);
                const imgs = getImgs(r);
                const noteText = getNotes(r);
                if (editId === r.id) return (
                  <div key={r.id} style={{ padding: '12px 14px', borderBottom: '1px solid #F0F0F0', background: '#FAFAFA', display: 'flex', flexDirection: 'column', gap: 8 }}>
                    <div style={{ display: 'flex', gap: 6 }}>
                      {catGroups.map(c => (
                        <button key={c} onClick={() => setEditForm(p => ({ ...p, category_name: c }))} style={{
                          flex: 1, padding: '5px 4px', borderRadius: 6, fontSize: 11, cursor: 'pointer', border: '1px solid #D8D8D8',
                          background: editForm.category_name === c ? '#333' : '#F5F5F5',
                          color: editForm.category_name === c ? '#fff' : '#555', fontWeight: editForm.category_name === c ? 700 : 400
                        }}>{c}</button>
                      ))}
                    </div>
                    <input value={editForm.item_name} onChange={e => setEditForm(p => ({ ...p, item_name: e.target.value }))}
                      style={{ border: '1px solid #D8D8D8', borderRadius: 6, padding: '7px 10px', fontSize: 13, outline: 'none' }} />
                    <div style={{ display: 'flex', gap: 6 }}>
                      <button onClick={() => setEditForm(p => ({ ...p, sign: p.sign === '+' ? '-' : '+' }))} style={{
                        width: 44, flexShrink: 0, border: '1px solid #D8D8D8', borderRadius: 6, fontSize: 18, fontWeight: 700,
                        background: editForm.sign === '+' ? '#EDF2F7' : '#FFF0F0',
                        color: editForm.sign === '+' ? '#2E4D5C' : '#8B2E2E', cursor: 'pointer'
                      }}>{editForm.sign}</button>
                      <input type="number" value={editForm.amount} onChange={e => setEditForm(p => ({ ...p, amount: e.target.value }))}
                        style={{ flex: 1, border: '1px solid #D8D8D8', borderRadius: 6, padding: '7px 10px', fontSize: 14, outline: 'none' }} />
                    </div>
                    <input value={editForm.notes} onChange={e => setEditForm(p => ({ ...p, notes: e.target.value }))}
                      placeholder="備註" style={{ border: '1px solid #D8D8D8', borderRadius: 6, padding: '6px 10px', fontSize: 12, outline: 'none', color: '#888' }} />
                    <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
                      {editImgs.map((url, i) => (
                        <div key={i} style={{ position: 'relative' }}>
                          <img src={url} alt="" style={{ width: 64, height: 64, objectFit: 'cover', borderRadius: 6, border: '1px solid #E0E0E0' }} />
                          <button onClick={() => setEditImgs(p => p.filter((_, j) => j !== i))}
                            style={{ position: 'absolute', top: 2, right: 2, background: 'rgba(0,0,0,0.5)', color: '#fff', border: 'none', borderRadius: '50%', width: 16, height: 16, fontSize: 10, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>✕</button>
                        </div>
                      ))}
                      <label style={{ width: 64, height: 64, border: '1.5px dashed #CCC', borderRadius: 6, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', background: '#F5F5F5', fontSize: 10, color: '#AAA' }}>
                        {uploading ? '...' : <><span style={{ fontSize: 18 }}>＋</span><span>照片</span></>}
                        <input type="file" accept="image/*" multiple style={{ display: 'none' }}
                          onChange={async e => { for (const f of e.target.files) await uploadEditImg(f); e.target.value = ''; }} />
                      </label>
                    </div>
                    <div style={{ display: 'flex', gap: 8 }}>
                      <button className="btn btn-primary btn-sm" style={{ flex: 1 }} onClick={saveEdit}>儲存</button>
                      <button className="btn btn-ghost btn-sm" onClick={() => setEditId(null)}>取消</button>
                    </div>
                  </div>
                );
                return (
                  <div key={r.id} style={{ padding: '11px 14px', borderBottom: '1px solid #F0F0F0' }}>
                    <div style={{ display: 'flex', gap: 10, alignItems: 'flex-start' }}>
                      <div style={{ flex: 1, minWidth: 0 }}>
                        <div style={{ fontSize: 14, color: '#1A1A1A', lineHeight: 1.5 }}>{r.item_name}</div>
                        {noteText ? <div style={{ fontSize: 11, color: '#999', marginTop: 2 }}>{noteText}</div> : null}
                        <div style={{ fontSize: 11, color: '#BBB', marginTop: 2 }}>{(r.created_at || '').slice(0, 10)}</div>
                      </div>
                      <div style={{ textAlign: 'right', flexShrink: 0 }}>
                        <div style={{ fontSize: 15, fontWeight: 700, color: amt >= 0 ? '#2E4D5C' : '#8B2E2E' }}>
                          {amt >= 0 ? '+' : ''}{fmt(amt)}
                        </div>
                        <div style={{ display: 'flex', gap: 8, marginTop: 4, justifyContent: 'flex-end' }}>
                          <button onClick={() => startEdit(r)}
                            style={{ background: 'none', border: 'none', color: '#555', fontSize: 12, cursor: 'pointer' }}>修改</button>
                          <button onClick={() => deleteRecord(r.id)}
                            style={{ background: 'none', border: 'none', color: '#CCC', fontSize: 12, cursor: 'pointer' }}>刪除</button>
                        </div>
                      </div>
                    </div>
                    {imgs.length > 0 && (
                      <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginTop: 8 }}>
                        {imgs.map((url, i) => (
                          <img key={i} src={url} alt="" style={{ width: 72, height: 72, objectFit: 'cover', borderRadius: 6, border: '1px solid #E0E0E0', cursor: 'pointer' }}
                            onClick={() => window.open(url, '_blank')} />
                        ))}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          );
        })}
        {records.length === 0 && (
          <div style={{ textAlign: 'center', padding: '60px 0', color: '#CCC', fontSize: 13 }}>尚無現場調整記錄</div>
        )}
      </div>

      {/* Add form */}
      <div style={{ padding: '10px 12px', background: '#fff', borderTop: '1px solid #E0E0E0' }}>
        {showAdd ? (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
            <div style={{ display: 'flex', gap: 6 }}>
              {catGroups.map(c => (
                <button key={c} onClick={() => setForm(p => ({ ...p, category_name: c }))} style={{
                  flex: 1, padding: '7px 4px', borderRadius: 6, fontSize: 12, cursor: 'pointer',
                  border: '1px solid #D8D8D8',
                  background: form.category_name === c ? '#333' : '#F5F5F5',
                  color: form.category_name === c ? '#fff' : '#555', fontWeight: form.category_name === c ? 700 : 400
                }}>{c}</button>
              ))}
            </div>
            <input value={form.item_name} onChange={e => setForm(p => ({ ...p, item_name: e.target.value }))}
              placeholder="項目描述（例：追加隔間牆拆除）"
              style={{ border: '1px solid #D8D8D8', borderRadius: 6, padding: '8px 10px', fontSize: 13, outline: 'none' }} />
            <div style={{ display: 'flex', gap: 6 }}>
              <button onClick={() => setForm(p => ({ ...p, sign: p.sign === '+' ? '-' : '+' }))} style={{
                width: 44, flexShrink: 0, border: '1px solid #D8D8D8', borderRadius: 6, fontSize: 18, fontWeight: 700,
                background: form.sign === '+' ? '#EDF2F7' : '#FFF0F0',
                color: form.sign === '+' ? '#2E4D5C' : '#8B2E2E', cursor: 'pointer'
              }}>{form.sign}</button>
              <input type="number" value={form.amount} onChange={e => setForm(p => ({ ...p, amount: e.target.value }))}
                placeholder="金額"
                style={{ flex: 1, border: '1px solid #D8D8D8', borderRadius: 6, padding: '8px 10px', fontSize: 14, outline: 'none' }} />
            </div>
            <input value={form.notes} onChange={e => setForm(p => ({ ...p, notes: e.target.value }))}
              placeholder="備註（選填）"
              style={{ border: '1px solid #D8D8D8', borderRadius: 6, padding: '7px 10px', fontSize: 12, outline: 'none', color: '#888' }} />
            {/* Photo upload */}
            <div>
              <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginBottom: formImgs.length ? 8 : 0 }}>
                {formImgs.map((url, i) => (
                  <div key={i} style={{ position: 'relative' }}>
                    <img src={url} alt="" style={{ width: 72, height: 72, objectFit: 'cover', borderRadius: 6, border: '1px solid #E0E0E0' }} />
                    <button onClick={() => setFormImgs(p => p.filter((_, j) => j !== i))}
                      style={{ position: 'absolute', top: 2, right: 2, background: 'rgba(0,0,0,0.5)', color: '#fff', border: 'none', borderRadius: '50%', width: 18, height: 18, fontSize: 11, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>✕</button>
                  </div>
                ))}
                <label style={{ width: 72, height: 72, border: '1.5px dashed #CCC', borderRadius: 6, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', background: '#FAFAFA', fontSize: 11, color: '#AAA', gap: 2 }}>
                  {uploading ? '上傳中' : <><span style={{ fontSize: 20 }}>＋</span><span>照片</span></>}
                  <input type="file" accept="image/*" multiple style={{ display: 'none' }}
                    onChange={async e => { for (const f of e.target.files) await uploadFormImg(f); e.target.value = ''; }} />
                </label>
              </div>
            </div>
            <div style={{ display: 'flex', gap: 8 }}>
              <button className="btn btn-primary" style={{ flex: 1 }} onClick={addRecord}>記錄</button>
              <button className="btn btn-ghost" onClick={() => { setShowAdd(false); setFormImgs([]); }}>取消</button>
            </div>
          </div>
        ) : (
          <button onClick={() => setShowAdd(true)} style={{
            width: '100%', padding: '12px', border: '1.5px dashed #CCC', borderRadius: 8,
            background: 'transparent', color: '#888', fontSize: 14, cursor: 'pointer', textAlign: 'center'
          }}>＋ 記錄現場調整</button>
        )}
      </div>
    </div>
  );
}

function MobileSiteLogPage({ user }) {
  const [projects, setProjects] = useState([]);
  const [selProj, setSelProj] = useState('');
  const [logs, setLogs] = useState([]);
  const [showAdd, setShowAdd] = useState(false);
  const [form, setForm] = useState({ log_date: today(), weather: '晴天', workers: '', content: '' });
  const [newImgs, setNewImgs] = useState([]);
  const [newImgUploading, setNewImgUploading] = useState(false);
  const [uploading, setUploading] = useState({});
  const [selected, setSelected] = useState(new Set());
  const [expanded, setExpanded] = useState(new Set());
  const weatherOpts = ['晴天', '多雲', '陰天', '下雨', '颱風'];

  const uploadNewImg = async (file) => {
    setNewImgUploading(true);
    try {
      const url = await uploadToStorage(file, `site_logs/${selProj}`);
      setNewImgs(p => [...p, url]);
    } catch(e) { toast('上傳失敗', 'error'); }
    setNewImgUploading(false);
  };

  useEffect(() => {
    db.from('projects').select('id, name').in('status', ['active', 'change']).order('name')
      .then(r => {
        const ps = r.data || [];
        setProjects(ps);
        if (ps.length) setSelProj(ps[0].id);
      });
  }, []);

  const load = useCallback(async () => {
    if (!selProj) return;
    const { data } = await db.from('site_logs').select('*').eq('project_id', selProj).order('created_at', { ascending: false });
    setLogs(data || []);
    setSelected(new Set());
  }, [selProj]);

  useEffect(() => { load(); }, [load]);

  const toggleSelect = (id) => setSelected(prev => {
    const next = new Set(prev);
    next.has(id) ? next.delete(id) : next.add(id);
    return next;
  });

  const addSelectedToTodos = async () => {
    const selectedLogs = logs.filter(l => selected.has(l.id));
    await Promise.all(selectedLogs.map(l =>
      db.from('todos').insert({
        project_id: selProj,
        content: l.content || `${l.log_date} 施工日誌`,
        todo_type: 'site',
        source: 'site_log'
      })
    ));
    setSelected(new Set());
    toast(`已將 ${selectedLogs.length} 筆轉入現場待辦`);
  };

  const addLog = async () => {
    if (!selProj) return toast('請先選擇專案', 'error');
    const { addToTodo, addToChange, changeCategory, changeSign, changeAmount, ...logData } = form;
    const imageUrl = newImgs.length ? JSON.stringify(newImgs) : null;
    await db.from('site_logs').insert({ ...logData, project_id: selProj, ...(imageUrl ? { image_url: imageUrl } : {}) });
    const msgs = ['已新增日誌'];
    if (addToTodo && logData.content.trim()) {
      await db.from('todos').insert({ project_id: selProj, content: logData.content.trim(), todo_type: 'site', source: 'site_log' });
      msgs.push('加入待辦');
    }
    if (addToChange && changeAmount) {
      const amt = parseFloat(changeAmount) || 0;
      const isAdd = (changeSign || '+') === '+';
      const notesBase = `來自施工日誌 ${logData.log_date}`;
      const notesWithImgs = newImgs.length ? notesBase + '\n__imgs__' + JSON.stringify(newImgs) : notesBase;
      await db.from('change_orders').insert({
        project_id: selProj,
        category_name: changeCategory || '追加工序',
        item_name: logData.content.trim() || `${logData.log_date} 現場調整`,
        change_type: isAdd ? 'add' : 'reduce',
        new_quantity: 1, new_price: amt,
        original_quantity: 0, original_price: 0,
        notes: notesWithImgs,
      });
      msgs.push('加入現場調整');
    }
    toast(msgs.join('、'));
    setShowAdd(false);
    setNewImgs([]);
    setForm({ log_date: today(), weather: '晴天', workers: '', content: '', addToTodo: false, addToChange: false, changeCategory: '追加工序', changeSign: '+', changeAmount: '' });
    load();
  };

  const updateLog = async (id, field, val) => {
    await db.from('site_logs').update({ [field]: val }).eq('id', id);
    setLogs(prev => prev.map(l => l.id === id ? { ...l, [field]: val } : l));
  };

  const deleteLog = async (id) => {
    if (!confirm('確認刪除此日誌？')) return;
    await db.from('site_logs').delete().eq('id', id);
    load();
  };

  const getImages = (log) => {
    const raw = log?.image_url || '';
    if (!raw) return [];
    try { const a = JSON.parse(raw); return Array.isArray(a) ? a : [raw]; } catch { return [raw]; }
  };

  const uploadImg = async (logId, file) => {
    setUploading(p => ({ ...p, [logId]: true }));
    try {
      const url = await uploadToStorage(file, `site_logs/${selProj}`);
      const { data: cur } = await db.from('site_logs').select('image_url').eq('id', logId).single();
      const existing = getImages(cur);
      const newList = JSON.stringify([...existing, url]);
      await db.from('site_logs').update({ image_url: newList }).eq('id', logId);
      await load();
      toast('已上傳');
    } catch(e) { toast('上傳失敗: ' + e.message, 'error'); }
    setUploading(p => ({ ...p, [logId]: false }));
  };

  const removeImage = async (logId, idx) => {
    const { data: cur } = await db.from('site_logs').select('image_url').eq('id', logId).single();
    const imgs = getImages(cur).filter((_, i) => i !== idx);
    await db.from('site_logs').update({ image_url: imgs.length ? JSON.stringify(imgs) : '' }).eq('id', logId);
    setLogs(prev => prev.map(l => l.id === logId ? { ...l, image_url: imgs.length ? JSON.stringify(imgs) : '' } : l));
  };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: '100%' }}>
      {/* Project selector */}
      <div style={{ padding: '10px 12px', background: '#fff', borderBottom: '1px solid #E0E0E0', display: 'flex', gap: 8, alignItems: 'center' }}>

function SetupPage({ onDone }) {
  const [url, setUrl] = useState('');
  const [key, setKey] = useState('');
  const [testing, setTesting] = useState(false);

  const handleSave = async () => {
    if (!url.trim() || !key.trim()) return toast('請填入 Supabase URL 和 API Key', 'error');
    setTesting(true);
    try {
      const testClient = window.supabase.createClient(url.trim(), key.trim());
      const { error } = await testClient.from('users').select('id').limit(1);
      if (error) throw new Error(error.message);
      localStorage.setItem('sb_url', url.trim());
      localStorage.setItem('sb_key', key.trim());
      toast('連線成功！');
      setTimeout(() => { onDone(); window.location.reload(); }, 800);
    } catch(e) {
      toast('連線失敗：' + e.message, 'error');
    }
    setTesting(false);
  };

  return (
    <div style={{ minHeight: '100vh', background: '#F4F4F4', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24 }}>
      <div style={{ background: '#fff', borderRadius: 12, padding: '40px 36px', width: '100%', maxWidth: 480, boxShadow: '0 4px 24px rgba(0,0,0,0.12)' }}>
        <div style={{ textAlign: 'center', marginBottom: 28 }}>
          <div style={{ fontSize: 28, fontWeight: 700, letterSpacing: '0.1em', color: '#2E2E2E', marginBottom: 6 }}>無澀空間</div>
          <div style={{ fontSize: 14, color: '#888' }}>初次設定資料庫連線</div>
        </div>
        <div style={{ fontSize: 13, color: '#666', marginBottom: 20, lineHeight: 1.8, background: '#F8F8F8', borderRadius: 8, padding: '12px 14px' }}>
          請先到 <a href="https://supabase.com" target="_blank" rel="noopener noreferrer" style={{ color: '#2E4D5C' }}>supabase.com</a> 建立免費專案，執行 SQL 建立資料表後，填入以下資訊。
        </div>
        <div className="form-group">
          <label className="form-label">Supabase Project URL</label>
          <input className="form-input" value={url} onChange={e => setUrl(e.target.value)}
            placeholder="https://xxxxxxxx.supabase.co" style={{ fontFamily: 'monospace', fontSize: 12 }} />
        </div>
        <div className="form-group">
          <label className="form-label">Supabase Anon Key（publishable）</label>
          <input className="form-input" value={key} onChange={e => setKey(e.target.value)}
            placeholder="sb_publishable_..." style={{ fontFamily: 'monospace', fontSize: 12 }} />
        </div>
        <button className="btn btn-primary" style={{ width: '100%', marginTop: 8 }} onClick={handleSave} disabled={testing}>
          {testing ? '測試連線中...' : '儲存並連線'}
        </button>
        <div style={{ marginTop: 16, fontSize: 11, color: '#AAA', textAlign: 'center' }}>
          設定完成後只存在瀏覽器本機，不會傳送給任何第三方
        </div>
      </div>
    </div>
  );
}

/* ── 客戶報價單（無澀空間）── */
function generateClientQuote(project, cats, items) {
  var catTotal = function(cid) { return items.filter(function(i){return i.category_id===cid;}).reduce(function(s,i){return s+i.unit_price*i.quantity;},0); };
  var workTotal = cats.reduce(function(s,c){return s+catTotal(c.id);},0);
  var mgmtFee = Math.round(workTotal*((project.management_fee_rate||7)/100));
  var designFee = (project.area_sqm||0)*(project.design_fee_per_sqm||0);
  var tax = project.tax_enabled ? Math.round((workTotal+mgmtFee)*((project.tax_rate||5)/100)) : 0;
  var total = workTotal+mgmtFee+designFee+tax;
  var date = new Date().toLocaleDateString('zh-TW');

  var rows = '';
  cats.forEach(function(cat, ci) {
    var catItems = items.filter(function(i){return i.category_id===cat.id;});
    var t = catTotal(cat.id);
    var letter = String.fromCharCode(65+ci);
    rows += '<tr><td colspan="4" style="padding:12px 0 4px;border-top:'+(ci===0?'none':'1.5px solid #999')+';font-size:13px;font-weight:700">'+letter+'. '+cat.name+'</td></tr>';
