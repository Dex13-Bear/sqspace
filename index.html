// ─────────────────────────────────────────
// VENDORS TAB（廠商管理）
// ─────────────────────────────────────────
function VendorsTab({ project }) {
  const [vendors, setVendors] = useState([]);
  const [allSettlements, setAllSettlements] = useState([]); // ALL projects
  const [allProjects, setAllProjects] = useState([]);
  const [selected, setSelected] = useState(null);
  const [showAdd, setShowAdd] = useState(false);
  const [editId, setEditId] = useState(null);
  const emptyForm = { name: '', contact_person: '', phone: '', specialty: '', notes: '', bank_accounts: [] };
  const [form, setForm] = useState(emptyForm);
  const [search, setSearch] = useState('');

  const load = useCallback(async () => {
    const [{ data: v }, { data: s }, { data: p }] = await Promise.all([
      db.from('vendors').select('*').order('name'),
      db.from('vendor_settlements').select('*').order('created_at'),
      db.from('projects').select('id, name').order('name'),
    ]);
    setVendors(v || []);
    setAllSettlements(s || []);
    setAllProjects(p || []);
  }, []);

  useEffect(() => { load(); }, [load]);

  const getBankAccounts = (v) => {
    if (!v) return [];
    try {
      const raw = v.bank_accounts;
      if (Array.isArray(raw)) return raw;
      if (typeof raw === 'string') return JSON.parse(raw);
    } catch {}
    // Migrate old single bank fields
    if (v.bank_name || v.account_number) {
      return [{ bank_name: v.bank_name||'', account_number: v.account_number||'', account_holder: v.account_holder||'' }];
    }
    return [];
  };

  const saveVendor = async () => {
    if (!form.name.trim()) return toast('請填廠商名稱', 'error');
    const payload = {
      name: form.name.trim(),
      contact_person: form.contact_person,
      phone: form.phone,
      specialty: form.specialty,
      notes: form.notes,
      bank_accounts: JSON.stringify(form.bank_accounts || []),
    };
    if (editId) {
      await db.from('vendors').update(payload).eq('id', editId);
      if (selected?.id === editId) setSelected({ ...selected, ...payload, bank_accounts: form.bank_accounts });
    } else {
      await db.from('vendors').insert(payload);
    }
    setForm(emptyForm); setShowAdd(false); setEditId(null); toast('已儲存'); load();
  };

  const deleteVendor = async (id) => {
    if (!confirm('確認刪除此廠商？')) return;
    await db.from('vendors').delete().eq('id', id);
    if (selected?.id === id) setSelected(null);
    load();
  };

  const startEdit = (v) => {
    setEditId(v.id);
    setForm({ name: v.name||'', contact_person: v.contact_person||'', phone: v.phone||'', specialty: v.specialty||'', notes: v.notes||'', bank_accounts: getBankAccounts(v) });
    setShowAdd(true);
  };

  const addBankAccount = () => setForm(p => ({ ...p, bank_accounts: [...(p.bank_accounts||[]), { bank_name:'', account_number:'', account_holder:'' }] }));
  const updateBank = (idx, field, val) => setForm(p => { const b = [...(p.bank_accounts||[])]; b[idx] = { ...b[idx], [field]: val }; return { ...p, bank_accounts: b }; });
  const removeBank = (idx) => setForm(p => ({ ...p, bank_accounts: (p.bank_accounts||[]).filter((_,i) => i !== idx) }));

  const vendorSettlements = (vname) => allSettlements.filter(s => s.vendor_name === vname);
  const vendorTotal = (vname) => vendorSettlements(vname).reduce((s, r) => s + (r.actual_amount||0), 0);
  const vendorPaid = (vname) => vendorSettlements(vname).reduce((s, r) => s + (r.paid_amount||0), 0);
  const projName = (id) => allProjects.find(p => p.id === id)?.name || id;

  const filtered = vendors.filter(v => !search || v.name.includes(search) || (v.specialty||'').includes(search) || (v.phone||'').includes(search));

  // Drill-in view
  const drillInRecs = selected ? vendorSettlements(selected.name) : [];
  const drillInTotalAll = drillInRecs.reduce((s, r) => s + (r.actual_amount||0), 0);
  const drillInPaidAll = drillInRecs.reduce((s, r) => s + (r.paid_amount||0), 0);
  const drillInBanks = selected ? getBankAccounts(selected) : [];
  const byProject = {};
  drillInRecs.forEach(r => {
    const pid = r.project_id;
    if (!byProject[pid]) byProject[pid] = { name: projName(pid), recs: [], total: 0, paid: 0 };
    byProject[pid].recs.push(r);
    byProject[pid].total += r.actual_amount || 0;
    byProject[pid].paid += r.paid_amount || 0;
  });

  const drillIn = selected ? (
      <div>
        <div style={{ display:'flex', alignItems:'center', gap:12, marginBottom:20 }}>
          <button className="btn btn-ghost btn-sm" onClick={() => setSelected(null)}>← 返回</button>
          <div className="section-title">{selected.name}</div>
          <button className="btn btn-ghost btn-sm" style={{ marginLeft:'auto' }} onClick={() => startEdit(selected)}>編輯資料</button>
        </div>

        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:16, marginBottom:20 }}>
          {/* Basic */}
          <div className="card">
            <div className="card-header"><div className="card-title">基本資料</div></div>
            <div className="card-body" style={{ display:'flex', flexDirection:'column', gap:10 }}>
              {[{ label:'聯絡人', val: selected.contact_person }, { label:'電話', val: selected.phone }, { label:'專長工種', val: selected.specialty }, { label:'備註', val: selected.notes }]
                .filter(r => r.val).map(r => (
                  <div key={r.label} style={{ display:'flex', gap:12, fontSize:13 }}>
                    <span style={{ color:'#888', width:70, flexShrink:0 }}>{r.label}</span>
                    <span>{r.val}</span>
                  </div>
                ))}
            </div>
          </div>
          {/* Banks */}
          <div className="card">
            <div className="card-header"><div className="card-title">匯款資訊</div></div>
            <div className="card-body" style={{ display:'flex', flexDirection:'column', gap:14 }}>
              {drillInBanks.length === 0 && <div style={{ color:'#CCC', fontSize:12 }}>尚未填寫匯款資訊</div>}
              {drillInBanks.map((b, i) => (
                <div key={i} style={{ paddingBottom: i < drillInBanks.length-1 ? 12 : 0, borderBottom: i < drillInBanks.length-1 ? '1px solid #F0F0F0' : 'none' }}>
                  {drillInBanks.length > 1 && <div style={{ fontSize:11, color:'#888', marginBottom:4 }}>帳戶 {i+1}</div>}
                  {[{ label:'銀行', val: b.bank_name }, { label:'帳號', val: b.account_number }, { label:'戶名', val: b.account_holder }]
                    .filter(r => r.val).map(r => (
                      <div key={r.label} style={{ display:'flex', gap:12, fontSize:13, marginBottom:4 }}>
                        <span style={{ color:'#888', width:40, flexShrink:0 }}>{r.label}</span>
                        <span style={{ fontFamily: r.label==='帳號' ? 'monospace' : 'inherit', letterSpacing: r.label==='帳號' ? '0.05em' : 'normal' }}>{r.val}</span>
                      </div>
                    ))}
                </div>
              ))}
            </div>
          </div>
        </div>

        {/* All projects summary */}
        <div className="card">
          <div className="card-header">
            <div className="card-title">專案總覽</div>
            {totalAll > 0 && <div style={{ marginLeft:'auto', fontSize:12, color:'#666' }}>
              合計 <strong style={{ color:'#6B4835' }}>{fmt(totalAll)}</strong>　
              已付 <strong style={{ color:'#3A5240' }}>{fmt(paidAll)}</strong>
              {drillInTotalAll - drillInPaidAll > 0 && <>　<strong style={{ color:'#8B2E2E' }}>尚欠 {fmt(drillInTotalAll - drillInPaidAll)}</strong></>}
            </div>}
          </div>
          <div className="table-wrap">
            <table>
              <thead>
                <tr style={{ background:'#D8D8D8' }}>
                  <th>專案名稱</th>
                  <th className="num">金額</th>
                  <th className="num">已付金額</th>
                  <th>狀態</th>
                </tr>
              </thead>
              <tbody>
                {Object.values(byProject).map((pg, i) => {
                  const unpaid = pg.total - pg.paid;
                  return (
                    <tr key={i}>
                      <td style={{ fontWeight: pg.recs.some(r => r.project_id === project.id) ? 600 : 400 }}>
                        {pg.name}
                        {pg.recs.some(r => r.project_id === project.id) && <span style={{ fontSize:10, color:'#2E4D5C', marginLeft:6, background:'#EDF2F7', padding:'1px 6px', borderRadius:8 }}>本案</span>}
                      </td>
                      <td className="num" style={{ color:'#6B4835', fontWeight:600 }}>{fmt(pg.total)}</td>
                      <td className="num" style={{ color:'#3A5240' }}>{pg.paid > 0 ? fmt(pg.paid) : <span style={{ color:'#CCC' }}>–</span>}</td>
                      <td>
                        {unpaid <= 0 ? <span style={{ fontSize:11, background:'#E8F0EC', color:'#3A5240', padding:'2px 8px', borderRadius:10 }}>已付清</span>
                          : <span style={{ fontSize:11, color:'#8B2E2E' }}>欠 {fmt(unpaid)}</span>}
                      </td>
                    </tr>
                  );
                })}
                {Object.keys(byProject).length === 0 && <tr><td colSpan={4} style={{ textAlign:'center', color:'#CCC', padding:20, fontSize:12 }}>尚無任何專案的結算紀錄</td></tr>}
              </tbody>
              {Object.keys(byProject).length > 1 && (
                <tfoot>
                  <tr style={{ background:'#F5F5F5', fontWeight:700, borderTop:'2px solid #D0D0D0' }}>
                    <td style={{ padding:'7px 12px' }}>合計</td>
                    <td className="num" style={{ padding:'7px 12px', color:'#6B4835' }}>{fmt(totalAll)}</td>
                    <td className="num" style={{ padding:'7px 12px', color:'#3A5240' }}>{fmt(paidAll)}</td>
                    <td style={{ padding:'7px 12px', fontSize:12, color:'#8B2E2E' }}>{drillInTotalAll - drillInPaidAll > 0 ? '尚欠 ' + fmt(drillInTotalAll - drillInPaidAll) : ''}</td>
                  </tr>
                </tfoot>
              )}
            </table>
          </div>
        </div>
      </div>
  ) : null;

  // Overview list
  const mainContent = (
    <div>
      <div className="flex justify-between items-center mb-4">
        <div className="section-title">廠商管理</div>
        <div style={{ display:'flex', gap:8, alignItems:'center' }}>
          <input className="form-input form-input-sm" value={search} onChange={e => setSearch(e.target.value)}
            placeholder="搜尋廠商名稱、工種..." style={{ width:180 }} />
          <button className="btn btn-primary btn-sm" onClick={() => { setEditId(null); setForm(emptyForm); setShowAdd(true); }}>＋ 新增廠商</button>
        </div>
      </div>

      <div className="card">
        <div className="table-wrap">
          <table>
            <thead>
              <tr style={{ background:'#D8D8D8' }}>
                <th>廠商名稱</th>
                <th>聯絡人</th>
                <th>電話</th>
                <th>專長工種</th>
                <th className="num">累計費用（所有專案）</th>
                <th>付款狀態</th>
                <th style={{ width:100 }}>操作</th>
              </tr>
            </thead>
            <tbody>
              {filtered.map(v => {
                const total = vendorTotal(v.name);
                const paid = vendorPaid(v.name);
                const unpaid = total - paid;
                return (
                  <tr key={v.id} style={{ cursor:'pointer' }} onClick={() => setSelected(v)}>
                    <td style={{ fontWeight:600 }}>{v.name}</td>
                    <td style={{ fontSize:12, color:'#666' }}>{v.contact_person||'–'}</td>
                    <td style={{ fontSize:12, color:'#2E4D5C' }}>{v.phone||'–'}</td>
                    <td style={{ fontSize:12 }}>{v.specialty||'–'}</td>
                    <td className="num" style={{ color: total > 0 ? '#6B4835' : '#CCC', fontWeight: total > 0 ? 600 : 400 }}>{total > 0 ? fmt(total) : '–'}</td>
                    <td>
                      {total === 0 ? <span style={{ fontSize:11, color:'#CCC' }}>無記錄</span>
                        : unpaid <= 0 ? <span style={{ fontSize:11, background:'#E8F0EC', color:'#3A5240', padding:'2px 8px', borderRadius:10 }}>已付清</span>
                        : <span style={{ fontSize:11, color:'#8B2E2E' }}>欠 {fmt(unpaid)}</span>}
                    </td>
                    <td onClick={e => e.stopPropagation()}>
                      <div style={{ display:'flex', gap:6 }}>
                        <button className="btn btn-xs btn-ghost" onClick={() => startEdit(v)}>編輯</button>
                        <button className="btn btn-xs" style={{ background:'#FFF0F0', color:'#8B2E2E', border:'1px solid #EEC0C0' }} onClick={() => deleteVendor(v.id)}>刪除</button>
                      </div>
                    </td>
                  </tr>
                );
              })}
              {filtered.length === 0 && <tr><td colSpan={7} style={{ textAlign:'center', color:'#CCC', padding:24 }}>{vendors.length === 0 ? '尚無廠商，點「新增廠商」開始建立' : '查無符合的廠商'}</td></tr>}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );

  // Shared modal (rendered regardless of which view is active)
  const editModal = (
    <Modal open={showAdd} title={editId ? '編輯廠商資料' : '新增廠商'} onClose={() => { setShowAdd(false); setEditId(null); setForm(emptyForm); }}
      footer={<><button className="btn btn-ghost" onClick={() => { setShowAdd(false); setEditId(null); setForm(emptyForm); }}>取消</button><button className="btn btn-primary" onClick={saveVendor}>儲存</button></>}>
      <div className="grid-2">
        <div className="form-group"><label className="form-label">廠商名稱 *</label>
          <IMEInput className="form-input" value={form.name} onChange={val => setForm(p => ({ ...p, name: val }))} placeholder="例：王師傅木工" /></div>
        <div className="form-group"><label className="form-label">專長工種</label>
          <IMEInput className="form-input" value={form.specialty} onChange={val => setForm(p => ({ ...p, specialty: val }))} placeholder="例：木作、泥作" /></div>
      </div>
      <div className="grid-2">
        <div className="form-group"><label className="form-label">聯絡人</label>
          <IMEInput className="form-input" value={form.contact_person} onChange={val => setForm(p => ({ ...p, contact_person: val }))} /></div>
        <div className="form-group"><label className="form-label">電話</label>
          <input className="form-input" value={form.phone} onChange={e => setForm(p => ({ ...p, phone: e.target.value }))} placeholder="09xx-xxxxxx" /></div>
      </div>
      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', margin:'12px 0 8px', paddingTop:10, borderTop:'1px solid #F0F0F0' }}>
        <span style={{ fontSize:12, fontWeight:600, color:'#555' }}>匯款帳戶</span>
        <button type="button" className="btn btn-xs btn-ghost" onClick={addBankAccount}>＋ 新增帳戶</button>
      </div>
      {(form.bank_accounts||[]).length === 0 && <div style={{ fontSize:12, color:'#CCC', marginBottom:8 }}>尚未新增帳戶</div>}
      {(form.bank_accounts||[]).map((b, i) => (
        <div key={i} style={{ background:'#F8F8F8', borderRadius:6, padding:'10px 12px', marginBottom:8, border:'1px solid #E8E8E6' }}>
          <div style={{ display:'flex', justifyContent:'space-between', marginBottom:8 }}>
            <span style={{ fontSize:11, color:'#888' }}>帳戶 {i+1}</span>
            <button type="button" onClick={() => removeBank(i)} style={{ background:'none', border:'none', color:'#AAA', cursor:'pointer', fontSize:13 }}>✕</button>
          </div>
          <div className="grid-2" style={{ gap:8 }}>
            <div className="form-group"><label className="form-label">銀行名稱</label>
              <IMEInput className="form-input form-input-sm" value={b.bank_name||''} onChange={val => updateBank(i,'bank_name',val)} placeholder="例：台灣銀行" /></div>
            <div className="form-group"><label className="form-label">戶名</label>
              <IMEInput className="form-input form-input-sm" value={b.account_holder||''} onChange={val => updateBank(i,'account_holder',val)} /></div>
          </div>
          <div className="form-group"><label className="form-label">帳號</label>
            <input className="form-input form-input-sm" value={b.account_number||''} onChange={e => updateBank(i,'account_number',e.target.value)} style={{ fontFamily:'monospace', letterSpacing:'0.05em' }} /></div>
        </div>
      ))}
      <div className="form-group" style={{ marginTop:4 }}><label className="form-label">備註</label>
        <IMETextarea className="form-textarea" style={{ minHeight:60 }} value={form.notes} onChange={val => setForm(p => ({ ...p, notes: val }))} /></div>
    </Modal>
  );

  return <>{selected ? drillIn : mainContent}{editModal}</>;
}

function SettlementTab({ project, showCost }) {
  const [records, setRecords] = useState([]);
  const [workItems, setWorkItems] = useState([]);
  const [cats, setCats] = useState([]);
  const [selectedCat, setSelectedCat] = useState(null); // drill-in
  const [importText, setImportText] = useState('');
  const [importPreview, setImportPreview] = useState([]);
  const [showImport, setShowImport] = useState(false);
  const [vendors, setVendors] = useState([]);
;
  const [uploading, setUploading] = useState(false);
  const [payForm, setPayForm] = useState({});
  const [showPayModal, setShowPayModal] = useState(null);

  const load = useCallback(async () => {
    const [{ data: r }, { data: i }, { data: c }, { data: v }] = await Promise.all([
      db.from('vendor_settlements').select('*').eq('project_id', project.id).order('created_at'),
      db.from('work_items').select('*').eq('project_id', project.id),
      db.from('work_categories').select('*').eq('project_id', project.id).order('sort_order'),
      db.from('vendors').select('*').order('name'),
    ]);
    setRecords(r || []);
    setWorkItems(i || []);
    setCats(c || []);
    setVendors(v || []);
  }, [project.id]);

  useEffect(() => { load(); }, [load]);

  const quoted = workItems.filter(i => i.unit !== '__note__').reduce((s, i) => s + i.unit_price * i.quantity, 0);
  const totalVendor = records.reduce((s, r) => s + (r.actual_amount || 0), 0);
  const totalPaid = records.reduce((s, r) => s + (r.paid_amount || 0), 0);

  const catWorkItems = (catId) => workItems.filter(i => i.category_id === catId && i.unit !== '__note__');
  const catRecords = (catName) => records.filter(r => r.category_name === catName);

  const parseText = (text) => text.trim().split('\n').filter(l => l.trim()).map(line => {
    const parts = line.split(/\t|，|,/).map(s => s.trim());
    const num = s => parseFloat(String(s).replace(/[$,，\s]/g,'')) || 0;
    if (parts.length >= 4) return { vendor_name: parts[0], work_item: parts[1], unit: parts[2], quantity: num(parts[3]), actual_amount: parts.length >= 5 ? num(parts[4]) : 0 };
    if (parts.length === 3) return { vendor_name: '', work_item: parts[0], unit: parts[1], quantity: 1, actual_amount: num(parts[2]) };
    if (parts.length === 2) return { vendor_name: '', work_item: parts[0], unit: '', quantity: 1, actual_amount: num(parts[1]) };
    return { vendor_name: '', work_item: line.trim(), unit: '', quantity: 1, actual_amount: 0 };
  }).filter(r => r.work_item);

  const handleImportFile = async (file) => {
    try {
      const data = await file.arrayBuffer();
      const wb = XLSX.read(data, { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
      const headerIdx = rows.findIndex(r => r.some(c => String(c).match(/名稱|品項|項目|廠商|name/i)));
      const dataRows = headerIdx >= 0 ? rows.slice(headerIdx + 1) : rows;
      const num = v => parseFloat(String(v||0).replace(/[$,，]/g,'')) || 0;
      const parsed = dataRows.filter(r => r[0]).map(r => {
        if (r.length >= 5) return { vendor_name: String(r[0]), work_item: String(r[1]||''), unit: String(r[2]||''), quantity: num(r[3])||1, actual_amount: num(r[4]) };
        if (r.length >= 3) return { vendor_name: '', work_item: String(r[0]), unit: String(r[1]||''), quantity: 1, actual_amount: num(r[2]) };
        return { vendor_name: '', work_item: String(r[0]), unit: '', quantity: 1, actual_amount: num(r[1]) };
      });
      setImportPreview(parsed);
      toast(`解析出 ${parsed.length} 筆`);
    } catch(e) { toast('解析失敗：' + e.message, 'error'); }
  };

  const doImport = async () => {
    if (!importPreview.length || !selectedCat) return;
    await db.from('vendor_settlements').insert(importPreview.map(r => ({
      project_id: project.id, category_name: selectedCat.name,
      vendor_name: r.vendor_name || '', work_item: r.work_item || '',
      unit: r.unit || '', quantity: r.quantity || 1, actual_amount: r.actual_amount || 0,
      paid_amount: 0, is_paid: false,
    })));
    toast(`已匯入 ${importPreview.length} 筆`);
    setShowImport(false); setImportText(''); setImportPreview([]);
    load();
  };

  const addBlankRow = async () => {
    if (!selectedCat) return;
    await db.from('vendor_settlements').insert({ project_id: project.id, category_name: selectedCat.name, vendor_name: '', work_item: '', unit: '', quantity: 1, actual_amount: 0, paid_amount: 0, is_paid: false });
    load();
  };

  const updateRecord = async (id, field, val) => {
    await db.from('vendor_settlements').update({ [field]: val }).eq('id', id);
    setRecords(prev => prev.map(r => r.id === id ? { ...r, [field]: val } : r));
  };

  const deleteRecord = async (id) => {
    if (!confirm('確認刪除？')) return;
    await db.from('vendor_settlements').delete().eq('id', id);
    load();
  };

  const uploadRecordImg = async (id, file) => {
    setUploading(true);
    try {
      const url = await uploadToStorage(file, `settlements/${project.id}`);
      await updateRecord(id, 'image_url', url);
    } catch(e) { toast('上傳失敗', 'error'); }
    setUploading(false);
  };

  const savePayment = async () => {
    await db.from('vendor_settlements').update({
      paid_amount: parseFloat(payForm.paid_amount) || 0,
      payment_date: payForm.payment_date || null,
      is_paid: payForm.is_paid || false,
      notes: payForm.notes || '',
    }).eq('id', showPayModal);
    toast('已儲存付款記錄'); setShowPayModal(null); load();
  };

  // ── Drill-in view ──
  if (selectedCat) {
    const recs = catRecords(selectedCat.name);
    const catQuoted = catWorkItems(selectedCat.id).reduce((s, i) => s + i.unit_price * i.quantity, 0);
    const catVendor = recs.reduce((s, r) => s + (r.actual_amount || 0), 0);
    const catPaid = recs.reduce((s, r) => s + (r.paid_amount || 0), 0);
    return (
      <div>
        {/* Back + header */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 16 }}>
          <button className="btn btn-ghost btn-sm" onClick={() => setSelectedCat(null)}>← 返回</button>
          <div>
            <div className="section-title">{selectedCat.name}</div>
            <div style={{ fontSize: 12, color: '#888', marginTop: 2 }}>
              業主報價 <strong style={{ color: '#2E4D5C' }}>{fmt(catQuoted)}</strong>　
              廠商費用 <strong style={{ color: '#6B4835' }}>{fmt(catVendor)}</strong>　
              {catVendor > 0 && <span style={{ color: catQuoted - catVendor >= 0 ? '#3A5240' : '#8B2E2E', fontWeight: 600 }}>
                差額 {catQuoted - catVendor >= 0 ? '+' : ''}{fmt(catQuoted - catVendor)}
              </span>}
            </div>
          </div>
          <div style={{ marginLeft: 'auto', display: 'flex', gap: 8 }}>
            <button className="btn btn-ghost btn-sm" style={{ color: '#6B4835', borderColor: '#C8B8A8' }} onClick={() => { setShowImport(true); setImportText(''); setImportPreview([]); }}>匯入廠商估價</button>
            <button className="btn btn-primary btn-sm" onClick={addBlankRow}>＋ 手動新增</button>
          </div>
        </div>

        <div className="card">
          <div className="table-wrap">
            <table>
              <thead>
                <tr style={{ background: '#D8D8D8' }}>
                  <th>廠商名稱</th>
                  <th>品項說明</th>
                  <th style={{ width: 60 }}>單位</th>
                  <th className="num" style={{ width: 70 }}>數量</th>
                  <th className="num" style={{ width: 110, color: '#6B4835' }}>廠商報價</th>
                  <th className="num" style={{ width: 100 }}>已付金額</th>
                  <th style={{ width: 80 }}>狀態</th>
                  <th style={{ width: 60 }}>附件</th>
                  <th style={{ width: 100 }}>操作</th>
                </tr>
              </thead>
              <tbody>
                {recs.map(r => {
                  const unpaid = Math.max(0, (r.actual_amount||0) - (r.paid_amount||0));
                  return (
                    <tr key={r.id} style={{ background: '#fff' }}>
                      <td>
                        <select value={r.vendor_name||''} onChange={e => updateRecord(r.id,'vendor_name',e.target.value)}
                          style={{ border:'none', background:'transparent', width:'100%', fontSize:13, color: r.vendor_name ? '#1A1A1A' : '#AAA', cursor:'pointer', outline:'none' }}>
                          <option value="">選擇廠商...</option>
                          {vendors.map(v => <option key={v.id} value={v.name}>{v.name}</option>)}
                          <option value={r.vendor_name||''} style={{ display: r.vendor_name && !vendors.find(v=>v.name===r.vendor_name) ? 'block' : 'none' }}>{r.vendor_name}</option>
                        </select>
                      </td>
                      <td><InlineEdit value={r.work_item||''} onChange={val => updateRecord(r.id,'work_item',val)} placeholder="品項說明" /></td>
                      <td><InlineEdit value={r.unit||''} onChange={val => updateRecord(r.id,'unit',val)} style={{ width:50, textAlign:'center' }} /></td>
                      <td className="num"><InlineEdit type="number" value={r.quantity||1} onChange={val => updateRecord(r.id,'quantity',+val)} style={{ width:55, textAlign:'right' }} /></td>
                      <td className="num" style={{ color:'#6B4835', fontWeight:600 }}>
                        <InlineEdit type="number" value={r.actual_amount||0} onChange={val => updateRecord(r.id,'actual_amount',+val)} style={{ width:90, textAlign:'right' }} />
                      </td>
                      <td className="num" style={{ color:'#3A5240' }}>{r.paid_amount > 0 ? fmt(r.paid_amount) : <span style={{ color:'#CCC' }}>–</span>}</td>
                      <td>
                        {r.is_paid
                          ? <span style={{ fontSize:11, background:'#E8F0EC', color:'#3A5240', padding:'2px 8px', borderRadius:10 }}>已付清</span>
                          : unpaid > 0 ? <span style={{ fontSize:11, color:'#8B2E2E' }}>欠 {fmt(unpaid)}</span>
                          : <span style={{ fontSize:11, color:'#CCC' }}>–</span>}
                      </td>
                      <td style={{ textAlign:'center' }}>
                        {r.image_url
                          ? <img src={r.image_url} alt="" style={{ width:32, height:32, objectFit:'cover', borderRadius:4, cursor:'pointer', border:'1px solid #E0E0E0' }} onClick={() => window.open(r.image_url,'_blank')} />
                          : <label style={{ cursor:'pointer', color:'#AAA', fontSize:11 }}>
                              上傳<input type="file" accept="image/*" style={{ display:'none' }} onChange={async e => { if(e.target.files[0]) await uploadRecordImg(r.id, e.target.files[0]); e.target.value=''; }} />
                            </label>}
                      </td>
                      <td>
                        <div style={{ display:'flex', gap:4 }}>
                          <button className="btn btn-xs btn-ghost" onClick={() => { setShowPayModal(r.id); setPayForm({ paid_amount: String(r.paid_amount||''), payment_date: r.payment_date||'', is_paid: r.is_paid||false, notes: r.notes||'' }); }}>付款</button>
                          <button className="btn btn-xs" style={{ background:'#FFF0F0', color:'#8B2E2E', border:'1px solid #EEC0C0' }} onClick={() => deleteRecord(r.id)}>刪</button>
                        </div>
                      </td>
                    </tr>
                  );
                })}
                {recs.length === 0 && <tr><td colSpan={9} style={{ textAlign:'center', color:'#CCC', padding:24, fontSize:12 }}>尚無廠商估價，點「匯入廠商估價」或「手動新增」</td></tr>}
              </tbody>
              {recs.length > 0 && (
                <tfoot>
                  <tr style={{ background:'#F5F5F5', borderTop:'2px solid #D0D0D0', fontWeight:700 }}>
                    <td colSpan={4} style={{ padding:'7px 12px', textAlign:'right', color:'#666', fontSize:12 }}>小計</td>
                    <td className="num" style={{ padding:'7px 12px', color:'#6B4835' }}>{fmt(catVendor)}</td>
                    <td className="num" style={{ padding:'7px 12px', color:'#3A5240' }}>{catPaid > 0 ? fmt(catPaid) : '–'}</td>
                    <td colSpan={3} style={{ padding:'7px 12px', fontSize:12, color:'#8B2E2E' }}>{catVendor - catPaid > 0 ? '尚欠 ' + fmt(catVendor - catPaid) : ''}</td>
                  </tr>
                </tfoot>
              )}
            </table>
          </div>
        </div>

        {/* Import modal */}
        <Modal open={showImport} title={'匯入廠商估價 — ' + selectedCat.name} onClose={() => setShowImport(false)}
          footer={<><button className="btn btn-ghost" onClick={() => setShowImport(false)}>取消</button><button className="btn btn-primary" onClick={doImport} disabled={!importPreview.length}>匯入 {importPreview.length > 0 ? importPreview.length + ' 筆' : ''}</button></>}>


          <label style={{ display:'inline-flex', alignItems:'center', gap:8, cursor:'pointer', padding:'6px 12px', border:'1px solid #D8D8D8', borderRadius:6, background:'#F8F8F8', fontSize:12, color:'#555', marginBottom:10 }}>
            上傳 Excel / CSV
            <input type="file" accept=".xlsx,.xls,.csv" style={{ display:'none' }} onChange={async e => { if(e.target.files[0]) { await handleImportFile(e.target.files[0]); e.target.value=''; } }} />
          </label>
          <div className="form-group">
            <label className="form-label">或貼上文字</label>
            <IMETextarea className="form-textarea" style={{ minHeight:80, fontSize:12, fontFamily:'monospace' }}
              value={importText} onChange={val => { setImportText(val); setImportPreview(parseText(val)); }}
              placeholder={'品項說明\t單位\t數量\t金額\n磁磚鋪設\t坪\t20\t3500'} />
          </div>
          {importPreview.length > 0 && (
            <div>
              <div style={{ fontSize:12, color:'#555', fontWeight:600, marginBottom:6 }}>預覽 {importPreview.length} 筆　<button style={{ fontSize:11, color:'#AAA', background:'none', border:'none', cursor:'pointer' }} onClick={() => setImportPreview([])}>清除</button></div>
              <div style={{ maxHeight:160, overflowY:'auto', border:'1px solid #E0E0E0', borderRadius:6 }}>
                <table style={{ width:'100%', borderCollapse:'collapse', fontSize:11 }}>
                  <thead><tr style={{ background:'#D8D8D8' }}>
                    <th style={{ padding:'5px 8px', textAlign:'left' }}>廠商</th>
                    <th style={{ padding:'5px 8px', textAlign:'left' }}>品項</th>
                    <th style={{ padding:'5px 8px', textAlign:'center' }}>單位</th>
                    <th style={{ padding:'5px 8px', textAlign:'right' }}>數量</th>
                    <th style={{ padding:'5px 8px', textAlign:'right', color:'#6B4835' }}>金額</th>
                  </tr></thead>
                  <tbody>{importPreview.map((r,i) => (
                    <tr key={i} style={{ borderBottom:'1px solid #F0F0F0' }}>
                      <td style={{ padding:'4px 8px', color:'#888' }}>{r.vendor_name||'–'}</td>
                      <td style={{ padding:'4px 8px' }}>{r.work_item}</td>
                      <td style={{ padding:'4px 8px', textAlign:'center', color:'#888' }}>{r.unit||'–'}</td>
                      <td style={{ padding:'4px 8px', textAlign:'right' }}>{r.quantity}</td>
                      <td style={{ padding:'4px 8px', textAlign:'right', color:'#6B4835', fontWeight:500 }}>{fmt(r.actual_amount)}</td>
                    </tr>
                  ))}</tbody>
                </table>
              </div>
            </div>
          )}
        </Modal>

        {/* Payment modal */}
        <Modal open={!!showPayModal} title="記錄付款" onClose={() => setShowPayModal(null)}
          footer={<><button className="btn btn-ghost" onClick={() => setShowPayModal(null)}>取消</button><button className="btn btn-primary" onClick={savePayment}>儲存</button></>}>
          <div className="grid-2">
            <div className="form-group"><label className="form-label">已付金額</label>
              <input className="form-input" type="number" value={payForm.paid_amount||''} onChange={e => setPayForm(p => ({ ...p, paid_amount: e.target.value }))} /></div>
            <div className="form-group"><label className="form-label">付款日期</label>
              <input className="form-input" type="date" value={payForm.payment_date||''} onChange={e => setPayForm(p => ({ ...p, payment_date: e.target.value }))} /></div>
          </div>
          <label style={{ display:'flex', alignItems:'center', gap:8, cursor:'pointer', marginBottom:10 }}>
            <input type="checkbox" checked={payForm.is_paid||false} onChange={e => setPayForm(p => ({ ...p, is_paid: e.target.checked }))} style={{ width:16, height:16, accentColor:'#3A5240' }} />
            <span style={{ fontSize:13 }}>已全額付清</span>
          </label>
          <div className="form-group"><label className="form-label">備註</label>
            <IMETextarea className="form-textarea" style={{ minHeight:60 }} value={payForm.notes||''} onChange={val => setPayForm(p => ({ ...p, notes: val }))} /></div>
        </Modal>
      </div>
    );
  }

  // ── Overview table ──
  return (
    <div>
      {/* Summary cards */}
      <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(150px, 1fr))', gap:12, marginBottom:24 }}>
        {[
          { label:'業主報價總額', value:fmt(quoted), color:'#2E4D5C' },
          { label:'廠商費用合計', value:fmt(totalVendor), color:'#6B4835' },
          { label:'估算毛利', value:fmt(quoted - totalVendor), color:(quoted - totalVendor) >= 0 ? '#3A5240' : '#8B2E2E' },
          { label:'尚未付廠商', value:fmt(Math.max(0, totalVendor - totalPaid)), color:(totalVendor - totalPaid) > 0 ? '#8B2E2E' : '#3A5240' },
        ].map(c => (
          <div key={c.label} style={{ background:'#fff', borderRadius:8, border:'1px solid #E0E0E0', padding:'14px 16px', boxShadow:'0 2px 8px rgba(0,0,0,0.08)' }}>
            <div style={{ fontSize:11, color:'#888', marginBottom:4 }}>{c.label}</div>
            <div style={{ fontSize:18, fontWeight:700, color:c.color }}>{c.value}</div>
          </div>
        ))}
      </div>

      <div className="card">
        <div className="card-header"><div className="card-title">各大項成本對照　<span style={{ fontSize:12, fontWeight:400, color:'#888' }}>點擊大項進入填寫廠商估價</span></div></div>
        <div className="table-wrap">
          <table>
            <thead>
              <tr style={{ background:'#D8D8D8' }}>
                <th style={{ color:'#222' }}>大項名稱</th>
                <th className="num" style={{ color:'#2E4D5C' }}>業主報價</th>
                <th className="num" style={{ color:'#6B4835' }}>廠商費用</th>
                <th className="num" style={{ color:'#222' }}>差額</th>
                <th className="num" style={{ color:'#3A5240' }}>已付金額</th>
                <th style={{ color:'#222' }}>狀態</th>
              </tr>
            </thead>
            <tbody>
              {cats.map((cat, ci) => {
                const q = catWorkItems(cat.id).reduce((s, i) => s + i.unit_price * i.quantity, 0);
                const recs = catRecords(cat.name);
                const v = recs.reduce((s, r) => s + (r.actual_amount||0), 0);
                const p = recs.reduce((s, r) => s + (r.paid_amount||0), 0);
                const diff = q - v;
                const unpaid = v - p;
                return (
                  <tr key={cat.id} style={{ cursor:'pointer' }} onClick={() => setSelectedCat(cat)}>
                    <td>
                      <span style={{ color:'#888', fontSize:12, marginRight:6 }}>{String.fromCharCode(65+ci)}.</span>
                      <span style={{ fontWeight:500 }}>{cat.name}</span>
                      {recs.length > 0 && <span style={{ fontSize:11, color:'#888', marginLeft:8 }}>{recs.length} 筆</span>}
                    </td>
                    <td className="num" style={{ color:'#2E4D5C' }}>{fmt(q)}</td>
                    <td className="num" style={{ color: v > 0 ? '#6B4835' : '#CCC', fontWeight: v > 0 ? 600 : 400 }}>
                      {v > 0 ? fmt(v) : <span style={{ fontSize:12 }}>未登錄</span>}
                    </td>
                    <td className="num" style={{ color: v > 0 ? (diff >= 0 ? '#3A5240' : '#8B2E2E') : '#CCC', fontWeight: v > 0 ? 600 : 400 }}>
                      {v > 0 ? (diff >= 0 ? '+' : '') + fmt(diff) : '–'}
                    </td>
                    <td className="num" style={{ color: p > 0 ? '#3A5240' : '#CCC' }}>{p > 0 ? fmt(p) : '–'}</td>
                    <td>
                      {v === 0 ? <span style={{ fontSize:11, color:'#CCC' }}>未填寫</span>
                        : unpaid <= 0 ? <span style={{ fontSize:11, background:'#E8F0EC', color:'#3A5240', padding:'2px 8px', borderRadius:10 }}>已付清</span>
                        : <span style={{ fontSize:11, color:'#8B2E2E' }}>欠 {fmt(unpaid)}</span>}
                    </td>
                  </tr>
                );
              })}
            </tbody>
            <tfoot>
              <tr style={{ background:'#F5F5F5', fontWeight:700, borderTop:'2px solid #D0D0D0' }}>
                <td style={{ padding:'8px 12px', color:'#555' }}>合計</td>
                <td className="num" style={{ padding:'8px 12px', color:'#2E4D5C' }}>{fmt(quoted)}</td>
                <td className="num" style={{ padding:'8px 12px', color:'#6B4835' }}>{fmt(totalVendor)}</td>
                <td className="num" style={{ padding:'8px 12px', color:(quoted-totalVendor) >= 0 ? '#3A5240' : '#8B2E2E' }}>
                  {totalVendor > 0 ? ((quoted-totalVendor) >= 0 ? '+' : '') + fmt(quoted-totalVendor) : '–'}
                </td>
                <td className="num" style={{ padding:'8px 12px', color:'#3A5240' }}>{totalPaid > 0 ? fmt(totalPaid) : '–'}</td>
                <td style={{ padding:'8px 12px', fontSize:12, color:'#8B2E2E' }}>
                  {totalVendor - totalPaid > 0 ? '尚欠 ' + fmt(totalVendor - totalPaid) : ''}
                </td>
              </tr>
            </tfoot>
          </table>
        </div>
      </div>
    </div>
  );
}


function PaymentTab({ project }) {
  const [stages, setStages] = useState([]);
  const [workItems, setWorkItems] = useState([]);
  const [purchaseItems, setPurchaseItems] = useState([]);

  const load = useCallback(async () => {
    const { data: s } = await db.from('payment_stages').select('*').eq('project_id', project.id).order('sort_order');
    const { data: wi } = await db.from('work_items').select('*').eq('project_id', project.id);
    const { data: pi } = await db.from('purchase_items').select('*').eq('project_id', project.id);
    setStages(s || []); setWorkItems(wi || []); setPurchaseItems(pi || []);
  }, [project.id]);

  useEffect(() => { load(); }, [load]);

  const workTotal = workItems.reduce((s, i) => s + i.unit_price * i.quantity, 0);
  const purchaseTotal = purchaseItems.reduce((s, i) => s + i.unit_price * i.quantity, 0);
  const mgmtFee = workTotal * ((project.management_fee_rate || 7) / 100);
  const designFee = (project.area_sqm || 0) * (project.design_fee_per_sqm || 0);
  const subtotal = workTotal + mgmtFee + designFee;
  const tax = project.tax_enabled ? subtotal * ((project.tax_rate || 5) / 100) : 0;
  const grandTotal = subtotal + tax + purchaseTotal;

  const totalPaid = stages.reduce((s, st) => s + (st.paid_amount || 0), 0);
  const totalAmount = stages.reduce((s, st) => s + (st.amount || 0), 0);

  const addStage = async () => {
    await db.from('payment_stages').insert({
      project_id: project.id, name: '新增期款', percentage: 0, amount: 0, sort_order: stages.length
    });
    load();
  };

  const updateStage = async (id, field, val) => {
    await db.from('payment_stages').update({ [field]: val }).eq('id', id);
    setStages(prev => prev.map(s => s.id === id ? { ...s, [field]: val } : s));
  };

  const deleteStage = async (id) => { await db.from('payment_stages').delete().eq('id', id); load(); };

  const statusLabel = (stage) => {
    if (!stage.amount) return '未設定';
    if (stage.paid_amount >= stage.amount) return '已結清';
    if (stage.paid_amount > 0) return '部分付款';
    return '未付款';
  };

  const statusColor = (stage) => {
    const s = statusLabel(stage);
    if (s === '已結清') return '#3A5240';
    if (s === '部分付款') return '#666';
    return '#888';
  };

  const stagesTotal = stages.reduce((sum, st) => sum + (st.amount || 0), 0);
  const diff = grandTotal - stagesTotal;

  const bringInDiff = async (s) => {
    const newAmt = (s.amount || 0) + diff;
    if (newAmt < 0) return toast('校正後金額為負數，請確認', 'error');
    await updateStage(s.id, 'amount', newAmt);
    toast('已帶入差額 ' + (diff >= 0 ? '+' : '') + Math.round(diff).toLocaleString());
  };

  return (
    <div>
      <div className="flex justify-between items-center mb-4">
        <div>
          <div className="section-title">請款單</div>
          <div className="text-sm text-muted mt-1">
            最新專案總額：<strong style={{ color: '#2E4D5C' }}>{fmt(grandTotal)}</strong>
          </div>
        </div>
        <div className="flex gap-2">
          <button className="btn btn-primary btn-sm" onClick={addStage}>＋ 新增請款階段</button>
        </div>
      </div>

      {/* Stages management */}
      <div className="card mb-4">
        <div className="card-header"><div className="card-title">請款階段明細管理</div></div>
        <div className="table-wrap">
          <table>
            <thead>
              <tr>
                <th style={{ width: 30 }}>本期</th>
                <th>請款階段名稱</th>
                <th style={{ width: 80 }} className="num">快算比例(%)</th>
                <th style={{ width: 110 }} className="num">應收金額</th>
                <th style={{ width: 110 }}>預計請款日</th>
                <th style={{ width: 110 }} className="num">已收金額</th>
                <th style={{ width: 110 }}>付款日期</th>
                <th style={{ width: 100 }}>操作</th>
              </tr>
            </thead>
            <tbody>
              {stages.map(s => (
                <tr key={s.id}>
                  <td style={{ textAlign: 'center' }}>
                    <input type="radio" checked={!!s.is_current} onChange={() => {
                      stages.forEach(st => db.from('payment_stages').update({ is_current: st.id === s.id }).eq('id', st.id));
                      setStages(prev => prev.map(st => ({ ...st, is_current: st.id === s.id })));
                    }} /></td>
                  <td><InlineEdit value={s.name} onChange={val => updateStage(s.id, 'name', val)} /></td>
                  <td className="num">
                    <InlineEdit style={{ textAlign: 'right', width: 60 }} type="number"
                      value={s.percentage || 0} onChange={val => {
                        const pct = +val;
                        const amt = Math.round(grandTotal * pct / 100);
                        updateStage(s.id, 'percentage', pct);
                        updateStage(s.id, 'amount', amt);
                      }} />
                  </td>
                  <td className="num"><InlineEdit style={{ textAlign: 'right', width: 90 }} type="number" value={s.amount || 0} onChange={val => updateStage(s.id, 'amount', +val)} /></td>
                  <td><input className="form-input-sm" type="date" value={s.planned_date || ''} onChange={e => updateStage(s.id, 'planned_date', e.target.value)} /></td>
                  <td className="num" style={{ color: s.paid_amount > 0 ? '#3A5240' : '#888' }}>
                    <InlineEdit style={{ textAlign: 'right', width: 90 }} type="number" value={s.paid_amount || 0} onChange={val => updateStage(s.id, 'paid_amount', +val)} />
                  </td>
                  <td><input className="form-input-sm" type="date" value={s.paid_date || ''} onChange={e => updateStage(s.id, 'paid_date', e.target.value)} /></td>
                  <td>
                    <div style={{ display: 'flex', gap: 4, alignItems: 'center' }}>
                      <span style={{ fontSize: 11, color: statusColor(s), whiteSpace: 'nowrap' }}>{statusLabel(s)}</span>
                      {Math.abs(diff) > 1 && (
                        <button className="btn btn-xs" style={{ background: '#F5F0EC', color: '#6B4835', border: '1px solid #C8B8A8', borderRadius: 4, padding: '2px 6px', fontSize: 10, whiteSpace: 'nowrap' }}
                          onClick={() => bringInDiff(s)}>
                          帶入{diff > 0 ? '+' : ''}{Math.round(diff).toLocaleString()}
                        </button>
                      )}
                      <button className="btn-icon" style={{ color: '#8B2E2E', fontSize: 13 }} onClick={() => deleteStage(s.id)}>✕</button>
                    </div>
                  </td>
                </tr>
              ))}
              {stages.length === 0 && <tr><td colSpan={8} style={{ padding: '24px', textAlign: 'center', color: '#CCC', fontSize: 12 }}>尚無請款階段</td></tr>}
            </tbody>
          </table>
        </div>
        <div style={{ padding: '12px 16px', borderTop: '1px solid #F0F0EE', display: 'flex', justifyContent: 'space-between', fontSize: 13 }}>
          <span>設定總計：<strong style={{ color: totalAmount === grandTotal ? '#3A5240' : '#666' }}>{fmt(totalAmount)} {totalAmount === grandTotal ? '（正確）' : '（與專案總額不符）'}</strong></span>
          <span>未收尾款：<strong style={{ color: '#8B2E2E' }}>{fmt(Math.max(0, totalAmount - totalPaid))}</strong></span>
        </div>
      </div>

      {/* Invoice preview */}
      <div className="card" style={{ padding: 24 }}>
        <div style={{ textAlign: 'center', marginBottom: 24, fontSize: 20, fontWeight: 700, letterSpacing: '0.3em' }}>工 程 請 款 單</div>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12, marginBottom: 16, fontSize: 13 }}>
          <div>工程名稱：{project.name}</div>
          <div>聯絡人：{project.contact_person}</div>
          <div>聯絡電話：{project.contact_phone}</div>
        </div>
        <div className="table-wrap mb-4">
          <table>
            <thead>
              <tr><th>階段名稱</th><th className="num">應收金額</th><th className="num">已付金額</th><th>付款日期</th><th>結算狀態</th></tr>
            </thead>
            <tbody>
              {stages.map(s => (
                <tr key={s.id} style={s.is_current ? { background: '#EDF0EC' } : {}}>
                  <td>{s.is_current ? <strong>【本期】{s.name}</strong> : s.name}</td>
                  <td className="num">{fmt(s.amount)}</td>
                  <td className="num" style={{ color: s.paid_amount > 0 ? '#3A5240' : '#888' }}>{s.paid_amount ? fmt(s.paid_amount) : '-'}</td>
                  <td>{fmtDate(s.paid_date)}</td>
                  <td><span style={{ color: statusColor(s), fontWeight: 500, fontSize: 12 }}>{statusLabel(s)}</span></td>
                </tr>
              ))}
            </tbody>
            <tfoot>
              <tr style={{ background: '#F8F8F6' }}>
                <td style={{ padding: '10px 12px', fontWeight: 700 }}>總計</td>
                <td className="num" style={{ fontWeight: 700 }}>{fmt(totalAmount)}</td>
                <td className="num" style={{ color: '#333', fontWeight: 700 }}>{fmt(totalPaid)}</td>
                <td></td>
                <td style={{ color: '#8B2E2E', fontWeight: 700 }}>未收尾款：{fmt(Math.max(0, totalAmount - totalPaid))}</td>
              </tr>
            </tfoot>
          </table>
        </div>
        {(() => {
          const currentStage = stages.find(s => s.is_current);
          const prevUnpaid = stages.filter(s => !s.is_current && (s.paid_amount < s.amount)).reduce((acc, s) => acc + (s.amount - (s.paid_amount || 0)), 0);
          if (!currentStage) return null;
          const thisTotal = (currentStage.amount || 0) + prevUnpaid;
          return (
            <div style={{ border: '2px solid #2E4D5C', borderRadius: 8, padding: '16px 20px' }}>
              <div style={{ fontSize: 13, marginBottom: 6 }}>本期請款項目：{currentStage.name}</div>
              <div style={{ fontSize: 13 }}>本期表定金額：{fmt(currentStage.amount)}</div>
              {prevUnpaid > 0 && <div style={{ fontSize: 13, color: '#8B2E2E' }}>前期未結餘額：+{fmt(prevUnpaid)}</div>}
              <div style={{ fontSize: 20, fontWeight: 800, color: '#8B2E2E', marginTop: 8 }}>本期總計應匯款：{fmt(thisTotal)}</div>
            </div>
          );
        })()}
      </div>
    </div>
  );
}

function SupabaseSettings({ user }) {
  const [pw, setPw] = useState('');
  const [unlocked, setUnlocked] = useState(false);
  const [sbUrl, setSbUrl] = useState(localStorage.getItem('sb_url') || DEFAULT_SB_URL);
  const [sbKey, setSbKey] = useState(localStorage.getItem('sb_key') || DEFAULT_SB_KEY);

  const verify = async () => {
    const { data } = await db.from('users').select('*').eq('username', user.username).eq('password', pw).single();
    if (!data) return toast('密碼錯誤', 'error');
    setUnlocked(true); setPw('');
  };

  const save = () => {
    localStorage.setItem('sb_url', sbUrl);
    localStorage.setItem('sb_key', sbKey);
    toast('已儲存，重新載入中...');
    setTimeout(() => window.location.reload(), 1000);
  };

  const reset = () => {
    localStorage.removeItem('sb_url'); localStorage.removeItem('sb_key');
    toast('已還原預設，重新載入中...');
    setTimeout(() => window.location.reload(), 1000);
  };

  if (!unlocked) return (
    <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
      <input className="form-input" type="password" placeholder="輸入登入密碼解鎖" value={pw}
        onChange={e => setPw(e.target.value)} onKeyDown={e => e.key === 'Enter' && verify()}
        style={{ maxWidth: 220 }} />
      <button className="btn btn-ghost btn-sm" onClick={verify}>解鎖</button>
    </div>
  );

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
      <div className="form-group"><label className="form-label">Supabase Project URL</label>
        <input className="form-input" value={sbUrl} onChange={e => setSbUrl(e.target.value)} /></div>
      <div className="form-group"><label className="form-label">Supabase API Key (Publishable)</label>
        <input className="form-input" value={sbKey} onChange={e => setSbKey(e.target.value)} /></div>
      <div style={{ display: 'flex', gap: 8 }}>
        <button className="btn btn-primary btn-sm" onClick={save}>儲存並重新載入</button>
        <button className="btn btn-ghost btn-sm" onClick={reset}>還原預設值</button>
      </div>
    </div>
  );
}

function StageTemplateAdmin() {
  const [templates, setTemplates] = useState([]);
  const [expanded, setExpanded] = useState({});
  const [newContent, setNewContent] = useState({});
  const [initialized, setInitialized] = useState(false);

  const STAGE_NAMES = {
    consult:'初次洽談', survey:'丈量現勘', layout:'平面配置討論',
    design:'設計定案', quote:'估價／簽約', prepare:'備料開工',
    construct:'施工中', inspect:'驗收', handover:'完工交屋',
  };
  const STAGE_KEYS = Object.keys(STAGE_NAMES);

  const load = useCallback(async () => {
    const { data } = await db.from('stage_templates').select('*').order('stage_key').order('sort_order');
    setTemplates(data || []);
    setInitialized(true);
  }, []);

  useEffect(() => { load(); }, [load]);

  useEffect(() => {
    if (initialized && templates.length === 0) initTemplates();
  }, [initialized, templates.length]);
  const initTemplates = async () => {
    const rows = [];
    DEFAULT_STAGES.forEach((s, si) => {
      (DEFAULT_CHECKLIST[s.key] || []).forEach((item, ci) => {
        rows.push({ stage_key: s.key, stage_name: s.name, content: typeof item === 'string' ? item : item.content, sort_order: ci });
      });
    });
    await db.from('stage_templates').insert(rows);
    toast('已初始化範本'); load();
  };

  const addTemplate = async (stageKey) => {
    const content = newContent[stageKey];
    if (!content?.trim()) return;
    const list = templates.filter(t => t.stage_key === stageKey);
    await db.from('stage_templates').insert({ stage_key: stageKey, stage_name: STAGE_NAMES[stageKey], content: content.trim(), sort_order: list.length });
    setNewContent(p => ({ ...p, [stageKey]: '' }));
    load();
  };

  const deleteTemplate = async (id) => {
    await db.from('stage_templates').delete().eq('id', id);
    setTemplates(prev => prev.filter(t => t.id !== id));
  };

  const updateTemplate = async (id, content) => {
    await db.from('stage_templates').update({ content }).eq('id', id);
    setTemplates(prev => prev.map(t => t.id === id ? { ...t, content } : t));
  };

  return (
    <div className="admin-section">
      <div className="admin-section-header">
        <span>專案歷程範本（新案子預設清單）</span>
      </div>
      <div className="admin-section-body">
        <div style={{ fontSize: 12, color: '#888', marginBottom: 12 }}>
          編輯各階段的預設 Checklist，新建專案時會自動帶入。修改此處不影響現有專案。
        </div>
        {STAGE_KEYS.map(key => {
          const stageItems = templates.filter(t => t.stage_key === key);
          const isOpen = expanded[key];
          return (
            <div key={key} style={{ border: '1px solid #E0E0E0', borderRadius: 6, marginBottom: 8, overflow: 'hidden' }}>
              <div style={{ background: '#F0F0F0', padding: '8px 14px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', cursor: 'pointer' }}
                onClick={() => setExpanded(p => ({ ...p, [key]: !p[key] }))}>
                <span style={{ fontWeight: 600, fontSize: 13 }}>{STAGE_NAMES[key]}</span>
                <span style={{ fontSize: 12, color: '#888' }}>{stageItems.length} 項 {isOpen ? '▲' : '▼'}</span>
              </div>
              {isOpen && (
                <div style={{ padding: '10px 14px' }}>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 4, marginBottom: 8 }}>
                    {stageItems.map((t, i) => (
                      <div key={t.id} style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
                        <span style={{ fontSize: 11, color: '#AAA', width: 20, flexShrink: 0 }}>{i+1}.</span>
                        <input className="form-input form-input-sm" style={{ flex: 1, fontSize: 12 }}
                          value={t.content} onChange={e => updateTemplate(t.id, e.target.value)} />
                        <button onClick={() => deleteTemplate(t.id)} style={{ background: 'none', border: 'none', color: '#CCC', cursor: 'pointer', fontSize: 14 }}>✕</button>
                      </div>
                    ))}
                    {stageItems.length === 0 && <div style={{ fontSize: 12, color: '#CCC' }}>尚無項目</div>}
                  </div>
                  <div style={{ display: 'flex', gap: 6 }}>
                    <IMEInput className="form-input form-input-sm" style={{ flex: 1 }}
                      value={newContent[key] || ''} onChange={val => setNewContent(p => ({ ...p, [key]: val }))}
                      placeholder="新增項目..." onKeyDown={e => e.key === 'Enter' && addTemplate(key)} />
                    <button className="btn btn-ghost btn-sm" onClick={() => addTemplate(key)}>＋ 新增</button>
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

        <div className="admin-section-body">
          <div style={{ fontSize: 13, color: '#555', marginBottom: 14, lineHeight: 1.8 }}>
            將所有系統資料匯出為 JSON 備份檔，包含：<br />

          </div>
          <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap' }}>
            <button className="btn btn-primary" onClick={async () => {
              toast('備份中，請稍候...');
              try {
                const tables = [
                  'projects','work_categories','work_items','purchase_categories','purchase_items',
                  'schedule_items','schedule_events','site_logs','meeting_records','meeting_items',
                  'todos','gallery','payment_stages','change_orders',
                  'item_templates','vendor_settlements','vendors','project_stages','stage_checklist','stage_templates','settings','bank_accounts','holidays','users','project_members'
                ];
                const backup = { version: 1, created_at: new Date().toISOString(), tables: {} };
                await Promise.all(tables.map(async t => {
                  const { data, error } = await db.from(t).select('*');
                  backup.tables[t] = error ? [] : (data || []);
                }));
                const json = JSON.stringify(backup, null, 2);
                const blob = new Blob([json], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = '無澀空間_備份_' + new Date().toISOString().slice(0, 10) + '.json';
                a.click();
                URL.revokeObjectURL(url);
                toast('備份完成，共 ' + tables.length + ' 個資料表');
              } catch(e) { toast('備份失敗：' + e.message, 'error'); }
            }}>
              下載完整備份（JSON）
            </button>

            <button className="btn btn-ghost" onClick={() => {
              const input = document.createElement('input');
              input.type = 'file';
              input.accept = '.json';
              input.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const text = await file.text();
                let backup;
                try { backup = JSON.parse(text); } catch { return toast('檔案格式錯誤', 'error'); }
                if (!backup.tables) return toast('不是有效的備份檔', 'error');
                const tableCount = Object.keys(backup.tables).length;
                const date = backup.created_at ? backup.created_at.slice(0, 10) : '未知日期';
                if (!confirm(
                  '⚠️ 還原備份將會覆蓋現有所有資料，此操作無法復原！\n\n' +
                  '備份日期：' + date + '\n' +
                  '包含資料表：' + tableCount + ' 個\n\n' +
                  '確定要還原嗎？'
                )) return;

                toast('還原中，請勿關閉頁面...');
                let successCount = 0;
                const errors = [];
                // Restore order matters (parents before children)
                const order = [
                  'users','settings','bank_accounts','holidays','item_templates',
                  'projects','work_categories','work_items','purchase_categories','purchase_items',
                  'schedule_items','schedule_events','site_logs','meeting_records','meeting_items',
                  'todos','gallery','payment_stages','change_orders','project_members'
                ];
                for (const table of order) {
                  const rows = backup.tables[table];
                  if (!rows || !rows.length) { successCount++; continue; }
                  try {
                    // Delete existing
                    await db.from(table).delete().neq('id', '00000000-0000-0000-0000-000000000000');
                    // Insert in batches of 100
                    for (let i = 0; i < rows.length; i += 100) {
                      const batch = rows.slice(i, i + 100);
                      const { error } = await db.from(table).insert(batch);
                      if (error) { errors.push(table + ': ' + error.message); break; }
                    }
                    successCount++;
                  } catch(err) { errors.push(table + ': ' + err.message); }
                }
                if (errors.length) {
                  toast('還原部分失敗：' + errors.join(', '), 'error');
                } else {
                  toast('還原完成！共還原 ' + successCount + ' 個資料表，3 秒後重新整理...');
                  setTimeout(() => window.location.reload(), 3000);
                }
              };
              input.click();
            }}>
              從備份檔還原
            </button>
          </div>
          <div style={{ marginTop: 10, fontSize: 11, color: '#AAA' }}>
            建議每週備份一次。還原操作將覆蓋現有所有資料，請謹慎使用。
          </div>
        </div>
      </div>

      <Modal open={showAddUser} title="新增帳號" onClose={() => setShowAddUser(false)}

        <div className="form-group"><label className="form-label">帳號 *</label>

        <div className="form-group"><label className="form-label">密碼 *</label>
          <input className="form-input" value={newUser.password} onChange={e => setNewUser(p => ({ ...p, password: e.target.value }))} /></div>
        <div className="form-group"><label className="form-label">顯示名稱</label>
          <input className="form-input" value={newUser.display_name} onChange={e => setNewUser(p => ({ ...p, display_name: e.target.value }))} /></div>
        <div className="form-group"><label className="form-label">角色</label>
          <select className="form-select" value={newUser.role} onChange={e => setNewUser(p => ({ ...p, role: e.target.value }))}>
            <option value="staff">工作人員</option><option value="admin">管理員</option>
          </select>
        </div>
      </Modal>

      <Modal open={showAddBank} title="新增匯款帳號" onClose={() => setShowAddBank(false)}
        footer={<><button className="btn btn-ghost" onClick={() => setShowAddBank(false)}>取消</button><button className="btn btn-primary" onClick={addBank}>新增</button></>}>
        <div className="form-group"><label className="form-label">銀行名稱</label><input className="form-input" value={newBank.bank_name} onChange={e => setNewBank(p => ({ ...p, bank_name: e.target.value }))} /></div>
        <div className="form-group"><label className="form-label">帳號</label><input className="form-input" value={newBank.account_number} onChange={e => setNewBank(p => ({ ...p, account_number: e.target.value }))} /></div>
        <div className="form-group"><label className="form-label">戶名</label><input className="form-input" value={newBank.account_holder} onChange={e => setNewBank(p => ({ ...p, account_holder: e.target.value }))} /></div>
      </Modal>

      <Modal open={showAddHoliday} title="新增假日" onClose={() => setShowAddHoliday(false)}
        footer={<><button className="btn btn-ghost" onClick={() => setShowAddHoliday(false)}>取消</button><button className="btn btn-primary" onClick={addHoliday}>新增</button></>}>
        <div className="form-group"><label className="form-label">假日名稱</label><input className="form-input" value={newHoliday.name} onChange={e => setNewHoliday(p => ({ ...p, name: e.target.value }))} /></div>
        <div className="grid-2">
          <div className="form-group"><label className="form-label">開始日期</label><input className="form-input" type="date" value={newHoliday.start_date} onChange={e => setNewHoliday(p => ({ ...p, start_date: e.target.value }))} /></div>
          <div className="form-group"><label className="form-label">結束日期</label><input className="form-input" type="date" value={newHoliday.end_date} onChange={e => setNewHoliday(p => ({ ...p, end_date: e.target.value }))} /></div>
        </div>
      </Modal>
    </div>
  );
}

function TemplatesTab({ showCost }) {
  const [items, setItems] = useState([]);
